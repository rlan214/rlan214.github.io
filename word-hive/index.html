<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Word Hive">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Word Hive</title>
<link rel="apple-touch-icon" sizes="180x180" href="/word-hive/apple-touch-icon-v2.png">
<link rel="icon" type="image/png" sizes="512x512" href="/word-hive/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Word Hive: weekly spelling test. Kid side = home + test; parent side behind a PIN.
   Colors come from the active season theme (set on :root by JS). */
:root{
  --sky:#FFF6E6; --sky-ink:#2A1F3D; --surface:#FFFFFF; --ink:#2A1F3D; --muted:#7A6F8E; --line:#EFE4D3;
  --accent:#7B4DE0; --accent-deep:#5630B0; --accent-soft:#EFE8FD;
  --honey:#FFB31F; --honey-deep:#C77F00; --honey-soft:#FFF0CC;
  --good:#1FA35B; --good-deep:#137840; --good-soft:#DCF4E6;
  --bad:#E0464C; --bad-deep:#A82C32; --bad-soft:#FCE3E4;
  --on:#FFFFFF; --ground:#F1D9A8; --ground2:#E8C987;
  --f-display:"Baloo 2","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:17px;-webkit-tap-highlight-color:transparent;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- scene (season backdrop) ---------- */
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--sky)}
#scene .p{position:absolute;top:-12vh;left:var(--x);width:var(--s);animation:fall var(--d) linear var(--dl) infinite;opacity:var(--o,1)}
#scene .p > svg{display:block;width:100%;height:auto;animation:sway var(--sw) ease-in-out infinite alternate}
#scene .p.up{top:auto;bottom:-12vh;animation-name:rise}
#scene .p.fly{top:var(--y);left:-14vw;animation-name:flyx}
#scene .p.fly > svg{animation:flap .22s ease-in-out infinite alternate}
#scene .p.still{top:var(--y);animation:twinkle var(--d) ease-in-out var(--dl) infinite alternate}
#scene .p.still > svg{animation:none}
@keyframes fall{to{transform:translateY(126vh)}}
@keyframes rise{to{transform:translateY(-126vh)}}
@keyframes flyx{0%{transform:translate(0,0)}50%{transform:translate(64vw,-4vh)}100%{transform:translate(128vw,2vh)}}
@keyframes sway{from{transform:translateX(-26px) rotate(-28deg)}to{transform:translateX(26px) rotate(32deg)}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.55)}}
@keyframes twinkle{from{opacity:.25;transform:scale(.8)}to{opacity:1;transform:scale(1.1)}}
#scene .sun{position:absolute;right:4vw;top:calc(var(--safe-t) + 56px);width:clamp(70px,11vw,120px);aspect-ratio:1}
#scene .sun .rays{animation:spin 40s linear infinite;transform-origin:50% 50%}
#scene .moon{position:absolute;right:7vw;top:calc(var(--safe-t) + 9vh);width:clamp(80px,12vw,130px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 36% 34%,#FFFBE6,#FFE9A8 55%,#F0CC6A);box-shadow:0 0 50px 16px rgba(255,236,170,.35)}
#scene .moon::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 62% 60%,rgba(200,160,70,.35) 0 9%,transparent 10%),radial-gradient(circle at 40% 70%,rgba(200,160,70,.28) 0 6%,transparent 7%),radial-gradient(circle at 66% 32%,rgba(200,160,70,.25) 0 5%,transparent 6%)}
@keyframes spin{to{transform:rotate(360deg)}}
#scene .ground{position:absolute;left:0;right:0;bottom:0;height:18vh;min-height:110px}
#scene .ground svg{width:100%;height:100%;display:block}
#scene .lights{position:absolute;left:0;right:0;top:calc(var(--safe-t) - 6px);height:36px}
body.has-lights .screen{padding-top:calc(var(--safe-t) + 22px)}
#scene .lights svg{width:100%;height:100%;display:block}
#scene .lights .bulb{animation:blink 1.6s ease-in-out infinite alternate}
@keyframes blink{from{opacity:.45}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#scene *{animation:none!important}}

/* ---------- app shell ---------- */
#app{position:relative;z-index:1;height:100%}
.screen{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding-top:var(--safe-t)}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;flex:none}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;font-family:var(--f-display);font-weight:800;font-size:1.45rem;color:var(--sky-ink);letter-spacing:-.01em}
.brand svg{width:34px;height:38px;filter:drop-shadow(0 2px 0 var(--honey-deep))}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--sky-ink);background:color-mix(in srgb,var(--surface) 55%,transparent);border:2px solid color-mix(in srgb,var(--surface) 40%,transparent)}
.iconbtn svg{width:22px;height:22px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px calc(28px + var(--safe-b))}

.btn{display:block;width:100%;padding:15px 18px;border-radius:18px;font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:.03em;text-transform:uppercase;
  background:var(--accent);color:var(--on);box-shadow:0 5px 0 var(--accent-deep);transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--accent-deep)}
.btn:disabled{opacity:.45;cursor:default}
.btn.honey{background:var(--honey);color:#3A2400;box-shadow:0 5px 0 var(--honey-deep)}
.btn.honey:active:not(:disabled){box-shadow:0 1px 0 var(--honey-deep)}
.btn.good{background:var(--good);box-shadow:0 5px 0 var(--good-deep)}
.btn.good:active:not(:disabled){box-shadow:0 1px 0 var(--good-deep)}
.btn.bad{background:var(--bad);box-shadow:0 5px 0 var(--bad-deep)}
.btn.bad:active:not(:disabled){box-shadow:0 1px 0 var(--bad-deep)}
.btn.ghost{background:var(--surface);color:var(--accent);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active:not(:disabled){box-shadow:0 1px 0 var(--line)}
.btn.sm{font-size:1rem;padding:11px 14px;border-radius:14px}
.row{display:flex;gap:10px}
.row > *{flex:1}

.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 4px 0 var(--line),0 12px 30px rgba(0,0,0,.08)}
.card h3{margin:0 0 4px;font-family:var(--f-display);font-weight:700;font-size:1.2rem}
.card p{margin:0;color:var(--muted)}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted)}

/* hexagons */
.hex{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}

/* ---------- home ---------- */
.hello{padding:8px 4px 2px;color:var(--sky-ink)}
.hello h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,6vw,2.7rem);line-height:1.05;letter-spacing:-.01em}
.hello p{margin:4px 0 0;font-weight:800;opacity:.85}
.hero{display:flex;align-items:center;gap:18px}
.hero .badge{flex:none;width:96px;height:110px;display:grid;place-items:center;filter:drop-shadow(0 5px 0 var(--honey-deep))}
.hero .badge .hex{width:100%;height:100%;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.55),transparent 45%),var(--honey);display:grid;place-items:center;text-align:center;color:#3A2400}
.hero .badge b{display:block;font-family:var(--f-display);font-size:2.4rem;line-height:.9}
.hero .badge small{display:block;font-weight:800;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.hero h3{font-size:1.35rem}
.hero .btn{margin-top:12px}
.comb{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;justify-content:center}
.comb .cell{width:30px;height:35px;background:var(--line)}
.comb .cell.ok{background:var(--honey)}
.comb .cell.miss{background:var(--bad)}
.legend{display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:.82rem;font-weight:800;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:14px;vertical-align:-2px;margin-right:4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day{border-radius:14px;padding:8px 2px;text-align:center;background:var(--sky-soft,var(--honey-soft));border:2px solid transparent;min-width:0}
.day .d{font-size:.75rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.day .s{font-family:var(--f-display);font-weight:700;font-size:1.05rem;line-height:1.2;color:var(--ink)}
.day .s.none{color:var(--muted);opacity:.5}
.day.today{border-color:var(--accent)}
.day.done{background:var(--honey-soft)}
.day.done .s{color:var(--honey-ink,var(--honey-deep))}
.note{margin-top:12px;font-size:.9rem;color:var(--muted);font-weight:700}

/* ---------- test ---------- */
.test .topbar{gap:12px}
.prog{flex:1;display:flex;gap:4px;align-items:center;min-width:0;flex-wrap:nowrap;overflow:hidden}
.prog .cell{flex:1;max-width:26px;aspect-ratio:.87;background:color-mix(in srgb,var(--surface) 60%,transparent)}
.prog .cell.ok{background:var(--honey)}
.prog .cell.miss{background:var(--bad)}
.prog .cell.now{background:var(--surface)}
.count{font-weight:800;color:var(--sky-ink);font-size:.95rem;white-space:nowrap}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:8px 16px;min-height:0}
.round-tag{font-weight:800;color:var(--sky-ink);background:color-mix(in srgb,var(--surface) 60%,transparent);padding:4px 14px;border-radius:999px;font-size:.9rem}
.speak{width:clamp(130px,22vh,170px);aspect-ratio:.87;filter:drop-shadow(0 7px 0 var(--accent-deep));transition:transform .06s,filter .06s}
.speak .hex{width:100%;height:100%;background:radial-gradient(circle at 35% 22%,rgba(255,255,255,.4),transparent 45%),var(--accent);display:grid;place-items:center;color:var(--on)}
.speak svg{width:44%;height:auto}
.speak:active{transform:translateY(5px);filter:drop-shadow(0 2px 0 var(--accent-deep))}
.speak.talking .hex{animation:pulse .8s ease-in-out infinite alternate}
@keyframes pulse{to{background-color:var(--accent-deep)}}
.speak-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pill{padding:10px 16px;border-radius:999px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:800;color:var(--accent);display:flex;align-items:center;gap:6px}
.pill svg{width:18px;height:18px}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.answer{min-height:64px;width:100%;max-width:640px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;padding:8px;background:var(--surface);border:3px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--line)}
.answer .ch{min-width:38px;height:48px;padding:0 4px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink,var(--accent-deep));display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.8rem;line-height:1}
.answer .ch.sp{background:transparent;min-width:18px}
.answer .caret{width:3px;height:40px;background:var(--accent);border-radius:2px;animation:caret 1s steps(1) infinite}
.answer .hint{color:var(--muted);font-weight:700}
@keyframes caret{50%{opacity:0}}
.answer.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.dock{flex:none;background:var(--surface);border-top:2px solid var(--line);padding:12px 10px calc(12px + var(--safe-b));border-radius:24px 24px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.08)}
.kb{display:flex;flex-direction:column;gap:8px;max-width:720px;margin:0 auto}
.kb .r{display:flex;gap:6px;justify-content:center}
.key{flex:1;max-width:62px;height:clamp(48px,7vh,62px);border-radius:12px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:var(--f-display);font-weight:700;font-size:1.5rem;color:var(--ink);display:grid;place-items:center}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line);background:var(--accent-soft)}
.key.wide{max-width:110px;flex:1.6;font-size:1rem;font-family:var(--f-body);font-weight:800;color:var(--muted)}
.key.wide svg{width:26px;height:26px}
.kb .go{margin-top:6px}
.fb{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.fb h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.7rem;display:flex;align-items:center;gap:10px}
.fb h2 svg{width:34px;height:34px;flex:none}
.fb.good h2{color:var(--good-ink,var(--good-deep))}
.fb.bad h2{color:var(--bad-ink,var(--bad-deep))}
.fb .lbl{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fb .word{font-family:var(--f-display);font-weight:700;font-size:2.2rem;letter-spacing:.06em;line-height:1.1;word-break:break-word}
.fb .word .x{color:var(--bad);text-decoration:line-through;text-decoration-thickness:3px}
.fb .word .add{color:var(--good-ink,var(--good-deep));background:var(--good-soft);border-radius:6px;padding:0 2px}
.fb .word.mine{font-size:1.5rem;color:var(--muted)}
.dock.good{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.dock.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}

/* ---------- results ---------- */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:16px;overflow-y:auto}
.bigscore{width:180px;height:207px;filter:drop-shadow(0 8px 0 var(--honey-deep));animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.bigscore .hex{width:100%;height:100%;background:radial-gradient(circle at 35% 22%,rgba(255,255,255,.55),transparent 45%),var(--honey);display:grid;place-items:center;color:#3A2400}
.bigscore b{font-family:var(--f-display);font-weight:800;font-size:3.6rem;line-height:.9;display:block}
.bigscore small{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.85rem}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.center h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:2.2rem;color:var(--sky-ink);line-height:1.05}
.center .sub{color:var(--sky-ink);font-weight:800;opacity:.85;margin:0}
.stars{display:flex;gap:8px}
.stars svg{width:46px;height:46px}
.stars .off{opacity:.25}
.missed{width:100%;max-width:520px;text-align:left}
.missed ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.missed li{background:var(--bad-soft);color:var(--bad-ink,var(--bad-deep));font-weight:800;padding:6px 12px;border-radius:12px;font-size:1.05rem}
.actions{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;margin-top:4px}
.burst{position:fixed;left:50%;top:38%;width:var(--s);z-index:5;pointer-events:none;animation:burst 1.5s cubic-bezier(.2,.8,.3,1) forwards}
.burst svg{width:100%;height:auto;display:block}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}80%{opacity:1}100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) rotate(var(--r)) scale(1);opacity:0}}

/* ---------- PIN ---------- */
.pin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:16px}
.pin h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.8rem;color:var(--sky-ink)}
.dots{display:flex;gap:14px}
.dots i{width:20px;height:23px;background:color-mix(in srgb,var(--surface) 55%,transparent);border:0}
.dots i.on{background:var(--honey)}
.dots.shake{animation:shake .35s}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.pad button{height:68px;border-radius:18px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:var(--f-display);font-weight:700;font-size:1.8rem}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad .blank{visibility:hidden}
.pad svg{width:26px;height:26px}

/* ---------- parent ---------- */
.parent .card h3{display:flex;align-items:center;gap:8px}
.parent .card h3 svg{width:22px;height:22px;color:var(--accent)}
.parent label{display:block;font-weight:800;font-size:.9rem;margin:14px 0 6px}
.parent textarea,.parent input[type=text],.parent select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px}
.parent textarea{min-height:230px;resize:vertical;line-height:1.5;font-family:ui-monospace,Menlo,monospace;font-size:15px}
.parent .help{font-size:.88rem;color:var(--muted);margin-top:6px;line-height:1.45}
.parent .help code{background:var(--accent-soft);color:var(--accent-ink,var(--accent-deep));padding:1px 6px;border-radius:6px;font-weight:700}
.parent .btns{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.parent .btns > *{flex:1;min-width:150px}
.tbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:.95rem}
.tbl th{text-align:left;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 6px;border-bottom:2px solid var(--line)}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.sc{font-family:var(--f-display);font-weight:700;font-size:1.1rem;white-space:nowrap}
.tbl td.ms{color:var(--bad-ink,var(--bad-deep));font-weight:700;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--bad-soft);color:var(--bad-ink,var(--bad-deep));padding:4px 10px;border-radius:10px;font-weight:800;font-size:.9rem}
.chip b{opacity:.7;margin-left:4px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-weight:800}
.switch input{width:52px;height:30px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:999px;position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch input:checked{background:var(--good)}
.switch input:checked::after{left:25px}
input[type=range]{width:100%;accent-color:var(--accent)}
details{border-top:1px solid var(--line);padding:12px 0}
details:first-of-type{border-top:0}
summary{font-weight:800;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:8px;height:8px;border-right:3px solid var(--accent);border-bottom:3px solid var(--accent);transform:rotate(-45deg);transition:transform .15s;flex:none}
details[open] summary::before{transform:rotate(45deg)}
details ol,details ul{margin:10px 0 0;padding-left:22px;color:var(--ink);line-height:1.55}
details li{margin-bottom:4px}
details .tag{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:8px;background:var(--good-soft);color:var(--good-ink,var(--good-deep));margin-left:6px}
details .tag.opt{background:var(--honey-soft);color:var(--honey-ink,var(--honey-deep))}
.past{margin-top:8px}
.past div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.past span{color:var(--muted);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);background:#1d1730;color:#fff;padding:12px 20px;border-radius:14px;font-weight:800;z-index:10;animation:pop .25s}
.empty-state{text-align:center}

/* ---------- frosted glass for the night-sky seasons ---------- */
body.glass .card,body.glass .dock,body.glass .answer,body.glass .pill,body.glass .iconbtn,body.glass .pad button,body.glass .btn.ghost{
  -webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4)}
body.glass .card,body.glass .answer{border:1.5px solid var(--line);box-shadow:0 6px 0 rgba(0,0,0,.22),0 16px 36px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.2)}

.empty-state .btn{margin-top:14px}

<body>
<div id="scene" aria-hidden="true"></div>
<div id="app"></div>
<script>
'use strict';
/* =========================================================
   Word Hive — weekly spelling test
   Parent PIN is hard-coded below.
   ========================================================= */
const PIN = '2013';
const KEY = 'wordhive.v1';

/* ---------- storage ---------- */
function blank(){ return {v:1, week:null, past:[], set:{theme:'auto', voice:'', rate:0.85, autoSent:false, name:'', sound:true}}; }
function load(){
  try{
    const r = JSON.parse(localStorage.getItem(KEY));
    if (r && r.v === 1){ const b = blank(); r.set = Object.assign(b.set, r.set||{}); r.past = r.past||[]; return r; }
  }catch(e){}
  return blank();
}
let S = load();
let view = 'home', T = null, pinBuf = '';
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2,'0');
const dayKey = (d=new Date()) => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const fromKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
function mondayOf(d=new Date()){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
const fmtShort = d => d.toLocaleDateString('en-US',{month:'short', day:'numeric'});
const fmtDay = d => d.toLocaleDateString('en-US',{weekday:'short', month:'numeric', day:'numeric'});
const norm = s => String(s).trim().toLowerCase().replace(/[‘’]/g,"'").replace(/\s+/g,' ');
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
const pick = a => a[Math.floor(Math.random()*a.length)];
function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2200); }

/* ---------- icons ---------- */
const HEX_PTS = '50,3 95,28 95,78 50,103 5,78 5,28';

};

/* ---------- season themes ---------- */
const LEAF = c => `<svg viewBox="0 0 40 40"><path d="M20 2l4 8 7-3-2 8 8 2-7 5 3 6-8-1-2 9-3-8-3 8-2-9-8 1 3-6-7-5 8-2-2-8 7 3z" fill="${c}"/><path d="M20 12v26" stroke="rgba(0,0,0,.25)" stroke-width="1.6" stroke-linecap="round"/></svg>`;

const PETAL = c => `<svg viewBox="0 0 30 30"><path d="M15 2c8 6 9 16 0 26C6 18 7 8 15 2z" fill="${c}"/><path d="M15 6v16" stroke="rgba(255,255,255,.6)" stroke-width="1.4" stroke-linecap="round"/></svg>`;
const BAT = `<svg viewBox="0 0 64 30"><path d="M32 10c2-4 4-5 4-5l1 4c3-1 7-1 10 2 4-4 11-6 17-4-5 2-7 7-7 12-3-3-7-3-9 0-2-3-6-3-8-1-2 3-5 6-8 7-3-1-6-4-8-7-2-2-6-2-8 1-2-3-6-3-9 0 0-5-2-10-7-12 6-2 13 0 17 4 3-3 7-3 10-2l1-4s2 1 4 5z" fill="#160C26"/></svg>`;
const SPARK = c => `<svg viewBox="0 0 20 20"><path d="M10 0c1 6 4 9 10 10-6 1-9 4-10 10-1-6-4-9-10-10 6-1 9-4 10-10z" fill="${c}"/></svg>`;

}
const PUMPKINS = `<g><ellipse cx="160" cy="168" rx="34" ry="24" fill="#FF8A1F"/><path d="M140 168c0-16 8-22 20-22s20 6 20 22" fill="none" stroke="#C25E05" stroke-width="3"/><rect x="157" y="136" width="6" height="12" rx="2" fill="#4E6B22"/><ellipse cx="1040" cy="172" rx="26" ry="18" fill="#FF9A2E"/><rect x="1037" y="148" width="5" height="10" rx="2" fill="#4E6B22"/></g>`;
const JACK = `<g><ellipse cx="180" cy="166" rx="38" ry="27" fill="#FF8A1F"/><path d="M164 158l8-8 4 9zM196 158l-8-8-4 9zM164 172q16 12 32 0l-6 3-4-4-6 5-6-5-4 4z" fill="#FFD447"/><rect x="176" y="132" width="7" height="13" rx="2" fill="#3D5E1C"/><ellipse cx="1030" cy="172" rx="28" ry="20" fill="#E9761A"/><rect x="1027" y="146" width="6" height="11" rx="2" fill="#3D5E1C"/></g>`;
const TREES = `<g fill="#1E7A45"><path d="M150 60l38 70h-18l26 44h-92l26-44h-18z"/><path d="M1050 80l32 60h-15l22 38h-78l22-38h-15z"/></g><g fill="#5B3A1C"><rect x="143" y="172" width="14" height="20"/><rect x="1043" y="176" width="14" height="18"/></g><g fill="#FFD166"><circle cx="150" cy="58" r="7"/></g>`;
const FLOWERS = [180,330,520,760,930,1090].map((x,i)=>`<g transform="translate(${x} ${150+(i%2)*12})"><path d="M0 0v30" stroke="#4E9A3A" stroke-width="3"/><g fill="${['#FF8FB8','#FFD25A','#B98CFF','#FF8FB8','#FFB0C9','#FFD25A'][i]}"><circle cx="0" cy="-8" r="6"/><circle cx="8" cy="0" r="6"/><circle cx="0" cy="8" r="6"/><circle cx="-8" cy="0" r="6"/></g><circle r="4.5" fill="#FFF3B0"/></g>`).join('');
const WAVES = `<path d="M0 175 q 30 -12 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 V200 H0z" fill="#5CC8F0" opacity=".9"/>`;

const GLASS = {'--surface':'rgba(255,255,255,.11)','--line':'rgba(255,255,255,.17)','--good-soft':'rgba(46,189,109,.28)','--bad-soft':'rgba(240,98,106,.26)','--good-ink':'#9BF2C4','--bad-ink':'#FFB0B4','--honey-ink':'#FFD87A'};
const THEMES = {
  classic:{ label:'Honey (no season)', months:[], greet:"Let's spell!",
    vars:{}, fx:'bees', ground:hills('#F1D9A8','#E8C987'),
    praise:['Buzz-tastic!','Sweet as honey!','Bee-autiful!','Nailed it!','You got it!'] },
  autumn:{ label:'Fall leaves', months:[8,10], greet:'Happy fall!',
    vars:{'--sky':'linear-gradient(180deg,#FFE9C9 0%,#FFCE94 55%,#F6A25A 100%)','--sky-ink':'#4A2410','--surface':'#FFFDF8','--ink':'#3B2414','--muted':'#8A6A55','--line':'#F1DEC6',
      '--accent':'#D2542A','--accent-deep':'#9E3A17','--accent-soft':'#FCE6DA','--honey':'#F4A93A','--honey-deep':'#B5741A','--honey-soft':'#FFF0D6'},
    fx:'leaves', ground:hills('#B65A22','#D98A3D',PUMPKINS),
    praise:['Fall-tastic!','Leaf it to you!','Gourd job!','Nailed it!','Un-be-leaf-able!'] },
  halloween:{ label:'Halloween', months:[9], greet:'Happy Halloween!',
    vars:{'--sky':'linear-gradient(180deg,#160C2E 0%,#2E1850 55%,#55296B 100%)','--sky-ink':'#F6EEFF',...GLASS,'--ink':'#FFF6FF','--muted':'#D6C6F2',
      '--accent':'#F26B1D','--accent-deep':'#B44A0B','--accent-soft':'rgba(242,107,29,.3)','--accent-ink':'#FFC59A','--honey':'#FFC23D','--honey-deep':'#C08A12','--honey-soft':'rgba(255,194,61,.2)'},
    glass:true, fx:'bats', moon:true, ground:hills('#120A22','#2A1846',JACK),
    praise:['Spook-tacular!','Boo-yah!','Fang-tastic!','Spell-binding!','Wicked good!'] },
  christmas:{ label:'Christmas', months:[11], greet:'Merry Christmas!',

      '--accent':'#E0303F','--accent-deep':'#9E1825','--accent-soft':'rgba(224,48,63,.32)','--accent-ink':'#FFB3BA','--honey':'#F4BC3F','--honey-deep':'#B9861A','--honey-soft':'rgba(244,188,63,.2)'},
    glass:true, fx:'snow', lights:true, ground:hills('#F4F8FF','#D6E4F7',TREES),
    praise:['Ho ho ho!','Snow-tastic!','You sleighed it!','Tree-mendous!','Jolly good!'] },
  winter:{ label:'Winter snow', months:[0,1], greet:'Stay cozy!',
    vars:{'--sky':'linear-gradient(180deg,#3E6FB8 0%,#6F9EDB 55%,#A9CDF2 100%)','--sky-ink':'#FFFFFF',...GLASS,'--surface':'rgba(255,255,255,.17)','--ink':'#FFFFFF','--muted':'#E3ECFA',
      '--accent':'#1E5FC2','--accent-deep':'#123F85','--accent-soft':'rgba(30,95,194,.32)','--accent-ink':'#D6E6FF','--honey':'#7FD3F7','--honey-deep':'#3A9AC6','--honey-soft':'rgba(127,211,247,.22)','--honey-ink':'#BDEBFF'},
    glass:true, fx:'snow', ground:hills('#F6FAFF','#DCE8F7'),
    praise:['Snow-tastic!','Ice work!','Cool as ice!','Flake-tacular!','Nailed it!'] },
  spring:{ label:'Spring blossoms', months:[2,3,4], greet:'Happy spring!',
    vars:{'--sky':'linear-gradient(180deg,#DDF4FF 0%,#EAF8EE 55%,#FFE6F0 100%)','--sky-ink':'#244233','--surface':'#FFFFFF','--ink':'#22352A','--muted':'#6A8072','--line':'#E2EFE5',
      '--accent':'#3D9E4B','--accent-deep':'#2A7535','--accent-soft':'#E2F5E5','--honey':'#FFCB47','--honey-deep':'#C38F17','--honey-soft':'#FFF4D6'},
    fx:'petals', sun:true, ground:hills('#7CC46A','#A5D98F',FLOWERS),

  summer:{ label:'Summer sun', months:[5,6,7], greet:'Happy summer!',

      '--accent':'#FF6B35','--accent-deep':'#C24A1A','--accent-soft':'#FFE7DC','--honey':'#FFC93C','--honey-deep':'#C08F12','--honey-soft':'#FFF4D2'},
    fx:'bubbles', sun:true, ground:hills('#F5D99A','#EBC678',WAVES),
    praise:['Sun-sational!','Hot stuff!','Beach-y keen!','Wave-tastic!','Totally rad!'] }
};
const THEME_ORDER = ['auto','autumn','halloween','christmas','winter','spring','summer','classic'];
function themeName(){
  const t = S.set.theme || 'auto';
  if (THEMES[t]) return t;
  const m = new Date().getMonth();
  return Object.keys(THEMES).find(k => THEMES[k].months.includes(m)) || 'classic';
}
const TH = () => THEMES[themeName()];
const CLASSIC_DARK = {'--sky':'#17122A','--sky-ink':'#F2ECFF','--surface':'#221B3A','--ink':'#F2ECFF','--muted':'#A79CC4','--line':'#342A55',
  '--accent':'#9B78F2','--accent-deep':'#6A47C9','--accent-soft':'#2E2452','--honey-soft':'#3A2F14','--good-soft':'#15382A','--bad-soft':'#3D1E26','--good-deep':'#3FD07F','--bad-deep':'#FF7A80'};

function particle(svg, cls, o){
  const st = Object.entries(o).map(([k,v])=>`--${k}:${v}`).join(';');
  return `<div class="p ${cls}" style="${st}">${svg}</div>`;
}
const rnd = (a,b) => a + Math.random()*(b-a);
function sceneFx(kind){
  const out = [];
  const fallers = (n, svgs, smin, smax, dmin, dmax) => { for (let i=0;i<n;i++) out.push(particle(pick(svgs), '', {x:rnd(-4,98).toFixed(1)+'vw', s:rnd(smin,smax).toFixed(0)+'px', d:rnd(dmin,dmax).toFixed(1)+'s', dl:(-rnd(0,dmax)).toFixed(1)+'s', sw:rnd(1.6,3.4).toFixed(1)+'s', o:rnd(.75,1).toFixed(2)})); };
  if (kind==='leaves'){
    const cs = ['#D2542A','#F4A93A','#B83A1B','#E8C547','#9C4A2A','#E07A2E'];
    fallers(16, cs.map((c,i)=>i%2?OVAL_LEAF(c):LEAF(c)), 22, 42, 11, 20);
  } else if (kind==='snow'){
    for (let i=0;i<34;i++) out.push(particle(DOT, '', {x:rnd(0,100).toFixed(1)+'vw', s:rnd(4,10).toFixed(0)+'px', d:rnd(9,18).toFixed(1)+'s', dl:(-rnd(0,18)).toFixed(1)+'s', sw:rnd(2,4).toFixed(1)+'s', o:rnd(.5,.95).toFixed(2)}));
    fallers(9, [FLAKE], 16, 28, 12, 22);
  } else if (kind==='petals'){
    fallers(18, ['#FF9EC4','#FFC2D9','#FFFFFF','#F7B3CF'].map(PETAL), 14, 24, 12, 20);
  } else if (kind==='bubbles'){

let appliedTheme = null;
function applyTheme(force){
  const name = themeName();
  const dark = name==='classic' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  const key = name + (dark?'-d':'');
  if (key === appliedTheme && !force) return;
  appliedTheme = key;
  const t = THEMES[name], root = document.documentElement;
  const all = new Set([...Object.values(THEMES).flatMap(x=>Object.keys(x.vars)), ...Object.keys(CLASSIC_DARK), '--accent-ink','--honey-ink']);
  all.forEach(k => root.style.removeProperty(k));
  Object.entries(dark ? CLASSIC_DARK : t.vars).forEach(([k,v]) => root.style.setProperty(k,v));
  const ground = dark ? hills('#2A2147','#352A5A') : t.ground;
  $('#scene').innerHTML =
    (t.sun ? `<div class="sun">${SUN}</div>` : '') +
    (t.moon ? `<div class="moon"></div>` : '') +
    (t.lights ? `<div class="lights">${lightsSvg()}</div>` : '') +
    sceneFx(t.fx) + `<div class="ground">${ground}</div>`;
  document.body.classList.toggle('has-lights', !!t.lights && !dark);
  document.body.classList.toggle('glass', !!t.glass && !dark);
  const meta = document.querySelector('meta[name=theme-color]') || Object.assign(document.head.appendChild(document.createElement('meta')),{name:'theme-color'});
  meta.content = getComputedStyle(root).getPropertyValue('--accent').trim();
}
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', ()=>{ applyTheme(true); });

function burst(){
  const t = TH(); let svgs;
  switch(t.fx){
    case 'leaves': svgs = ['#D2542A','#F4A93A','#E8C547'].map(LEAF); break;
    case 'snow': svgs = [FLAKE, SPARK('#FFD166'), SPARK('#FFFFFF')]; break;
    case 'petals': svgs = ['#FF9EC4','#FFD25A','#B98CFF'].map(PETAL); break;
    case 'bats': svgs = [SPARK('#FFC23D'), SPARK('#FF8A1F'), SPARK('#C9A6FF')]; break;
    case 'bubbles': svgs = [SPARK('#FFC93C'), SPARK('#FF6B35'), BUBBLE]; break;
    default: svgs = [SPARK('#FFB31F'), SPARK('#7B4DE0'), BEE];
  }
  for (let i=0;i<34;i++){
    const a = Math.random()*Math.PI*2, r = rnd(140, Math.min(innerWidth, 700)*.62);
    const el = document.createElement('div');
    el.className = 'burst';
    el.style.cssText = `--s:${rnd(18,34).toFixed(0)}px;--tx:${(Math.cos(a)*r).toFixed(0)}px;--ty:${(Math.sin(a)*r*.8).toFixed(0)}px;--r:${rnd(-260,260).toFixed(0)}deg;animation-delay:${rnd(0,.12).toFixed(2)}s`;
    el.innerHTML = pick(svgs);
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 1800);
  }
}

/* ---------- sound + speech ---------- */
let ac = null;
function tone(fr, t0, dur, type='sine', vol=.14){
  if (!S.set.sound) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + t0;
    o.type = type; o.frequency.value = fr;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.02); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+.05);
  }catch(e){}
}
const sfxGood = () => { tone(784,0,.18); tone(1047,.11,.3); };
const sfxBad = () => { tone(311,0,.22,'triangle',.16); tone(233,.14,.32,'triangle',.16); };
const sfxDone = () => { [523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.35)); };
const sfxKey = () => tone(1400,0,.04,'sine',.04);

const HAS_TTS = 'speechSynthesis' in window;
const NOVELTY = /albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|junior|ralph|fred|kathy|grandma|grandpa|rocko|shelley|eddy|flo|reed|sandy/i;
let voices = [];
function loadVoices(){
  if (!HAS_TTS) return;
  voices = (speechSynthesis.getVoices()||[]).filter(v => /^en[-_]/i.test(v.lang) || v.lang==='en');
  if (view==='parent') fillVoiceSelect();
}
if (HAS_TTS){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; setTimeout(loadVoices, 600); }
function voiceRank(v){
  let r = 10;
  if (/premium/i.test(v.name)) r = 0; else if (/enhanced/i.test(v.name)) r = 1;
  else if (/samantha|ava|allison|susan|zoe|nicky|evan|nathan|joelle/i.test(v.name)) r = 3;
  if (NOVELTY.test(v.name)) r += 50;
  if (!/en[-_]US/i.test(v.lang)) r += 4;
  return r;
}
function bestVoice(){
  if (S.set.voice){ const v = voices.find(x => x.voiceURI === S.set.voice); if (v) return v; }
  return voices.slice().sort((a,b)=>voiceRank(a)-voiceRank(b))[0] || null;
}
let lastUtt = null, speakTimer = null;
function say(parts, rateMul=1){
  if (!HAS_TTS) return;
  try{
    speechSynthesis.cancel();
    const v = bestVoice();
    parts.filter(Boolean).forEach((txt, i, arr) => {
      const u = new SpeechSynthesisUtterance(txt);
      if (v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
      u.rate = Math.max(.4, Math.min(1.3, S.set.rate * rateMul)); u.pitch = 1;
      if (i === 0) u.onstart = () => setTalking(true);
      if (i === arr.length-1){ u.onend = () => setTalking(false); u.onerror = () => setTalking(false); }
      lastUtt = u;
      speechSynthesis.speak(u);
    });
    clearTimeout(speakTimer); speakTimer = setTimeout(()=>setTalking(false), 9000);
  }catch(e){}
}
function setTalking(on){ const b = $('#speakBtn'); if (b) b.classList.toggle('talking', on); }
const spellOut = w => w.toUpperCase().split('').map(c => c===' ' ? 'space' : c==="'" ? 'apostrophe' : c==='-' ? 'dash' : c).join(', ');

/* ---------- words ---------- */
function parseWords(txt){
  let lines = txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if (lines.length === 1 && !lines[0].includes('|') && /[,;]/.test(lines[0])) lines = lines[0].split(/[,;]/).map(s=>s.trim()).filter(Boolean);
  const seen = new Set(), out = [];
  for (const l of lines){
    const parts = l.split('|');
    const w = parts[0].trim().replace(/^\d+\s*[\.\)\-:]\s*/,'').replace(/[‘’]/g,"'");
    if (!w) continue;
    const k = norm(w); if (seen.has(k)) continue; seen.add(k);
    out.push({w, s: parts.slice(1).join('|').trim()});
  }
  return out;
}
const wordsText = () => S.week ? S.week.words.map(x => x.s ? `${x.w} | ${x.s}` : x.w).join('\n') : '';

function weekSummary(wk){
  const days = Object.keys(wk.days||{}).sort().map(d => ({d, ...wk.days[d]})).filter(x => x.first);
  const counts = {};
  days.forEach(x => x.first.missed.forEach(w => counts[w] = (counts[w]||0)+1));
  const trouble = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  return {days, trouble};
}
function archiveWeek(){
  if (!S.week) return;
  const {days, trouble} = weekSummary(S.week);
  if (days.length) S.past.unshift({start:S.week.start, n:S.week.words.length, days:days.map(x=>({d:x.d, score:x.first.score, total:x.first.total, best:x.best})), trouble:trouble.slice(0,8)});
  S.past = S.past.slice(0, 30);
}

/* ---------- report ---------- */
function reportText(){
  const wk = S.week; if (!wk) return '';
  const name = S.set.name || 'Spelling';
  const {days, trouble} = weekSummary(wk);
  const L = [`🐝 ${name} — Word Hive report`, `Week of ${fmtShort(fromKey(wk.start))} · ${wk.words.length} words`, ''];
  if (!days.length) L.push('No tests taken yet this week.');
  days.forEach(x => {
    const f = x.first, pct = Math.round(f.score/f.total*100);
    let line = `${fmtDay(fromKey(x.d))}: ${f.score}/${f.total} (${pct}%)`;
    if (x.tries > 1) line += ` · ${x.tries} tries, best ${x.best}/${f.total}`;
    L.push(line);
    if (f.missed.length) L.push(`   missed: ${f.missed.join(', ')}`);
  });
  if (trouble.length){ L.push('', 'Trouble words: ' + trouble.slice(0,8).map(([w,c]) => c>1 ? `${w} (×${c})` : w).join(', ')); }
  return L.join('\n');
}
async function share(text, title){
  try{
    if (navigator.share){ await navigator.share({title, text}); return; }
  }catch(e){ if (e && e.name === 'AbortError') return; }
  try{ await navigator.clipboard.writeText(text); toast('Report copied — paste it in a text or email'); }
  catch(e){ location.href = 'mailto:?subject=' + encodeURIComponent(title) + '&body=' + encodeURIComponent(text); }
}

const curWord = () => S.week.words[T.order[T.pos]];
function speakWord(slow){

const KB_ROWS = ['qwertyuiop','asdfghjkl','zxcvbnm'];

function diffHtml(typed, target){
  const a = norm(typed), b = norm(target), n = a.length, m = b.length;
  const L = Array.from({length:n+1}, () => new Array(m+1).fill(0));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) L[i][j] = a[i]===b[j] ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  let i=0, j=0, mine='', right='';
  while (i<n || j<m){
    if (i<n && j<m && a[i]===b[j]){ mine += esc(a[i]); right += esc(b[j]); i++; j++; }
    else if (j<m && (i>=n || L[i][j+1] >= L[i+1][j])){ right += `<span class="add">${esc(b[j])}</span>`; j++; }
    else { mine += `<span class="x">${esc(a[i])}</span>`; i++; }
  }
  return {mine, right};
}
function fbHtml(){
  const w = curWord(), f = T.fb;

  }
  const d = diffHtml(f.typed, w.w);

function updTyped(){
  const a = $('#answer'); if (a) a.innerHTML = answerHtml();
  const c = document.querySelector('[data-act=check]'); if (c) c.disabled = !T.typed.trim();
}
function typeKey(k){
  if (T.state !== 'ask') return;
  if (T.typed.length >= 30) return;
  if (k === ' ' && (!T.typed || T.typed.endsWith(' '))) return;
  T.typed += k; sfxKey(); updTyped();
}
function backspace(){ if (T.state !== 'ask') return; T.typed = T.typed.slice(0,-1); updTyped(); }
function check(){
  if (T.state !== 'ask' || !T.typed.trim()) return;
  const w = curWord(), idx = T.order[T.pos];
  const ok = norm(T.typed) === norm(w.w);
  if (T.phase === 'main'){ T.first[idx] = ok; T.typedFirst[idx] = T.typed.trim(); }
  if (!ok) T.retry.push(idx);
  T.state = 'fb';
  T.fb = {ok, typed:T.typed, praise: pick(TH().praise)};
  render();
  if (ok){ sfxGood(); setTimeout(()=>say([w.w]), 300); }
  else { sfxBad(); setTimeout(()=>say([w.w, 'is spelled', spellOut(w.w)], .9), 450); }
}
function recordMain(){
  const words = S.week.words;
  const total = words.length;
  const missed = Object.keys(T.first).filter(k => !T.first[k]).map(k => words[k].w);
  const score = total - missed.length;
  const typed = {}; missed.forEach(w => { const i = words.findIndex(x => x.w === w); typed[w] = T.typedFirst[i]; });
  const k = dayKey();
  const d = S.week.days[k] || (S.week.days[k] = {tries:0});
  d.tries = (d.tries||0) + 1;
  if (!d.first) d.first = {score, total, missed, typed, at:Date.now()};
  d.last = {score, total, missed, at:Date.now()};
  d.best = Math.max(d.best||0, score);
  save();
  T.recorded = {score, total, missed, firstToday: d.tries === 1};
}
function next(){
  T.pos++; T.typed = ''; T.state = 'ask'; T.fb = null;
  if (T.pos < T.order.length){ render(); setTimeout(speakWord, 250); return; }
  if (T.phase === 'main') recordMain();
  if (T.retry.length){
    T.phase = 'retry'; T.round++; T.order = shuffle(T.retry); T.retry = []; T.pos = 0;
    go('retryIntro'); return;
  }
  sfxDone(); go('results'); setTimeout(burst, 200);
}
function vRetryIntro(){
  const n = T.order.length, first = T.round === 1;
  return `<div class="screen"><div class="center">
    <div class="bigscore" style="width:140px;height:161px"><div class="hex"><div><b class="num" style="font-size:3rem">${n}</b><small>to fix</small></div></div></div>
    <h1>${first ? 'Fix-up round!' : 'Almost there!'}</h1>
    <p class="sub">${first ? `Let's try the ${n===1?'word':n+' words'} you missed one more time.` : `Just ${n===1?'one more word':n+' more words'} to get right.`}</p>
    <div class="actions"><button class="btn" data-act="retryGo">Let's go</button></div>
  </div></div>`;
}
function vResults(){
  const r = T.recorded, pct = r.score / r.total;
  const stars = pct >= .9 ? 3 : pct >= .7 ? 2 : 1;
  const t = TH();
  const head = pct === 1 ? 'Perfect score!' : pct >= .9 ? pick(t.praise) : pct >= .7 ? 'Nice work!' : 'Keep practicing!';
  const sub = pct === 1 ? 'Every word right on the first try.' : `You fixed every word you missed. ${r.total - r.score === 1 ? 'Watch out for that one tomorrow!' : 'Practice those again tomorrow!'}`;
  return `<div class="screen"><div class="center">
    <div class="bigscore"><div class="hex"><div><b class="num">${r.score}/${r.total}</b><small>first try</small></div></div></div>
    <div class="stars">${[0,1,2].map(i => `<span class="${i<stars?'':'off'}">${IC.star}</span>`).join('')}</div>
    <h1>${esc(head)}</h1>
    <p class="sub">${sub}</p>
    ${r.missed.length ? `<div class="card missed"><div class="eyebrow">Words to practice</div><ul>${r.missed.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>` : ''}
    <div class="actions">
      <button class="btn honey" data-act="sendKid">${'Send to Parents'}</button>
      <button class="btn ghost" data-act="home">Done</button>
    </div>
  </div></div>`;
}
function kidReport(){
  const r = T.recorded, name = S.set.name || 'I';
  let s = `🐝 Word Hive — ${fmtDay(new Date())}\n${name === 'I' ? 'I got' : name + ' got'} ${r.score}/${r.total} on the first try!`;
  if (r.missed.length) s += `\nMissed: ${r.missed.join(', ')} (fixed them in the fix-up round)`;
  return s;
}

/* ----- PIN ----- */
function vPin(){
  return `<div class="screen">
    <div class="topbar"><button class="iconbtn" data-act="home" aria-label="Back">${IC.back}</button><div class="brand" style="margin-left:4px">${IC.logo}Word Hive</div></div>
    <div class="pin">
      <h2>Parent code</h2>
      <div class="dots" id="dots">${[0,1,2,3].map(i=>`<i class="hex ${i<pinBuf.length?'on':''}"></i>`).join('')}</div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="pin" data-k="${n}">${n}</button>`).join('')}<button class="blank" aria-hidden="true"></button><button data-act="pin" data-k="0">0</button><button data-act="pinDel" aria-label="Delete">${IC.bksp}</button></div>
    </div>
  </div>`;
}
function pinPress(k){
  if (pinBuf.length >= 4) return;
  pinBuf += k; sfxKey();
  document.querySelectorAll('#dots i').forEach((el,i)=>el.classList.toggle('on', i < pinBuf.length));
  if (pinBuf.length === 4){
    setTimeout(()=>{
      if (pinBuf === PIN){ pinBuf = ''; go('parent'); }
      else { pinBuf = ''; const d = $('#dots'); d.classList.add('shake'); sfxBad(); setTimeout(()=>{ d.classList.remove('shake'); d.querySelectorAll('i').forEach(i=>i.classList.remove('on')); }, 380); }
    }, 120);
  }
}

/* ----- parent ----- */
function vParent(){
  const wk = S.week;
  let progress = '<p>No week set up yet.</p>';
  if (wk){
    const {days, trouble} = weekSummary(wk);
    progress = days.length
      ? `<table class="tbl"><thead><tr><th>Day</th><th>First try</th><th>Tries</th><th>Missed (first try)</th></tr></thead><tbody>${days.map(x => `<tr><td>${fmtDay(fromKey(x.d))}</td><td class="sc num">${x.first.score}/${x.first.total}</td><td class="num">${x.tries}${x.tries>1?` <span style="color:var(--muted)">(best ${x.best})</span>`:''}</td><td class="ms">${x.first.missed.map(w => `${esc(w)}${x.first.typed&&x.first.typed[w] ? ` <span style="color:var(--muted);font-weight:600">→ ${esc(x.first.typed[w])}</span>` : ''}`).join('<br>') || '<span style="color:var(--good-ink,var(--good-deep))">none 🎉</span>'}</td></tr>`).join('')}</tbody></table>
         ${trouble.length ? `<label>Trouble words this week</label><div class="chips">${trouble.slice(0,10).map(([w,c]) => `<span class="chip">${esc(w)}${c>1?`<b>×${c}</b>`:''}</span>`).join('')}</div>` : ''}`
      : '<p>No tests taken yet this week.</p>';
  }
  const past = S.past.length
    ? `<div class="past">${S.past.map(p => { const avg = p.days.length ? Math.round(p.days.reduce((s,d)=>s+d.score/d.total,0)/p.days.length*100) : 0; const last = p.days[p.days.length-1]; return `<div><b>Week of ${fmtShort(fromKey(p.start))}</b><span>${p.days.length} day${p.days.length===1?'':'s'} · avg ${avg}% · last ${last.score}/${last.total}</span></div>`; }).join('')}</div>`
    : '<p>Past weeks show up here after you start a new week.</p>';
  const themeOpts = THEME_ORDER.map(k => `<option value="${k}" ${S.set.theme===k?'selected':''}>${k==='auto' ? `Auto by season (now: ${THEMES[themeName()].label})` : THEMES[k].label}</option>`).join('');
  return `<div class="screen parent">
    <div class="topbar"><button class="iconbtn" data-act="home" aria-label="Back to kid view">${IC.back}</button><div class="brand" style="margin-left:4px">Parent setup</div><button class="iconbtn" data-act="home" aria-label="Lock">${IC.lock}</button></div>
    <div class="scroll">

      <div class="card">
        <h3>${IC.list}This week's words</h3>
        <p>${wk ? `Week of ${fmtShort(fromKey(wk.start))} · ${wk.words.length} words` : 'Enter the list from school on Monday.'}</p>
        <label for="words">One word per line. Add a sentence after a <code style="background:var(--accent-soft);padding:1px 6px;border-radius:6px">|</code> if you want.</label>
        <textarea id="words" spellcheck="false" autocapitalize="none" autocorrect="off" placeholder="because | I stayed in because it rained.&#10;their | They forgot their backpacks.&#10;there | Put the box over there.&#10;friend&#10;enough">${esc(wordsText())}</textarea>
        <div class="help">Sentences matter for sound-alike words like <code>their / there</code> or <code>right / write</code>. She hears the sentence when she taps "Use it in a sentence". You can also paste a comma-separated list. Numbering like "1." is removed.</div>
        <div class="help" id="wcount"></div>
        <div class="btns">
          <button class="btn sm" data-act="saveNew">Start new week</button>
          ${wk ? `<button class="btn ghost sm" data-act="saveFix">Fix list, keep scores</button>` : ''}
        </div>
      </div>

      <div class="card">
        <h3>${IC.chart}Progress</h3>
        ${progress}
        <div class="btns"><button class="btn honey sm" data-act="sendReport" ${wk?'':'disabled'}>${'Send report'}</button><button class="btn ghost sm" data-act="copyReport" ${wk?'':'disabled'}>Copy report</button></div>
        <div class="help">"Send report" opens the iPad share sheet (Messages, Mail…). Reports aren't sent automatically. She can also tap "Send to Parents" after a test.</div>
      </div>

      <div class="card">
        <h3>${IC.voice}Voice</h3>
        ${HAS_TTS ? '' : '<p style="color:var(--bad-ink,var(--bad-deep));font-weight:800">This browser has no text-to-speech. Open the app in Safari on the iPad.</p>'}
        <label for="voice">Voice</label>
        <select id="voice"></select>
        <label for="rate">Speed <span id="rateLbl" class="num" style="color:var(--muted)"></span></label>
        <input id="rate" type="range" min="0.55" max="1.1" step="0.05" value="${S.set.rate}">
        <div class="switch"><span>Read the sentence automatically with each word</span><input id="autoSent" type="checkbox" ${S.set.autoSent?'checked':''}></div>
        <div class="switch"><span>Sound effects</span><input id="sound" type="checkbox" ${S.set.sound?'checked':''}></div>
        <div class="btns"><button class="btn ghost sm" data-act="testVoice">Test voice</button></div>
        <div class="help">Best voices: on the iPad go to <b>Settings → Accessibility → Spoken Content → Voices → English</b>, download an <b>Enhanced</b> or <b>Premium</b> voice (Ava or Samantha sound great), then pick it here. No sound? Check the volume and the silent switch / Control Center bell.</div>
      </div>

      <div class="card">
        <h3>${IC.paint}Look</h3>
        <label for="theme">Theme</label>
        <select id="theme">${themeOpts}</select>
        <label for="kname">Her name (for the greeting and reports)</label>
        <input id="kname" type="text" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="20" value="${esc(S.set.name)}" placeholder="Optional">
      </div>

      <div class="card">
        <h3>${IC.ipad}iPad setup</h3>
        <details open>
          <summary>Put it on her Home Screen</summary>
          <ol>
            <li>Open this page in <b>Safari</b> on her iPad.</li>
            <li>Tap the <b>Share</b> button → <b>Add to Home Screen</b> → <b>Add</b>.</li>
            <li>Open the app from the new Home Screen icon <b>before</b> entering words. The Home Screen app keeps its own saved words and scores, separate from Safari.</li>
          </ol>
        </details>
        <details>
          <summary>Autocorrect &amp; dictation <span class="tag">Handled by the app</span></summary>
          <ul>
            <li>The test uses its own on-screen letter keyboard, so the iPad keyboard never appears. That means no autocorrect, no word suggestions and no dictation mic during the test.</li>
            <li>If she uses a hardware keyboard (Magic Keyboard / case), typing works too. To be safe, turn the settings below off.</li>
          </ul>
        </details>
        <details>
          <summary>Turn off iPad typing helpers <span class="tag opt">Optional</span></summary>
          <ol>
            <li><b>Settings → General → Keyboard</b>: turn off <b>Auto-Correction</b>, <b>Predictive</b> (Predictive Text), <b>Check Spelling</b> and <b>Auto-Capitalization</b>.</li>
            <li>Same screen: turn off <b>Enable Dictation</b>, which removes the mic so she can't say a word and have it spelled.</li>
            <li><b>Settings → General → Keyboard → Text Replacement</b>: make sure there are no shortcuts that could fill in words.</li>
          </ol>
        </details>
        <details>
          <summary>What the app can't block</summary>
          <ul>
            <li>A web app can't stop her from leaving it to look a word up (Safari, Siri, another app). The only thing that blocks that is Guided Access, which you chose not to use. That's fine. If scores ever look too perfect, glance at the "Tries" column above.</li>
            <li>The parent code (${'****'}) keeps her out of this page. It's a kid-proof lock, not real security.</li>
          </ul>
        </details>
      </div>

      <div class="card">
        <h3>${IC.archive}Past weeks</h3>
        ${past}
      </div>

      <div style="height:20px"></div>
    </div>
  </div>`;
}
function fillVoiceSelect(){
  const sel = $('#voice'); if (!sel) return;
  const list = voices.filter(v => !NOVELTY.test(v.name)).sort((a,b) => voiceRank(a)-voiceRank(b) || a.name.localeCompare(b.name));
  const best = bestVoice();
  sel.innerHTML = `<option value="">Auto${best && !S.set.voice ? ` (${esc(best.name)})` : ' (best available)'}</option>` +
    list.map(v => `<option value="${esc(v.voiceURI)}" ${S.set.voice===v.voiceURI?'selected':''}>${esc(v.name)} — ${esc(v.lang)}</option>`).join('');
}
function bindParent(){
  fillVoiceSelect();
  const ta = $('#words'), wc = $('#wcount');
  const upd = () => { const n = parseWords(ta.value).length; wc.textContent = n ? `${n} word${n===1?'':'s'} ready.` : ''; };
  ta.addEventListener('input', upd); upd();
  $('#voice').addEventListener('change', e => { S.set.voice = e.target.value; save(); });
  const rate = $('#rate'), rl = $('#rateLbl');
  const rlab = () => rl.textContent = (+rate.value <= .7 ? 'slow' : +rate.value <= .9 ? 'normal' : 'quick') + ` (${(+rate.value).toFixed(2)})`;
  rate.addEventListener('input', () => { S.set.rate = +rate.value; rlab(); save(); }); rlab();
  $('#autoSent').addEventListener('change', e => { S.set.autoSent = e.target.checked; save(); });
  $('#sound').addEventListener('change', e => { S.set.sound = e.target.checked; save(); });
  $('#theme').addEventListener('change', e => { S.set.theme = e.target.value; save(); applyTheme(); });
  $('#kname').addEventListener('input', e => { S.set.name = e.target.value.trim(); save(); });
}
function saveWords(fresh){
  const words = parseWords($('#words').value);
  if (!words.length){ toast('Add at least one word'); return; }
  if (fresh){
    const hasData = S.week && Object.keys(S.week.days||{}).length;
    if (hasData && !confirm(`Start a new week with ${words.length} words?\n\nThis week's scores move to "Past weeks".`)) return;
    archiveWeek();
    S.week = {start: dayKey(mondayOf()), words, days:{}};
    toast(`New week saved · ${words.length} words`);
  } else {
    S.week.words = words;
    toast('List updated · scores kept');
  }
  save(); render();
}

/* ---------- events ---------- */
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  switch(a){
    case 'start': if (S.week && S.week.words.length) startTest(); break;
    case 'parent': pinBuf = ''; go('pin'); break;
    case 'home': if (HAS_TTS) speechSynthesis.cancel(); T = view==='results' ? null : T; go('home'); break;
    case 'say': speakWord(); break;
    case 'slow': speakWord(true); break;
    case 'sentence': speakSentence(); break;
    case 'key': typeKey(b.dataset.k); break;
    case 'bksp': backspace(); break;
    case 'check': check(); break;
    case 'next': next(); break;
    case 'retryGo': go('test'); setTimeout(speakWord, 300); break;
    case 'quit':
      if (T.phase === 'retry' || confirm('Stop the test? Your answers so far won\'t be saved.')){
        if (HAS_TTS) speechSynthesis.cancel();
        if (T.phase === 'retry' && T.recorded){ go('results'); } else { T = null; go('home'); }
      }
      break;
    case 'sendKid': share(kidReport(), 'Word Hive score'); break;
    case 'pin': pinPress(b.dataset.k); break;
    case 'pinDel': pinBuf = pinBuf.slice(0,-1); document.querySelectorAll('#dots i').forEach((el,i)=>el.classList.toggle('on', i < pinBuf.length)); break;
    case 'saveNew': saveWords(true); break;
    case 'saveFix': saveWords(false); break;
    case 'sendReport': share(reportText(), 'Word Hive report'); break;
    case 'copyReport': navigator.clipboard?.writeText(reportText()).then(()=>toast('Report copied'), ()=>toast("Couldn't copy")); break;
    case 'testVoice': say(['Your word is necessary.', 'The fruit was necessary for the recipe.', 'Necessary.']); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (view === 'pin'){
    if (/^[0-9]$/.test(e.key)) pinPress(e.key);
    else if (e.key === 'Backspace'){ pinBuf = pinBuf.slice(0,-1); render(); }
    return;
  }
  if (view !== 'test' || !T) return;
  if (T.state === 'fb'){ if (e.key === 'Enter'){ e.preventDefault(); next(); } return; }
  if (/^[a-zA-Z'\- ]$/.test(e.key)){ e.preventDefault(); typeKey(e.key.toLowerCase().replace('’',"'")); }
  else if (e.key === 'Backspace'){ e.preventDefault(); backspace(); }
  else if (e.key === 'Enter'){ e.preventDefault(); check(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && HAS_TTS) speechSynthesis.cancel(); else if (!document.hidden){ appliedTheme = null; applyTheme(); } });
document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});

render();
</script>
</body>
</html>
