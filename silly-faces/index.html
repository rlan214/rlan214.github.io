<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Silly Faces">
<meta name="theme-color" content="#111">
<link rel="apple-touch-icon" href="icon.png">
<title>Silly Faces</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; background: #111; color: #fff; overflow: hidden;
    font-family: -apple-system, "SF Pro Rounded", system-ui, sans-serif; touch-action: manipulation; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  video { display: none; }

  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; background: radial-gradient(circle at 50% 35%, #ff7ac6, #7a3cff 60%, #2a0f6b); z-index: 10; text-align: center; padding: 24px; }
  #start h1 { font-size: 64px; margin: 0; text-shadow: 0 6px 0 rgba(0,0,0,.25); }
  #start .faces { font-size: 56px; letter-spacing: 6px; }
  #goBtn { font-size: 34px; font-weight: 800; padding: 22px 64px; border-radius: 999px; border: 0;
    background: #ffd400; color: #3a1d00; box-shadow: 0 8px 0 #c79c00; }
  #goBtn:active { transform: translateY(4px); box-shadow: 0 4px 0 #c79c00; }
  #msg { font-size: 20px; min-height: 28px; opacity: .9; }

  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,.65)); z-index: 5; }
  #picker { display: flex; gap: 12px; overflow-x: auto; padding: 6px 4px; scrollbar-width: none; justify-content: safe center; }
  #picker::-webkit-scrollbar { display: none; }
  .pick { flex: 0 0 auto; width: 84px; height: 84px; border-radius: 50%; border: 4px solid rgba(255,255,255,.5);
    background: rgba(255,255,255,.18); font-size: 46px; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0; }
  .pick.on { border-color: #ffd400; background: rgba(255,212,0,.35); transform: scale(1.08); }

  #snap { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(130px + env(safe-area-inset-bottom));
    width: 96px; height: 96px; border-radius: 50%; border: 7px solid #fff; background: rgba(255,255,255,.35); z-index: 6; padding: 0; }
  #snap:active { background: #fff; }

  #homeBtn { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 14px; z-index: 6; width: 64px; height: 64px;
    border-radius: 50%; border: 0; background: rgba(0,0,0,.45); font-size: 34px; padding: 0; }
  #mkPanel { position: fixed; right: 12px; top: calc(14px + env(safe-area-inset-top)); z-index: 6; width: 190px; display: none;
    background: rgba(0,0,0,.5); border-radius: 22px; padding: 12px; }
  #mkPanel .lbl { font-size: 17px; font-weight: 700; margin: 4px 2px 6px; }
  #mkPanel .sw { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  #mkPanel .dot { width: 46px; height: 46px; border-radius: 50%; border: 3px solid rgba(255,255,255,.6); padding: 0; font-size: 20px; color: #fff; }
  #mkPanel .dot.on { border: 4px solid #ffd400; transform: scale(1.08); }
  #mkPanel input[type=range] { width: 100%; height: 40px; accent-color: #ff5aa8; }
  #blushBtn { width: 100%; margin-top: 6px; font-size: 18px; font-weight: 700; padding: 10px; border-radius: 999px; border: 3px solid rgba(255,255,255,.6); background: rgba(255,255,255,.15); color: #fff; }
  #blushBtn.on { border-color: #ffd400; background: rgba(255,90,140,.5); }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 20; transition: opacity .35s; }

  #preview { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 30; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; padding: 20px; }
  #preview img { max-width: 92%; max-height: 72%; border-radius: 18px; border: 6px solid #fff; -webkit-user-select: auto; user-select: auto; -webkit-touch-callout: default; }
  #preview .row { display: flex; gap: 18px; }
  #preview button { font-size: 28px; font-weight: 800; padding: 16px 34px; border-radius: 999px; border: 0; }
  #saveBtn { background: #2bd96b; color: #003316; }
  #againBtn, #homeBtn2 { background: #fff; color: #222; }
  #hint { font-size: 17px; opacity: .75; }

  #toast { position: fixed; top: calc(20px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.7); padding: 10px 20px; border-radius: 999px; font-size: 20px; z-index: 40; display: none; }
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="stage"></canvas>

<div id="start">
  <div class="faces">🥸🤡🐷👑🐰</div>
  <h1>Silly Faces</h1>
  <button id="goBtn">Let's Go!</button>
  <div id="msg"></div>
</div>

<button id="homeBtn" aria-label="Home">🏠</button>
<button id="snap" aria-label="Take photo"></button>
<div id="mkPanel">
  <div class="lbl">💋 Lips</div><div class="sw" id="lipSw"></div>
  <div class="lbl">👁️ Eyes</div><div class="sw" id="eyeSw"></div>
  <div class="lbl">✨ How much</div><input type="range" id="mkAmt" min="10" max="100" value="80">
  <button id="blushBtn" class="on">🌸 Blush</button>
</div>
<div id="bar"><div id="picker"></div></div>
<div id="flash"></div>

<div id="preview">
  <img id="shot" alt="Your silly photo">
  <div class="row">
    <button id="saveBtn">💾 Save</button>
    <button id="againBtn">✖ Again</button>
    <button id="homeBtn2">🏠</button>
  </div>
  <div id="hint">Or press and hold the picture to save it</div>
</div>
<div id="toast"></div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

const video = document.getElementById('cam');
const canvas = document.getElementById('stage');
const mainCtx = canvas.getContext('2d');
let ctx = mainCtx;
const $ = id => document.getElementById(id);

let landmarker = null, faces = [], smooth = [], lastVideoTime = -1, current = 'mustache';
const googly = []; // per face: pupil physics state
const LIPS = [[235,20,110],[210,0,30],[255,110,80],[150,40,190],[255,80,170],null];
const EYES = [[170,80,255],[40,120,255],[230,170,20],[30,190,120],[255,90,190],null];
const mk = { lip: LIPS[0], eye: EYES[0], amt: 0.8, blush: true };
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

function toast(t, ms = 2500) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', ms); }

// ---------- sizing ----------
let W = 0, H = 0, DPR = 1, rect = { x: 0, y: 0, w: 1, h: 1 };
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  fitVideo();
}
function fitVideo() {
  const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
  const s = Math.max(W / vw, H / vh); // cover the screen
  rect = { w: vw * s, h: vh * s, x: (W - vw * s) / 2, y: (H - vh * s) / 2 };
}
window.addEventListener('resize', resize);

// mirrored (selfie) mapping from normalized landmark to screen
const P = (lm, i) => ({ x: rect.x + (1 - lm[i].x) * rect.w, y: rect.y + lm[i].y * rect.h });
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

// Build a face "frame": unit size u = face width, angle a = head roll
function frame(lm) {
  const L = P(lm, 454), R = P(lm, 234);            // screen-left / screen-right cheek edges (mirrored)
  return { lm, u: dist(L, R), a: Math.atan2(R.y - L.y, R.x - L.x), p: i => P(lm, i) };
}
// Draw in local coords: origin at point, x along face, -y = up the face, 1 unit = face width
function local(f, at, fn) {
  ctx.save(); ctx.translate(at.x, at.y); ctx.rotate(f.a); ctx.scale(f.u, f.u); fn(); ctx.restore();
}
function mouthOpen(f) { return dist(f.p(13), f.p(14)) / f.u; }

// ---------- stickers ----------
const STICKERS = {
  mustache: { icon: '🥸', draw(f) {
    local(f, f.p(164), () => {
      ctx.fillStyle = '#3b2314';
      ctx.beginPath();
      ctx.moveTo(0, -0.02);
      ctx.bezierCurveTo(0.10, -0.09, 0.22, -0.05, 0.25, 0.02);
      ctx.bezierCurveTo(0.29, 0.07, 0.36, 0.05, 0.36, -0.01);
      ctx.bezierCurveTo(0.39, 0.09, 0.27, 0.12, 0.20, 0.07);
      ctx.bezierCurveTo(0.12, 0.03, 0.05, 0.06, 0, 0.04);
      ctx.bezierCurveTo(-0.05, 0.06, -0.12, 0.03, -0.20, 0.07);
      ctx.bezierCurveTo(-0.27, 0.12, -0.39, 0.09, -0.36, -0.01);
      ctx.bezierCurveTo(-0.36, 0.05, -0.29, 0.07, -0.25, 0.02);
      ctx.bezierCurveTo(-0.22, -0.05, -0.10, -0.09, 0, -0.02);
      ctx.fill();
    });
  }},

  googly: { icon: '👀', draw(f, idx) {
    const st = googly[idx] || (googly[idx] = [{}, {}]);
    [473, 468].forEach((iris, k) => {
      const c = f.p(iris), R = f.u * 0.13, r = R * 0.48, s = st[k];
      if (s.x === undefined) { s.x = c.x; s.y = c.y; s.vx = 0; s.vy = 0; }
      // pupil physics: gravity + damping, kept inside the eye
      s.vy += f.u * 0.012; s.vx *= 0.9; s.vy *= 0.9;
      s.x += s.vx; s.y += s.vy;
      let dx = s.x - c.x, dy = s.y - c.y, d = Math.hypot(dx, dy), max = R - r - 2;
      if (d > max) { const nx = dx / d, ny = dy / d; s.x = c.x + nx * max; s.y = c.y + ny * max;
        const dot = s.vx * nx + s.vy * ny; s.vx -= 1.6 * dot * nx; s.vy -= 1.6 * dot * ny; }
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#111'; ctx.lineWidth = Math.max(2, f.u * 0.012);
      ctx.beginPath(); ctx.arc(c.x, c.y, R, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x - r * .3, s.y - r * .3, r * .25, 0, 7); ctx.fill();
    });
  }},

  clown: { icon: '🤡', draw(f) {
    local(f, f.p(1), () => {
      const g = ctx.createRadialGradient(-0.035, -0.04, 0.01, 0, 0, 0.12);
      g.addColorStop(0, '#ff8a8a'); g.addColorStop(0.35, '#ff1a1a'); g.addColorStop(1, '#a00000');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 0.12, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.ellipse(-0.04, -0.05, 0.028, 0.018, -0.6, 0, 7); ctx.fill();
    });
    // rosy cheeks
    [[205, 1], [425, 1]].forEach(([i]) => local(f, f.p(i), () => {
      ctx.fillStyle = 'rgba(255,60,90,.45)'; ctx.beginPath(); ctx.arc(0, 0, 0.09, 0, 7); ctx.fill();
    }));
  }},

  piggy: { icon: '🐷', draw(f) {
    local(f, f.p(4), () => {
      ctx.fillStyle = '#ff9ec4'; ctx.strokeStyle = '#e0628f'; ctx.lineWidth = 0.012;
      ctx.beginPath(); ctx.ellipse(0, 0.02, 0.16, 0.115, 0, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#8a2c50';
      ctx.beginPath(); ctx.ellipse(-0.055, 0.02, 0.028, 0.045, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0.055, 0.02, 0.028, 0.045, 0, 0, 7); ctx.fill();
    });
    local(f, f.p(10), () => {
      [-1, 1].forEach(sx => {
        ctx.fillStyle = '#ff9ec4'; ctx.strokeStyle = '#e0628f'; ctx.lineWidth = 0.014;
        ctx.beginPath(); ctx.moveTo(sx * 0.18, 0.02); ctx.lineTo(sx * 0.42, -0.22); ctx.lineTo(sx * 0.40, 0.08); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ff6fa6'; ctx.beginPath(); ctx.moveTo(sx * 0.24, 0.02); ctx.lineTo(sx * 0.39, -0.13); ctx.lineTo(sx * 0.37, 0.04); ctx.closePath(); ctx.fill();
      });
    });
  }},

  party: { icon: '🥳', draw(f) {
    local(f, f.p(10), () => {
      ctx.save(); ctx.rotate(0.18); ctx.translate(0.05, -0.02);
      ctx.beginPath(); ctx.moveTo(-0.28, 0); ctx.lineTo(0, -0.85); ctx.lineTo(0.28, 0); ctx.closePath();
      ctx.save(); ctx.clip();
      const cols = ['#ff3b7a', '#ffd400', '#2bd9ff', '#7a3cff', '#2bd96b'];
      for (let i = 0; i < 12; i++) { ctx.fillStyle = cols[i % cols.length]; ctx.fillRect(-0.4, -0.9 + i * 0.08, 0.8, 0.08); }
      ctx.fillStyle = '#fff'; for (let i = 0; i < 14; i++) { ctx.beginPath(); ctx.arc(Math.sin(i * 7.3) * 0.2, -0.1 - (i * 0.053), 0.02, 0, 7); ctx.fill(); }
      ctx.restore();
      ctx.fillStyle = '#ffd400'; ctx.beginPath(); ctx.arc(0, -0.86, 0.07, 0, 7); ctx.fill();
      ctx.fillStyle = '#ff3b7a'; ctx.fillRect(-0.3, -0.03, 0.6, 0.06);
      ctx.restore();
    });
  }},

  crown: { icon: '👑', draw(f) {
    local(f, f.p(10), () => {
      ctx.translate(0, -0.04);
      const g = ctx.createLinearGradient(0, -0.35, 0, 0);
      g.addColorStop(0, '#fff27a'); g.addColorStop(0.5, '#ffc300'); g.addColorStop(1, '#c98a00');
      ctx.fillStyle = g; ctx.strokeStyle = '#8a5a00'; ctx.lineWidth = 0.012;
      ctx.beginPath(); ctx.moveTo(-0.36, 0); ctx.lineTo(-0.40, -0.30); ctx.lineTo(-0.20, -0.14); ctx.lineTo(0, -0.38);
      ctx.lineTo(0.20, -0.14); ctx.lineTo(0.40, -0.30); ctx.lineTo(0.36, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      [[-0.40, -0.30], [0, -0.38], [0.40, -0.30]].forEach(([x, y]) => { ctx.fillStyle = '#fff27a'; ctx.beginPath(); ctx.arc(x, y, 0.035, 0, 7); ctx.fill(); ctx.stroke(); });
      [[-0.2, '#ff2d55'], [0, '#2b7bff'], [0.2, '#2bd96b']].forEach(([x, c]) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, -0.07, 0.04, 0, 7); ctx.fill(); });
    });
  }},

  shades: { icon: '😎', draw(f) {
    local(f, mid(f.p(468), f.p(473)), () => {
      ctx.fillStyle = '#111'; ctx.strokeStyle = '#111'; ctx.lineWidth = 0.035;
      ctx.beginPath(); ctx.moveTo(-0.5, -0.04); ctx.lineTo(0.5, -0.04); ctx.stroke();
      [-1, 1].forEach(sx => {
        ctx.beginPath(); ctx.roundRect ? ctx.roundRect(sx > 0 ? 0.04 : -0.38, -0.07, 0.34, 0.2, 0.07) : ctx.rect(sx > 0 ? 0.04 : -0.38, -0.07, 0.34, 0.2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.moveTo(sx * 0.12 - 0.06, -0.04); ctx.lineTo(sx * 0.12 + 0.0, -0.04); ctx.lineTo(sx * 0.12 - 0.08, 0.08); ctx.lineTo(sx * 0.12 - 0.12, 0.08); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#111';
      });
    });
  }},

  santa: { icon: '🎅', draw(f) {
    // beard
    local(f, f.p(17), () => {
      ctx.fillStyle = '#fafafa'; ctx.strokeStyle = '#d8d8d8'; ctx.lineWidth = 0.01;
      const puffs = [[-0.36, -0.12, .12], [0.36, -0.12, .12], [-0.30, 0.04, .13], [0.30, 0.04, .13], [-0.18, 0.16, .14], [0.18, 0.16, .14], [0, 0.24, .15], [0, 0.08, .16], [-0.12, 0.0, .12], [0.12, 0.0, .12]];
      puffs.forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.stroke(); });
      puffs.forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x, y, r * .85, 0, 7); ctx.fill(); });
    });
    // mustache
    local(f, f.p(164), () => {
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#d8d8d8'; ctx.lineWidth = 0.01;
      [[-0.1, 0.03], [0.1, 0.03], [-0.2, 0.05], [0.2, 0.05]].forEach(([x, y]) => { ctx.beginPath(); ctx.ellipse(x, y, 0.1, 0.055, 0, 0, 7); ctx.fill(); ctx.stroke(); });
    });
    // hat
    local(f, f.p(10), () => {
      ctx.fillStyle = '#e3122d';
      ctx.beginPath(); ctx.moveTo(-0.42, -0.02); ctx.quadraticCurveTo(-0.1, -0.75, 0.48, -0.55); ctx.lineTo(0.42, -0.02); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-0.48, -0.10, 0.96, 0.14, 0.07) : ctx.rect(-0.48, -0.10, 0.96, 0.14); ctx.fill();
      ctx.beginPath(); ctx.arc(0.5, -0.55, 0.08, 0, 7); ctx.fill();
    });
  }},

  bunny: { icon: '🐰', draw(f) {
    local(f, f.p(10), () => {
      [-1, 1].forEach(sx => {
        ctx.save(); ctx.translate(sx * 0.15, -0.05); ctx.rotate(sx * 0.18);
        ctx.fillStyle = '#fff'; ctx.strokeStyle = '#ddd'; ctx.lineWidth = 0.012;
        ctx.beginPath(); ctx.ellipse(0, -0.32, 0.1, 0.34, 0, 0, 7); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ffb3cf'; ctx.beginPath(); ctx.ellipse(0, -0.30, 0.05, 0.26, 0, 0, 7); ctx.fill();
        ctx.restore();
      });
    });
    local(f, f.p(4), () => {
      ctx.fillStyle = '#ff7aa8'; ctx.beginPath(); ctx.moveTo(-0.05, -0.02); ctx.lineTo(0.05, -0.02); ctx.lineTo(0, 0.04); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(40,40,40,.8)'; ctx.lineWidth = 0.008;
      [-1, 1].forEach(sx => [-0.03, 0.01, 0.05].forEach(y => { ctx.beginPath(); ctx.moveTo(sx * 0.1, 0.06); ctx.lineTo(sx * 0.34, 0.06 + y * 1.6); ctx.stroke(); }));
    });
    local(f, f.p(13), () => { // buck teeth
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#bbb'; ctx.lineWidth = 0.006;
      ctx.fillRect(-0.045, 0, 0.042, 0.07); ctx.strokeRect(-0.045, 0, 0.042, 0.07);
      ctx.fillRect(0.003, 0, 0.042, 0.07); ctx.strokeRect(0.003, 0, 0.042, 0.07);
    });
  }},

  puppy: { icon: '🐶', draw(f) {
    // floppy ears at the sides of the head
    [[103, 1], [332, -1]].forEach(([i, sx]) => local(f, f.p(i), () => {
      ctx.fillStyle = '#8b5a2b'; ctx.strokeStyle = '#5e3a17'; ctx.lineWidth = 0.014;
      ctx.beginPath(); ctx.moveTo(0, -0.05);
      ctx.bezierCurveTo(sx * 0.25, -0.12, sx * 0.30, 0.25, sx * 0.20, 0.42);
      ctx.bezierCurveTo(sx * 0.12, 0.52, sx * 0.02, 0.40, sx * 0.04, 0.2);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }));
    // tongue when the mouth opens
    const open = mouthOpen(f);
    if (open > 0.04) local(f, f.p(14), () => {
      const len = Math.min(0.42, 0.06 + open * 2.4);
      ctx.fillStyle = '#ff5c8a'; ctx.strokeStyle = '#d13a68'; ctx.lineWidth = 0.01;
      ctx.beginPath(); ctx.moveTo(-0.08, -0.02); ctx.lineTo(-0.085, len - 0.07);
      ctx.quadraticCurveTo(0, len + 0.05, 0.085, len - 0.07); ctx.lineTo(0.08, -0.02); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 0.01); ctx.lineTo(0, len - 0.06); ctx.stroke();
    });
    // nose
    local(f, f.p(4), () => {
      ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.ellipse(0, 0, 0.09, 0.06, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(-0.03, -0.02, 0.025, 0.012, 0, 0, 7); ctx.fill();
    });
  }},

  koala: { icon: '🐨', draw(f) {
    // big fluffy ears up at the sides of the head
    [[103, 1], [332, -1]].forEach(([i, sx]) => local(f, f.p(i), () => {
      ctx.save(); ctx.translate(sx * 0.12, -0.12);
      ctx.fillStyle = '#9aa0a6'; ctx.strokeStyle = '#6b7075'; ctx.lineWidth = 0.014;

// ---------- smoothing ----------
function smoothFaces(raw) {
  const out = raw.map((lm, fi) => {
    const prev = smooth[fi];
    if (!prev || prev.length !== lm.length) return lm.map(p => ({ x: p.x, y: p.y }));
    return lm.map((p, i) => ({ x: prev[i].x + (p.x - prev[i].x) * 0.55, y: prev[i].y + (p.y - prev[i].y) * 0.55 }));
  });
  smooth = out; return out;
}

// ---------- burst capture (pick the sharpest frame) ----------
let burst = null; // { frames: [{img, faces, score}], need, done }
const probe = document.createElement('canvas'); probe.width = 160; probe.height = 90;
const pctx = probe.getContext('2d', { willReadFrequently: true });
function sharpness(src) {
  const vw = video.videoWidth, vh = video.videoHeight;
  // score the middle of the frame (where faces are), downscaled
  pctx.drawImage(src, vw * 0.2, vh * 0.15, vw * 0.6, vh * 0.7, 0, 0, 160, 90);
  const d = pctx.getImageData(0, 0, 160, 90).data, g = new Float32Array(160 * 90);
  for (let i = 0; i < g.length; i++) g[i] = d[i * 4] * .3 + d[i * 4 + 1] * .59 + d[i * 4 + 2] * .11;
  let sum = 0, sq = 0, n = 0;
  for (let y = 1; y < 89; y++) for (let x = 1; x < 159; x++) {
    const i = y * 160 + x, l = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - 160] - g[i + 160];
    sum += l; sq += l * l; n++;
  }

}

  const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext('2d').drawImage(video, 0, 0);
  burst.frames.push({ img: c, faces: faces, score: sharpness(c) });
  if (burst.frames.length >= burst.need) finishBurst();

// ---------- render loop ----------
let running = false, loopOn = false, lastAdvance = 0;
function render() {
  if (!running) { loopOn = false; return; }
  const now = performance.now();
  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime; lastAdvance = now;
    try { const res = landmarker.detectForVideo(video, now); faces = smoothFaces(res.faceLandmarks || []); } catch (e) { }
    if (burst && !burst.done) grabFrame();
  }
  // watchdog: camera frozen for 2.5s -> restart it
  if (lastAdvance && now - lastAdvance > 2500) { lastAdvance = now; restartCamera(); }
  drawScene(DPR);
  requestAnimationFrame(render);
}
function startLoop() { running = true; if (!loopOn) { loopOn = true; requestAnimationFrame(render); } }

function drawScene(scale, src = video, list = faces) {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.imageSmoothingQuality = 'high';
  ctx.fillStyle = '#111'; ctx.fillRect(0, 0, W, H);
  if (src !== video || video.readyState >= 2) {
    ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1);
    ctx.drawImage(src, W - rect.x - rect.w, rect.y, rect.w, rect.h);
    ctx.restore();
  }
  list.forEach((lm, i) => { if (lm.length >= 478) STICKERS[current].draw(frame(lm), i); });
}
// Photo at the camera's full resolution (same framing as the screen)
function photoCanvas(src, list) {
  const k = Math.max(DPR, (video.videoWidth || 1) / rect.w);
  const c = document.createElement('canvas');
  c.width = Math.round(W * k); c.height = Math.round(H * k);
  ctx = c.getContext('2d');
  try { drawScene(k, src, list); } finally { ctx = mainCtx; }
  return c;

// ---------- camera ----------
async function openCamera() {
  stopCamera();
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
  video.srcObject = stream; await video.play();
  fitVideo(); lastVideoTime = -1; lastAdvance = performance.now();
}
function stopCamera() {
  const s = video.srcObject; if (s) s.getTracks().forEach(t => t.stop());
  video.srcObject = null;
}
let restarting = false;
async function restartCamera() {
  if (restarting || !running) return; restarting = true;
  try { await openCamera(); } catch (e) { toast('Camera stuck. Tap 🏠 and start again.'); }
  restarting = false;
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && running) restartCamera(); });
video.addEventListener('loadedmetadata', fitVideo);

async function start() {

  resize();

    try {
      const fileset = await FilesetResolver.forVisionTasks(WASM);
      const opts = d => ({ baseOptions: { modelAssetPath: MODEL, delegate: d }, runningMode: 'VIDEO', numFaces: 3 });
      try { landmarker = await FaceLandmarker.createFromOptions(fileset, opts('GPU')); }
      catch (e) { landmarker = await FaceLandmarker.createFromOptions(fileset, opts('CPU')); }
    } catch (e) {

    }

  const fl = $('flash'); fl.style.transition = 'none'; fl.style.opacity = 1;
  requestAnimationFrame(() => { fl.style.transition = 'opacity .35s'; fl.style.opacity = 0; });
  burst = { frames: [], need: 5, done: false };
  setTimeout(() => { if (burst && !burst.done) finishBurst(); }, 600); // safety
};
function finishBurst() {
  const b = burst; if (!b || b.done) return; b.done = true;
  if (!b.frames.length) { burst = null; return; }
  const best = b.frames.reduce((x, y) => (y.score > x.score ? y : x));
  photoCanvas(best.img, best.faces).toBlob(blob => {
    burst = null; lastBlob = blob; $('shot').src = URL.createObjectURL(blob); $('preview').style.display = 'flex';
  }, 'image/jpeg', 0.95);
}
$('againBtn').onclick = () => { $('preview').style.display = 'none'; };
$('saveBtn').onclick = async () => {
  if (!lastBlob) return;
  const file = new File([lastBlob], 'silly-face-' + Date.now() + '.jpg', { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch (e) { }
  } else {
    const a = document.createElement('a'); a.href = $('shot').src; a.download = file.name; a.click();
    toast('Saved! (or press and hold the picture)');
  }
};
</script>
</body>
</html>
