<style>
  :root{--gold:#f5c400;--orange:#e8590c;--bg:#0c1d15;--card:#15302a;--muted:#9fc2b2}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#fff}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;gap:10px}
  h1{font-size:20px;margin:0;line-height:1.1}
  h1 small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
  .me{display:flex;align-items:center;gap:5px;background:var(--card);padding:6px 8px;border-radius:14px}
  .me .lbl{font-size:13px;color:var(--muted);margin-right:2px}
  .me button{width:38px;height:38px;border-radius:50%;border:2px solid #2c5446;background:#1c3d33;color:#fff;font-size:17px;font-weight:700}
  .me button.sel{background:var(--gold);color:#1b1b1b;border-color:var(--gold)}
  .me button.hide{display:none}
  .me #lock{background:transparent;border:none;font-size:20px;width:34px}
  .sets{display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .sets button{flex:0 0 auto;padding:8px 12px;border-radius:20px;border:2px solid #2c5446;background:transparent;color:#cfe3d9;font-size:14px;font-weight:700;white-space:nowrap}
  .sets button.sel{background:#1f5a3c;border-color:var(--gold);color:#fff}
  .tabs{display:flex;gap:8px;padding:0 16px 8px;flex-wrap:wrap}
  .tabs button{flex:1 1 90px;padding:10px 6px;border-radius:12px;border:2px solid #2c5446;background:var(--card);color:#fff;font-size:16px;font-weight:800}
  .tabs button.sel{border-color:var(--gold);color:var(--gold)}
  main{display:flex;flex-wrap:wrap;gap:12px;padding:0 16px 16px}
  .courtwrap{flex:1 1 440px;max-width:620px;margin:0 auto}
  svg{width:100%;height:auto;display:block;border-radius:14px}
  .side{flex:1 1 300px;display:flex;flex-direction:column;gap:10px}
  .caption{background:var(--card);border-radius:14px;padding:14px;min-height:92px}
  .caption .lab{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.5px}
  .caption .txt{font-size:21px;font-weight:700;margin-top:4px;line-height:1.25}
  .caption .you{display:inline-block;margin-top:8px;background:var(--gold);color:#1b1b1b;font-weight:800;font-size:13px;padding:3px 9px;border-radius:8px}
  .controls{display:flex;gap:8px}
  .controls button{flex:1;padding:14px 0;border-radius:12px;border:none;font-size:17px;font-weight:800;background:#235043;color:#fff}
  .controls #next{flex:2;background:var(--gold);color:#1b1b1b}
  .controls button:disabled{opacity:.35}
  .opts{display:none;flex-direction:column;gap:8px;background:var(--card);border-radius:14px;padding:12px}
  .opts.show{display:flex}
  .opts .h{font-size:14px;color:var(--muted);font-weight:700}
  .opts button{text-align:left;padding:12px;border-radius:10px;border:2px solid #2c5446;background:#1c3d33;color:#fff;font-size:16px;font-weight:600}
  .opts button.sel{border-color:var(--orange)}
  .opts button.you{box-shadow:inset 4px 0 0 var(--gold)}
  .steps{background:var(--card);border-radius:14px;padding:10px 12px;font-size:15px}
  .steps .row{padding:6px 4px;color:var(--muted);display:flex;gap:8px}
  .steps .row b{min-width:34px;color:#cfe3d9;font-size:13px;padding-top:1px}
  .steps .row.done{color:#e2efe8}
  .steps .row.cur{color:#fff;font-weight:700;background:#215043;border-radius:8px}
  .steps .row.you b{color:var(--gold)}
  .job{font-size:14px;color:#e2efe8;background:#1c3d33;border-left:4px solid var(--gold);padding:10px 12px;border-radius:10px;line-height:1.45}
  .job b{color:var(--gold)}
  .note{font-size:13px;color:#ffd9b8;background:#3a2a17;border-left:4px solid var(--orange);padding:9px 12px;border-radius:10px;display:none}
  .note.show{display:block}
  .row2{display:flex;gap:8px}
  .row2 button{flex:1;padding:10px 0;border-radius:10px;border:2px solid #2c5446;background:transparent;color:#cfe3d9;font-size:14px;font-weight:700}
  .row2 button.on{border-color:var(--gold);color:var(--gold)}
  footer{color:#6f9483;font-size:12px;text-align:center;padding:0 16px 20px}
  @keyframes pulse{0%{r:20;opacity:.9}100%{r:31;opacity:0}}
  .ring{animation:pulse 1.4s ease-out infinite}
</style>
</head>

function mirrorPlay(src,id,name){
  const sw={2:4,4:2},mp=n=>sw[n]||n,mx=pt=>[500-pt[0],pt[1]];
  const tx=t=>t.replace(/\b(2|4)\b/g,d=>d==='2'?'4':'2').replace(/\b(left|right)\b/g,w=>w==='left'?'right':'left');
  const node=s=>{const o={...s};if(s.t)o.t=tx(s.t);
    if(s.moves)o.moves=s.moves.map(m=>({...m,p:mp(m.p),to:mx(m.to),via:m.via&&m.via.map(mx)}));
    if(s.pass)o.pass=mp(s.pass);if(s.steps)o.steps=s.steps.map(node);if(s.alts)o.alts=s.alts.map(node);return o};
  const r=node(src);r.id=id;r.name=name;r.start={};for(const k in src.start)r.start[mp(+k)]=mx(src.start[k]);return r;
}

const PLAYS=[];SETS.forEach((s,si)=>s.plays.forEach(p=>{p.set=si;PLAYS.push(p)}));

function load(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

let playIdx=load('pb.play2',0); if(!(playIdx>=0&&playIdx<PLAYS.length))playIdx=0;

const $=id=>document.getElementById(id);

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// ---------- tree helpers ----------
const stepsOf=n=>n.steps?n.steps:[n];
function nodeAt(p){let n=play();for(const i of p)n=n.alts[i];return n}
function seqFor(p){const out=play().steps.map(s=>({...s}));let n=play();
  for(const i of p){n=n.alts[i];const pre=n.steps?n.l:null;stepsOf(n).forEach(s=>out.push({...s,pre}))}return out}
const seq=()=>seqFor(path);
const lenFor=p=>seqFor(p).length;

// ---------- geometry ----------
function segLens(pts){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return L}
function pointAt(pts,t){const L=segLens(pts),tot=L[L.length-1];if(tot===0)return pts[pts.length-1].slice();const d=t*tot;for(let i=1;i<pts.length;i++){if(d<=L[i]||i===pts.length-1){const s=(d-L[i-1])/((L[i]-L[i-1])||1);return[pts[i-1][0]+(pts[i][0]-pts[i-1][0])*s,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*s]}}}
function partial(pts,t){const L=segLens(pts),tot=L[L.length-1],d=t*tot,out=[pts[0]];for(let i=1;i<pts.length;i++){if(L[i]<d)out.push(pts[i]);else break}out.push(pointAt(pts,t));return out}
function trim(pts,a,b){const L=segLens(pts),tot=L[L.length-1];if(tot<a+b+6)return null;const t0=a/tot,t1=1-b/tot;const p=partial(pts,t1);const out=[pointAt(pts,t0)];const L2=segLens(p);for(let i=1;i<p.length;i++)if(L2[i]>a)out.push(p[i]);return out}

// ---------- state ----------
function initial(){return{pos:clone(play().start),ball:play().ball||1,trails:[]}}
function apply(st,step,idx){
  (step.moves||[]).forEach(m=>{const path=[st.pos[m.p],...(m.via||[]),m.to];st.trails.push({type:'move',p:m.p,pts:path,screen:!!m.screen,idx});st.pos[m.p]=m.to.slice()});
  if(step.pass){st.trails.push({type:'pass',pts:[st.pos[st.ball],st.pos[step.pass]],idx});st.ball=step.pass}
  if(step.shot){st.trails.push({type:'shot',pts:[st.pos[st.ball],RIM],idx});st.ball='rim'}
}
function stateAt(n){const st=initial(),s=seq();for(let i=0;i<n;i++)apply(st,s[i],i);return st}
function ballXY(pos,ball){return ball==='rim'?RIM:[pos[ball][0]+13,pos[ball][1]-13]}
function involves(step,before){return (step.moves||[]).some(m=>m.p==me)||(step.pass&&(step.pass==me||before.ball==me))||(step.shot&&before.ball==me)}
function nodeInvolves(n,before){const st=clone(before);return stepsOf(n).some(s=>{const r=involves(s,st);apply(st,s,0);return r})}

// ---------- drawing ----------
const playersG=$('players'),trailsG=$('trails'),ball=$('ball');
function setView(){$('court').setAttribute('viewBox',play().view==='full'?'0 -30 500 700':'0 -30 500 510')}
function buildPlayers(){
  playersG.innerHTML='';
  for(let p=1;p<=5;p++){
    const g=document.createElementNS(NS,'g');g.id='p'+p;const isMe=p==me;
    g.innerHTML=(isMe?'<circle class="ring" r="20" fill="none" stroke="#f5c400" stroke-width="3"/>':'')+
      `<circle r="16" fill="${isMe?'#f5c400':'#1f5a3c'}" stroke="#fff" stroke-width="2.5"/>`+
      `<text y="6.5" text-anchor="middle" font-size="19" font-weight="900" fill="${isMe?'#1b1b1b':'#fff'}">${p}</text>`;
    playersG.appendChild(g);
  }
  if(me)playersG.appendChild($('p'+me));
}
function trailSVG(tr,cur){
  const op=cur?1:0.22;
  if(tr.type==='move'){
    const pts=trim(tr.pts,0,tr.screen?0:19);if(!pts)return'';
    const col=tr.p==me?'#b07d00':'#1f4d3a';
    let s=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="3.5" stroke-linejoin="round" opacity="${op}" ${tr.screen?'':`marker-end="url(#${tr.p==me?'aMe':'aMove'})"`}/>`;
    if(tr.screen&&tr.pts.length>1){
      const e=tr.pts[tr.pts.length-1],q=tr.pts[tr.pts.length-2];let dx=e[0]-q[0],dy=e[1]-q[1];const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
      const cx=e[0]+dx*20,cy=e[1]+dy*20;
      s+=`<line x1="${cx-dy*14}" y1="${cy+dx*14}" x2="${cx+dy*14}" y2="${cy-dx*14}" stroke="${col}" stroke-width="5" stroke-linecap="round" opacity="${op}"/>`;
    }
    return s;
  }
  const pts=trim(tr.pts,14,tr.type==='shot'?10:19);if(!pts)return'';
  return `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#e8590c" stroke-width="3" stroke-dasharray="7 6" opacity="${op}" marker-end="url(#aPass)"/>`;
}
function draw(pos,bxy,trails,cur){
  trailsG.innerHTML=trails.map(t=>trailSVG(t,t.idx===cur)).join('');
  for(let p=1;p<=5;p++)$('p'+p).setAttribute('transform',`translate(${pos[p][0]},${pos[p][1]})`);
  ball.setAttribute('cx',bxy[0]);ball.setAttribute('cy',bxy[1]);
}
function drawInstant(){const st=stateAt(k);draw(st.pos,ballXY(st.pos,st.ball),st.trails,k-1);$('shotTxt').setAttribute('opacity',st.ball==='rim'?1:0)}

// ---------- animation ----------
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function tween(ms,fn){return new Promise(r=>{const t0=performance.now();function f(now){const t=Math.min(1,(now-t0)/ms);fn(ease(t),t);t<1?requestAnimationFrame(f):r()}requestAnimationFrame(f)})}
async function animateStep(i){
  const step=seq()[i],st=stateAt(i),pos=clone(st.pos),base=st.trails;let holder=st.ball;
  const sp=slow?1.9:1;
  $('shotTxt').setAttribute('opacity',0);
  draw(pos,ballXY(pos,holder),base,i);
  if(!(step.moves&&step.moves.length)&&!step.pass&&!step.shot){await sleep(500*sp);return}
  if(step.moves&&step.moves.length){
    const paths=step.moves.map(m=>({p:m.p,pts:[st.pos[m.p],...(m.via||[]),m.to],screen:!!m.screen}));
    const longest=Math.max(...paths.map(x=>{const L=segLens(x.pts);return L[L.length-1]}));
    await tween((900+longest*2.2)*sp,t=>{
      const extra=paths.map(x=>{pos[x.p]=pointAt(x.pts,t);return{type:'move',p:x.p,pts:partial(x.pts,t),screen:x.screen&&t>.98,idx:i}});
      draw(pos,ballXY(pos,holder),base.concat(extra),i);
    });
    paths.forEach(x=>base.push({type:'move',p:x.p,pts:x.pts,screen:x.screen,idx:i}));
    if(step.pass||step.shot)await sleep(250*sp);
  }
  if(step.pass){
    const a=ballXY(pos,holder),b=ballXY(pos,step.pass),from=pos[holder].slice(),to=pos[step.pass].slice();
    await tween(750*sp,t=>{
      const bp=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
      draw(pos,bp,base.concat([{type:'pass',pts:partial([from,to],t),idx:i}]),i);
    });
    base.push({type:'pass',pts:[from,to],idx:i});holder=step.pass;
    if(step.shot)await sleep(250*sp);
  }
  if(step.shot){
    const a=ballXY(pos,holder),from=pos[holder].slice();
    await tween(900*sp,(t,raw)=>{
      const bp=[a[0]+(RIM[0]-a[0])*raw,a[1]+(RIM[1]-a[1])*raw-Math.sin(Math.PI*raw)*55];
      draw(pos,bp,base.concat([{type:'shot',pts:partial([from,RIM],raw),idx:i}]),i);
    });
    $('shotTxt').setAttribute('opacity',1);
  }
}

// ---------- UI ----------
function buildMe(){
  const box=$('me');box.innerHTML='<span class="lbl">I\'m</span>';
  for(let p=1;p<=5;p++){const b=document.createElement('button');b.textContent=p;
    b.className=(p==me?'sel':'')+(locked&&p!=me?' hide':'');
    b.onclick=()=>{if(locked||busy)return;me=(me===p?null:p);save('pb.me.'+play().id,me);buildMe();buildPlayers();drawInstant();ui()};box.appendChild(b)}
  const l=document.createElement('button');l.id='lock';l.textContent=locked?'🔒':'🔓';l.title=locked?'Unlock position':'Lock position';
  l.onclick=()=>{if(!me&&!locked)return;locked=!locked;save('pb.lock.'+play().id,locked);buildMe()};box.appendChild(l);
}
function selectPlay(i){if(busy)return;autoOn=false;playIdx=i;save('pb.play2',i);k=0;path=[];loadPos();setView();buildMe();buildPlayers();buildNav();drawInstant();ui()}
function buildNav(){
  const cs=play().set;

    b.onclick=()=>selectPlay(i);t.appendChild(b)});
  $('sub').textContent='Guardian Angels · '+SETS[cs].sub;
}
function optionInfo(){
  const L=seq().length;if(k!==L)return null;
  const cur=nodeAt(path);
  if(cur.alts)return{base:path.slice(),alts:cur.alts,sel:null};
  if(path.length){const base=path.slice(0,-1);return{base,alts:nodeAt(base).alts,sel:path[path.length-1]}}
  return null;
}
function ui(){
  const p=play(),s=seq(),L=s.length;
  let lab,txt,you=false;
  if(k===0){lab='READY';txt='Tap Start to run '+p.name}
  else{const st=s[k-1];lab='STEP '+(st.pre?st.pre+' · ':'')+st.l;txt=st.t;you=involves(st,stateAt(k-1))}
  const oi=optionInfo();
  if(oi&&oi.sel===null){lab+=' · DONE';txt+='<br><span style="font-size:16px;color:#9fc2b2">Now pick an option below 👇</span>'}
  $('caption').innerHTML=`<div class="lab">${lab}</div><div class="txt">${txt}</div>${you?'<span class="you">⭐ THAT\'S YOU!</span>':''}`;
  $('back').disabled=busy||k===0;
  $('next').disabled=busy||k>=L;
  $('next').textContent=k===0?'Start ▶':'Next ▶';
  $('restart').disabled=busy;
  $('auto').classList.toggle('on',autoOn);$('slow').classList.toggle('on',slow);
  const o=$('opts');
  if(oi){o.classList.add('show');
    const before=stateAt(lenFor(oi.base));
    o.innerHTML='<div class="h">OPTIONS — what happens next?</div>'+oi.alts.map((a,i)=>`<button data-i="${i}" class="${oi.sel===i?'sel':''} ${me&&nodeInvolves(a,before)?'you':''}">${a.l} — ${a.t}</button>`).join('');
    o.querySelectorAll('button').forEach(b=>b.onclick=()=>chooseAlt(oi.base,+b.dataset.i));
  }else o.classList.remove('show');
  const n=$('note');if(p.note){n.innerHTML=p.note;n.classList.add('show')}else n.classList.remove('show');
  if(!me){$('job').innerHTML='<b>Tap your number</b> in the top right to highlight your moves (tap it again to watch everyone).'}
  else{
    const mine=[];let st=initial();
    p.steps.forEach((x,i)=>{if(involves(x,st))mine.push(x.l+') '+x.t);apply(st,x,i)});
    const altMine=(p.alts||[]).filter(a=>nodeInvolves(a,st)).map(a=>a.l);
    $('job').innerHTML=`<b>Your job as the ${me}:</b><br>`+(mine.length?mine.join('<br>'):'Hold your spot and stay ready.')+(altMine.length?'<br><b>Options with you:</b> '+altMine.join(' · '):'');
  }
  let before=initial();
  $('steps').innerHTML=s.map((x,i)=>{const y=me&&involves(x,before);apply(before,x,i);
    return `<div class="row ${i<k?'done':''} ${i===k-1?'cur':''} ${y?'you':''}"><b>${x.pre?x.pre.replace('Alt ','')+'·':''}${x.l}</b><span>${x.t}${y?' ⭐':''}</span></div>`}).join('');
}
async function next(){
  if(busy||k>=seq().length)return;
  busy=true;ui();await animateStep(k);k++;busy=false;ui();
}
async function chooseAlt(base,i){
  if(busy)return;autoOn=false;path=base.concat([i]);k=lenFor(base);drawInstant();
  const L=seq().length;while(k<L){await next();if(k<L)await sleep(slow?700:400)}
}
$('next').onclick=()=>{autoOn=false;next()};
$('back').onclick=()=>{if(busy||k===0)return;autoOn=false;k--;while(path.length&&k<=lenFor(path.slice(0,-1)))path.pop();drawInstant();ui()};
$('restart').onclick=()=>{if(busy)return;autoOn=false;k=0;path=[];drawInstant();ui()};
$('slow').onclick=()=>{slow=!slow;ui()};
$('auto').onclick=async()=>{
  if(busy)return;
  if(k>=play().steps.length){k=0;path=[];drawInstant()}
  autoOn=true;ui();
  while(autoOn&&k<play().steps.length){await next();if(!autoOn)break;await sleep(slow?900:500)}
  autoOn=false;ui();
};

setView();buildMe();buildNav();buildPlayers();drawInstant();ui();
</script>
