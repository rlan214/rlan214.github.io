<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lana Lessons">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Lana Lessons</title>
<script src="../shared/seasons.js" data-key="ll_theme" defer></script>
<script src="../shared/parent-text.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf4e4; --paper2:#f3e7cc; --ink:#1f2f4a; --soft:#5b6b85; --line:#d9c9a3;
  --coral:#ef6a4c; --coral-d:#c94f33; --teal:#1f9e8f; --gold:#f3b43f; --sky:#cfe6ef;
  --good:#2fa66a; --bad:#e0503a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,sans-serif;
  background-image:radial-gradient(circle at 15% 10%,#fff8e6 0,transparent 40%),radial-gradient(circle at 90% 90%,#f1e2c1 0,transparent 45%);
  -webkit-user-select:none;user-select:none;overflow-x:hidden}
.app{max-width:900px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
h1,h2,h3,.btn,.big{font-family:"Baloo 2",Nunito,sans-serif}
header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
header .logo{width:52px;height:52px;flex:none}
header h1{font-size:30px;margin:0;line-height:1}
header p{margin:2px 0 0;color:var(--soft);font-size:15px}
.back{border:0;background:#fff;border-radius:14px;padding:8px 14px;font:800 16px Nunito;color:var(--ink);box-shadow:0 2px 0 var(--line);margin-left:auto}
.hidden{display:none!important}

/* lessons picker */
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:10px}
.lesson{border:3px solid var(--ink);border-radius:22px;padding:18px;background:#fff;text-align:left;font:inherit;color:inherit;box-shadow:0 6px 0 var(--ink);position:relative;transition:transform .08s;display:flex;gap:14px;align-items:center}
.lesson:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.lesson .lico{width:72px;height:72px;flex:none;border-radius:18px;background:var(--sky);display:flex;align-items:center;justify-content:center;font-size:40px;border:2px solid var(--ink)}
.lesson b{display:block;font-family:"Baloo 2";font-size:24px;line-height:1.1}
.lesson span{color:var(--soft);font-size:15px}
.lesson .lbest{display:inline-block;margin-top:6px;background:var(--gold);border:2px solid var(--ink);border-radius:10px;padding:0 8px;font-weight:800;font-size:13px;color:var(--ink)}
.lesson.soon{border-style:dashed;box-shadow:none;background:transparent;opacity:.7}
.lesson.soon .lico{background:var(--paper2)}

/* map */
.mapwrap{background:#fffdf7;border:3px solid var(--ink);border-radius:22px;padding:6px;box-shadow:6px 6px 0 var(--paper2);position:relative}
svg.map{width:100%;height:auto;display:block}
.st{stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round;transition:opacity .25s,filter .25s}
.ctx{fill:#ece4d2;stroke:#c9bb98;stroke-width:1}
.map.tappable .st,.map.tappable .num{cursor:pointer}
.map:not(.tappable) .num{pointer-events:none}
.map.focus .st{opacity:.28}
.map.focus .st.on{opacity:1;stroke-width:3;filter:drop-shadow(0 0 6px rgba(239,106,76,.7))}
.num circle{fill:#fff;stroke:var(--ink);stroke-width:1.6}
.num text{font:800 13px Nunito;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.num line{stroke:var(--ink);stroke-width:1.3}
.map.focus .num{opacity:.25}.map.focus .num.on{opacity:1}
.map.focus .num.on circle{fill:var(--gold)}
.capdot{fill:var(--coral);stroke:#fff;stroke-width:1.5}
.compass text{font:800 11px Nunito;fill:var(--soft)}

/* home */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px}
.mode{border:3px solid var(--ink);border-radius:18px;padding:14px;background:#fff;text-align:left;font:inherit;color:inherit;box-shadow:0 5px 0 var(--ink);position:relative;transition:transform .08s}
.mode:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.mode .ico{font-size:30px;line-height:1}
.mode b{display:block;font-family:"Baloo 2";font-size:21px;margin-top:4px}
.mode span{color:var(--soft);font-size:14px}
.mode .best{position:absolute;top:10px;right:12px;font-size:13px;color:var(--soft);font-weight:800}
.section-title{font-size:20px;margin:18px 2px 6px}
.hint{color:var(--soft);font-size:14px;margin:6px 2px 0;text-align:center}

/* state card */
.card{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:16px;box-shadow:6px 6px 0 var(--paper2);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:640px){.card{grid-template-columns:1fr}}
.shapebox{background:var(--sky);border-radius:16px;position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.shapebox::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 23px,rgba(255,255,255,.35) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,rgba(255,255,255,.35) 23px 24px);pointer-events:none}
.shapebox svg{width:88%;height:88%;position:relative;z-index:1}
.shape{stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.draw .shape{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.6s ease forwards, fillin .5s 1.3s forwards;fill-opacity:0}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill-opacity:1}}
.tag{display:inline-block;background:var(--ink);color:#fff;border-radius:10px;padding:2px 10px;font:800 14px Nunito;letter-spacing:.5px}
.info h2{font-size:40px;margin:6px 0 0;line-height:1.05}
.row{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:18px}
.row .k{color:var(--soft);font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;width:132px;flex:none}
.row .v{font-family:"Baloo 2";font-weight:800;font-size:26px}
.abbr{background:var(--gold);border:2px solid var(--ink);border-radius:8px;padding:0 10px}
.trick,.fact{border-radius:14px;padding:10px 12px;font-size:16px;margin-top:8px}
.trick{background:#fde5dd}.fact{background:#e1f2ee}
.trick b,.fact b{font-family:"Baloo 2";font-size:15px;display:block}
.navrow{display:flex;gap:10px;margin-top:14px;justify-content:space-between;align-items:center}
.btn{border:3px solid var(--ink);background:#fff;color:var(--ink);border-radius:14px;padding:10px 18px;font-size:19px;font-weight:800;box-shadow:0 4px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--coral);color:#fff}
.btn.say{background:var(--teal);color:#fff}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--coral)}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.bar{flex:1;height:14px;background:#fff;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.bar div{height:100%;background:linear-gradient(90deg,var(--teal),#3cc2a6);width:0;transition:width .3s}
.score{font:800 18px Nunito}
.qbox{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:16px;box-shadow:6px 6px 0 var(--paper2)}
.prompt{font-family:"Baloo 2";font-weight:800;font-size:26px;text-align:center;margin:4px 0 12px;line-height:1.15}
.prompt em{font-style:normal;color:var(--coral-d)}
.qvisual{max-width:520px;margin:0 auto}
.qvisual .shapebox{max-width:300px;margin:0 auto}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.choice{border:3px solid var(--ink);background:var(--paper);border-radius:16px;padding:14px 8px;font:800 21px "Baloo 2";color:var(--ink);box-shadow:0 4px 0 var(--ink);min-height:64px}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.choice.right{background:var(--good);color:#fff}
.choice.wrong{background:var(--bad);color:#fff;animation:shake .35s}
.choice:disabled{opacity:1}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{text-align:center;font:800 19px Nunito;min-height:28px;margin-top:10px}
.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}

/* label mode */
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.word{border:2px dashed var(--ink);background:var(--paper);border-radius:12px;padding:8px 12px;font:800 18px "Baloo 2";color:var(--ink)}
.word.used{text-decoration:line-through;opacity:.4;border-style:solid}
.word.wrong{background:var(--bad);color:#fff;animation:shake .35s}
.placed text{font:800 10px Nunito;fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:3px}

/* results */
.result{text-align:center}
.stars{font-size:54px;letter-spacing:6px;margin:6px 0}
.missed{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.missed span{background:#fde5dd;border-radius:10px;padding:4px 10px;font-weight:800}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:99;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

html{touch-action:manipulation;-webkit-text-size-adjust:100%}
/* iPad landscape: side-by-side layouts */
@media (min-width:1000px) and (orientation:landscape){
  .app{max-width:1180px}
  #home:not(.hidden){display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:start}
  #home .modes{grid-template-columns:1fr 1fr;margin-top:0}
  #home .section-title{display:none}
  #home .hint{grid-column:1}
  #learn:not(.hidden){display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
  #learn .card{grid-template-columns:1fr;grid-row:span 2}
  #learn .card .shapebox{max-height:330px;aspect-ratio:auto;height:330px}
  #learn .mapwrap{margin-top:0!important}
  #learn .navrow,#learn .dots{grid-column:2}
  .qbox{display:grid;grid-template-columns:1.2fr 1fr;gap:6px 20px;align-items:center}
  .qbox .prompt{grid-column:1/-1}
  .qbox .qvisual{grid-column:1;max-width:none;width:100%}
  .qbox .choices{grid-column:2;grid-template-columns:1fr;margin-top:0}
  .qbox .bank{grid-column:2;margin-top:0}
  .qbox .feedback{grid-column:1/-1}
  .qbox .qvisual:empty{display:none}
  .qbox .qvisual:empty ~ .choices{grid-column:1/-1;grid-template-columns:1fr 1fr}
  .qbox.result{display:block}
  #home .mapwrap{grid-column:1;grid-row:1}
  #home .hint{grid-row:2}
  #home .modes{grid-column:2;grid-row:1/span 2}
  #learn .card{grid-column:1;grid-row:1/span 3}
  #learn .mapwrap{grid-column:2;grid-row:1}
  #learn .navrow{grid-row:2;align-self:start}
  #learn .dots{grid-row:3;align-self:start}
  .qbox .qvisual{grid-row:2}
  .qbox .choices,.qbox .bank{grid-row:2}
  .qbox .choices:empty,.qbox .bank:empty{display:none}
  .qbox .feedback{grid-row:3}
  .qbox .qvisual:empty ~ .choices{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <img class="logo" src="icon.png" alt="" style="border-radius:14px;border:3px solid var(--ink)">
    <div><h1 id="title">Lana Lessons</h1><p id="sub">Pick a lesson to practice</p></div>
    <button class="back hidden" id="backBtn">⌂ Home</button>
  </header>

  <!-- LESSONS -->
  <section id="lessons">
    <div class="lessons" id="lessonList"></div>
  </section>

  <!-- HOME -->
  <section id="home" class="hidden">
    <div class="mapwrap"><svg class="map tappable" id="homeMap" viewBox="0 0 600 480"></svg></div>
    <p class="hint">Tap any state to learn about it</p>
    <h3 class="section-title">Practice</h3>
    <div class="modes" id="modes"></div>
  </section>

  <!-- LEARN -->
  <section id="learn" class="hidden">
    <div class="card">
      <div class="shapebox" id="learnShape"></div>
      <div class="info">
        <span class="tag" id="learnNum"></span>
        <h2 id="learnName"></h2>
        <div class="row"><span class="k">Capital</span><span class="v" id="learnCap"></span></div>
        <div class="row"><span class="k">Abbreviation</span><span class="v abbr" id="learnAbbr"></span></div>
        <div class="trick"><b>🧠 Memory trick</b><span id="learnTrick"></span></div>
        <div class="fact"><b>⭐ Fun fact</b><span id="learnFact"></span></div>
      </div>
    </div>
    <div class="mapwrap" style="margin-top:14px"><svg class="map focus" id="learnMap" viewBox="0 0 600 480"></svg></div>
    <div class="navrow">
      <button class="btn" id="prevBtn">◀</button>
      <button class="btn say" id="sayBtn">🔊 Say it</button>
      <button class="btn" id="nextBtn">▶</button>
    </div>
    <div class="dots" id="dots" style="margin-top:12px"></div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="qtop"><div class="bar"><div id="bar"></div></div><div class="score" id="qscore"></div></div>
    <div class="qbox">
      <div class="prompt" id="prompt"></div>
      <div class="qvisual" id="qvisual"></div>
      <div class="choices" id="choices"></div>
      <div class="bank" id="bank"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="hidden">
    <div class="qbox result">
      <h2 id="rTitle" style="font-size:34px;margin:0"></h2>
      <div class="stars" id="rStars"></div>
      <div id="rScore" style="font:800 20px Nunito"></div>
      <div id="rMissedWrap"><p style="color:var(--soft);margin:14px 0 0">Practice these again:</p><div class="missed" id="rMissed"></div></div>
      <div class="navrow" style="justify-content:center;gap:12px">
        <button class="btn primary" id="againBtn">Play again</button>
        <button class="btn" id="homeBtn2">Home</button>
      </div>
    </div>
  </section>
</div>

function drawMap(svg,{numbers=true,focus=null,caps=false,onTap=null,labels=null}={}){
  let h=`<g>${Object.values(G.ctx).map(d=>`<path class="ctx" d="${d}"/>`).join("")}</g>
  <g class="compass" transform="translate(560,430)"><circle r="16" fill="#fff" stroke="#c9bb98"/><path d="M0-13 L4 0 L0 13 L-4 0Z" fill="#ef6a4c"/><text y="-20" text-anchor="middle">N</text></g><g>`;
  for(const s of STATES) h+=`<path class="st${focus===s.name?' on':''}" data-n="${s.name}" fill="${s.col}" d="${G.map[s.name]}"/>`;
  h+=`</g>`;
  if(focus){const s=byName[focus]; h+=`<path class="st on" fill="${s.col}" d="${G.map[focus]}" style="pointer-events:none"/>`}
  if(caps){for(const s of STATES){const [x,y]=G.cap[s.name]; if(!focus||focus===s.name) h+=`<path class="capdot" d="${star(x,y,7)}"/>`}}
  if(numbers){
    for(const s of STATES){
      const [cx,cy]=G.label[s.name]; const b=BADGE[s.name]||[cx,cy];
      const on=focus===s.name?' on':'';
      h+=`<g class="num${on}" data-n="${s.name}">${BADGE[s.name]?`<line x1="${cx}" y1="${cy}" x2="${b[0]}" y2="${b[1]}"/>`:''}<circle cx="${b[0]}" cy="${b[1]}" r="12"/><text x="${b[0]}" y="${b[1]}">${s.n}</text></g>`;
    }
  }
  if(labels){h+=`<g class="placed">`;for(const name of labels){const s=byName[name];const b=BADGE[name]||G.label[name];h+=`<text x="${b[0]}" y="${b[1]+22}">${s.name}</text>`}h+=`</g>`}
  svg.innerHTML=h;
  svg.classList.toggle("focus",!!focus);
  if(onTap) svg.querySelectorAll(".st,.num").forEach(p=>p.addEventListener("click",()=>onTap(p.dataset.n)));
}
function star(x,y,r){let p="";for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rr=i%2?r*.45:r;p+=(i?"L":"M")+(x+rr*Math.cos(a)).toFixed(1)+" "+(y+rr*Math.sin(a)).toFixed(1)}return p+"Z"}

function shapeSVG(name,{animate=true,cap=true}={}){

  return `<svg viewBox="0 0 300 300" class="${animate?'draw':''}"><path class="shape" fill="${s.col}" d="${G.solo[name]}"/>${cap?`<path class="capdot" d="${star(x,y,11)}"/>`:''}</svg>`;
}

function pick(arr,k,not){return shuffle(arr.filter(x=>x!==not)).slice(0,k)}
function makeQ(type,s){
  const others=pick(STATES,3,s);
  const opts=(f)=>shuffle([s,...others]).map(o=>({label:f(o),ok:o===s}));
  switch(type){
    case "map": return {s,prompt:`Which state is number <em>${s.n}</em>?`,vis:"map",opts:opts(o=>o.name)};
    case "shape": return {s,prompt:`Which state has this shape?`,vis:"shape",opts:opts(o=>o.name)};
    case "cap": return {s,prompt:`What is the capital of <em>${s.name}</em>?`,vis:"shapecap",opts:opts(o=>o.cap)};
    case "capr": return {s,prompt:`<em>${s.cap}</em> is the capital of…`,vis:"none",opts:opts(o=>o.name)};
    case "abbr": return {s,prompt:`What is the abbreviation for <em>${s.name}</em>?`,vis:"shape",opts:opts(o=>o.ab)};
    case "abbrr": return {s,prompt:`<em>${s.ab}</em> stands for…`,vis:"none",opts:opts(o=>o.name)};
  }
}
let Q=null;
function startQuiz(mode){
  Q={mode,i:0,right:0,total:0,missed:new Set(),list:[]};
  if(mode==="label"){return startLabel()}
  const sets={map:["map"],shape:["shape"],cap:["cap","capr"],abbr:["abbr","abbrr"],mix:["map","shape","cap","capr","abbr","abbrr"]}[mode];
  let list=shuffle(STATES).map((s,k)=>makeQ(sets[k%sets.length],s));
  if(mode==="mix") list=list.concat(shuffle(STATES).slice(0,5).map((s,k)=>makeQ(sets[(k+3)%sets.length],s)));
  Q.list=list;show("quiz");$("bank").innerHTML="";nextQ();
}
function nextQ(){
  if(Q.i>=Q.list.length) return finish();
  const q=Q.list[Q.i];
  $("bar").style.width=(Q.i/Q.list.length*100)+"%";
  $("qscore").textContent=`${Q.i+1} / ${Q.list.length}`;
  $("prompt").innerHTML=q.prompt;$("feedback").textContent="";$("feedback").className="feedback";
  const v=$("qvisual");
  if(q.vis==="map"){v.innerHTML=`<div class="mapwrap"><svg class="map" viewBox="0 0 600 480"></svg></div>`;drawMap(v.querySelector("svg"),{focus:q.s.name})}
  else if(q.vis==="shape"||q.vis==="shapecap"){v.innerHTML=`<div class="shapebox">${shapeSVG(q.s.name,{cap:q.vis==="shapecap"})}</div>`;animateShape(v)}
  else v.innerHTML="";
  $("choices").innerHTML=q.opts.map((o,k)=>`<button class="choice" data-k="${k}">${o.label}</button>`).join("");
  let first=true;
  $("choices").querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    const o=q.opts[b.dataset.k];
    if(o.ok){
      b.classList.add("right");
      if(first){Q.right++;$("feedback").textContent=["Great job!","You got it!","Awesome!","Nailed it!","Super!"][Math.random()*5|0];$("feedback").className="feedback good"}
      else{$("feedback").textContent="Yes! That's it.";$("feedback").className="feedback good"}
      $("choices").querySelectorAll(".choice").forEach(c=>c.disabled=true);
      Q.total++;Q.i++;setTimeout(nextQ,first?900:1400);
    }else{
      b.classList.add("wrong");b.disabled=true;
      if(first){first=false;Q.missed.add(q.s.name);
        const s=q.s;$("feedback").innerHTML=`Not quite — try again! <span style="color:var(--soft)">(${s.name}: ${s.cap}, ${s.ab})</span>`;$("feedback").className="feedback bad"}
    }
  });
}

/* label-the-map mode (worksheet style) */
function startLabel(){
  show("quiz");Q.order=STATES.map(s=>s.name);Q.placed=[];Q.list=STATES;
  $("choices").innerHTML="";
  $("qvisual").innerHTML=`<div class="mapwrap"><svg class="map" viewBox="0 0 600 480"></svg></div>`;
  $("bank").innerHTML=shuffle(STATES).map(s=>`<button class="word" data-n="${s.name}">${s.name}</button>`).join("");
  $("bank").querySelectorAll(".word").forEach(w=>w.onclick=()=>labelTap(w));
  labelStep();
}
let labelFirst=true;
function labelStep(){
  if(Q.i>=STATES.length) return finish();
  labelFirst=true;const s=STATES[Q.i];
  $("bar").style.width=(Q.i/STATES.length*100)+"%";$("qscore").textContent=`${Q.i+1} / 11`;
  $("prompt").innerHTML=`Which state is number <em>${s.n}</em>?`;
  drawMap($("qvisual").querySelector("svg"),{focus:s.name,labels:Q.placed});
  // keep placed labels visible over the dimmed map
  $("qvisual").querySelector("svg").classList.add("focus");
}
function labelTap(w){
  if(w.classList.contains("used"))return;
  const s=STATES[Q.i];
  if(w.dataset.n===s.name){
    w.classList.add("used");Q.placed.push(s.name);if(labelFirst)Q.right++;Q.total++;Q.i++;
    $("feedback").textContent="✓ "+s.name;$("feedback").className="feedback good";setTimeout(labelStep,500);
  }else{
    w.classList.add("wrong");setTimeout(()=>w.classList.remove("wrong"),400);
    if(labelFirst){labelFirst=false;Q.missed.add(s.name)}
    $("feedback").textContent="Try again!";$("feedback").className="feedback bad";
  }
}

function finish(){
  $("bar").style.width="100%";
  const pct=Math.round(Q.right/Q.list.length*100);
  const best=store.get("cc_best",{});if(best[Q.mode]==null||pct>best[Q.mode]){best[Q.mode]=pct;store.set("cc_best",best)}
  const stars=pct>=100?3:pct>=80?2:pct>=50?1:0;
  $("rTitle").textContent=["Keep practicing!","Good work!","Great job!","Perfect score!"][stars];
  $("rStars").textContent="★".repeat(stars)+"☆".repeat(3-stars);
  $("rScore").textContent=`${Q.right} of ${Q.list.length} right on the first try (${pct}%)`;
  const m=[...Q.missed];$("rMissedWrap").classList.toggle("hidden",!m.length);
  $("rMissed").innerHTML=m.map(n=>`<span>${n} · ${byName[n].cap} · ${byName[n].ab}</span>`).join("");
  $("againBtn").onclick=()=>startQuiz(Q.mode);
  show("results");if(stars===3)confetti();
  const md=MODES.find(x=>x.id===Q.mode),tm=new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  window.ParentText&&ParentText.ready(`Lana finished Northeast States: ${md?md.t:"practice"}, ${Q.right} of ${Q.list.length} right (${pct}%) ${"★".repeat(stars)} at ${tm}.`+(m.length?` Needs practice: ${m.join(", ")}.`:""));
}
function confetti(){const c=["#ef6a4c","#1f9e8f","#f3b43f","#b9c7ef","#f5b8d0"];for(let i=0;i<70;i++){const d=document.createElement("div");d.className="confetti";d.style.left=Math.random()*100+"vw";d.style.background=c[i%5];d.style.animationDuration=(1.8+Math.random()*1.8)+"s";d.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}}

goLessons();
</script>
