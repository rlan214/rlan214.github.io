function needs(n){
  const r=[];
  if(/Smith/.test(n)) r.push("smith");
  if(/Machine|Pec-Deck/.test(n)&&!/Smith/.test(n)) r.push("machine");
  if(/Leg Press/.test(n)) r.push("legpress");
  if(/(Seated|Lying) Leg Curl|Leg Extension/.test(n)&&!/Dumbbell|Banded/.test(n)) r.push("legmach");
  if(/Hyperextension/.test(n)) r.push("hyper");
  if(/Trap Bar/.test(n)) r.push("trap");
  if(/Cable|Pulldown(?!.*Banded)|Pushdowns$|^Standing Face Pulls$|^Cable Crunch|Rear Delt Cable/.test(n)&&!/Banded/.test(n)) r.push("cable");
  if(/Barbell|Back Squat|Box Squat|Bench Press$|Close-Grip Bench|^Barbell Deadlift|Sumo Deadlift|Landmine|Skullcrusher|Upright Row/.test(n)&&!/Dumbbell|Smith|Machine/.test(n)) r.push("barbell");
  if(/Pull-Up|Chin-Up|Hanging|Dead Hang|Scapular|Inverted Row/.test(n)) r.push("pullbar");
  if(/Dumbbell|\bDB\b|Goblet|Hammer Curls|Spider|Step-Ups/.test(n)) r.push("db");
  if(/Banded|Band /.test(n)) r.push("bands");
  if(/Incline|Decline|Chest-Supported|Seal Row/.test(n)&&!/Machine|Push-Ups|Cable Press/.test(n)) r.push("bench");
  return r;
}

function gear(){ return Object.assign({},DEFAULT_GEAR,settings().gear||{}) }
function canDo(n){ const g=gear(); return needs(n).every(k=>g[k]!==false) }

const GEARNAME=Object.fromEntries(GEAR.map(([k,l])=>[k,l.toLowerCase()]));
function missingGear(n){ const g=gear(); return needs(n).filter(k=>g[k]===false).map(k=>GEARNAME[k].replace(" / pec deck / row machines","")) }
const HEAVY=["barbell","cable","machine","smith","legpress","legmach","hyper","trap"];
/* manual swap > dumbbell mode > missing gear > original */
function resolveName(e){
  const s=settings(), alts=ALT[e.n]||[];
  const manual=s.swaps[s.split+"|"+e.n];
  if(manual) return {name:manual,why:"manual"};
  if(s.dbMode && needs(e.n).some(k=>HEAVY.includes(k))){
    const d=alts.find(a=>needs(a).includes("db")&&canDo(a)) || alts.find(a=>canDo(a)&&!needs(a).some(k=>HEAVY.includes(k)));
    if(d) return {name:d,why:"Dumbbell mode"};
  }
  if(!canDo(e.n)){
    const a=alts.find(canDo);
    if(a) return {name:a,why:"No gear for "+e.n};
  }
  return {name:e.n,why:""};
}

function isDeload(){ return weekNo()%9===0 }
function dayPlan(date){ const d=new Date(date+"T00:00").getDay(), p=prog(), sc=schedule(); const w=sc[d]; const extras=[]; if(p.abs[0]===d) extras.push("abs1"); if(p.abs[1]===d) extras.push("abs2"); if(p.prehab.includes(d)) extras.push("prehab"); return {w,extras} }
function dayChecks(date){ const p=dayPlan(date); const L=[]; if(p.w) L.push("w_"+p.w); p.extras.forEach(e=>L.push("x_"+e)); L.push("steps","stretch","cals","protein","logwt","creatine","fishoil","vitd"); return L }
function dayScore(date){ const r=get("day-"+date); const c=Object.assign({},r.c||{}); if(+r.steps>=8000) c.steps=true; if(r.wt) c.logwt=true; const L=dayChecks(date); return {n:L.filter(k=>c[k]).length,t:L.length,c} }
function parseReps(r){
  if(/^RP30/.test(r)) return {rp:1,lo:30,hi:30,label:"30 total · rest-pause"+(/side/.test(r)?" / side":"")};
  if(/^1-3 short/.test(r)) return {bw:1,lo:1,hi:30,label:"near failure (≤30)"+(/leg/.test(r)?" / leg":"")};
  if(r==="RPT") return {rr:[[6,8],[8,10],[10,12]],rpt:1,label:"RPT 6-8 / 8-10 / 10-12"};
  if(/\+F$/.test(r)){ const n=parseInt(r); return {lo:n,hi:99,fail:1,label:n+"+ (last set to failure)"} }
  const per=(r.match(/\/(leg|side)$/)||[])[1]; const core=r.replace(/\/(leg|side)$/,"");
  const sec=/s$/.test(core); const nums=core.replace(/s$/,"").split("-").map(Number);
  const lo=nums[0], hi=nums[1]||nums[0];
  return {lo,hi,unit:sec?"sec":"",label:(lo===hi?lo:lo+"-"+hi)+(sec?" s":"")+(per?" / "+per:"")};
}
function rngFor(pr,i){ return pr.rr? pr.rr[i]||pr.rr[pr.rr.length-1] : [pr.lo,pr.hi] }
function fmtRest(s){ if(!s) return "—"; if(s===150) return "2-3 min"; if(s===105) return "1.5-2 min"; if(s<60) return s+"s"; const m=s/60; return (m%1? m.toFixed(1):m)+" min" }
function incFor(name){ if(/Deadlift(?!.*Romanian)|Back Squat|Leg Press|Hip Thrust(?!.*Single)/.test(name)&&!/Dumbbell/.test(name)) return 10; if(/Plank|Bird Dog|Dead Bug|Palloff|Push-Ups|Hang|Wall Slides|Abductions|Circles/.test(name)) return 0; if(/Lateral|Face Pull|Rear Delt|Curl(?!.*Leg)|Extension(?!s)|Crunch/.test(name)) return 2.5; return 5 }
function ytLink(name){ const id=YT[name]; return id? "https://youtu.be/"+id : "https://www.youtube.com/results?search_query="+encodeURIComponent("Jeremy Ethier "+name.replace(/\(.*?\)/g,"")) }
function t2m(t){ const [h,m]=t.split(":").map(Number); return h*60+m }
function m2t(m){ m=((Math.round(m)%1440)+1440)%1440; let h=Math.floor(m/60), mm=m%60; const ap=h>=12?"pm":"am"; return (h%12||12)+":"+pad(mm)+" "+ap }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2200) }
const ui = {tab:"train",day:TODAY,wk:null,open:{},swapOpen:{}};

/* double-progression advice from the last logged session */
function advice(name,pr,hist){
  const prev = hist.filter(h=>h.d!==TODAY).slice(-1)[0];
  if(!prev||!prev.sets||!prev.sets.some(s=>s&&s[1]!==""&&s[1]!=null)) return {cls:"",txt:"First time logging this one. Pick a weight that lands you inside the rep range with 1-3 reps left in the tank."};
  const inc=incFor(name);
  const w = Math.max(...prev.sets.map(s=>+s[0]||0));
  const last = "Last "+prev.d.slice(5).replace("-","/")+": "+prev.sets.map(s=>(s[0]!==""&&s[0]!=null?s[0]+"×":"")+(s[1]??"–")).join(", ")+". ";
  if(pr.rp){ const minis=prev.sets.filter(s=>s&&+s[1]>0); const tot=minis.reduce((a,s)=>a+(+s[1]),0);
    if(tot<30) return {cls:"down",txt:last+"Only "+tot+" of 30 → go lighter so you can finish 30."};
    if(minis.length<=3) return {cls:"up",txt:last+"30 in "+minis.length+" mini-sets → add "+(inc||5)+" lb next time."};
    return {cls:"",txt:last+"30 in "+minis.length+" mini-sets → same weight, aim to get there in fewer."}; }
  if(pr.bw){ const mx=Math.max(...prev.sets.map(s=>+s[1]||0)); if(mx>30) return {cls:"up",txt:last+"Over 30 reps → move to a harder variation (see cue) or add a loaded backpack."}; return {cls:"",txt:last+"Beat a set's reps, staying 1-3 short of failure."} }
  if(pr.rpt){ const top=prev.sets[0]||[]; if(+top[1]>=pr.rr[0][1]) return {cls:"up",txt:last+"Top set hit "+pr.rr[0][1]+" → add "+(inc||5)+" lb to the top set, then drop ~10% per set."}; if(+top[1]<pr.rr[0][0]) return {cls:"down",txt:last+"Top set came up short → lower it and build back up."}; return {cls:"",txt:last+"Same top-set weight, chase one more rep."} }
  if(pr.fail) return {cls:"",txt:last+"Beat your total reps."};
  let allTop=true, anyLow=false;
  prev.sets.forEach((s,i)=>{ const [lo,hi]=rngFor(pr,i); const r=+s[1]; if(!(r>=hi)) allTop=false; if(s[1]!==""&&r<lo) anyLow=true });
  const unit=pr.unit==="sec"?"s":" reps";
  if(allTop && inc) return {cls:"up",txt:last+"Top of the range on every set → add "+inc+" lb"+(w?" (try "+(w+inc)+")":"")+"."};
  if(allTop) return {cls:"up",txt:last+"Top of the range on every set → make it harder (slower reps, harder variation, or add load)."};
  if(anyLow) return {cls:"down",txt:last+"Fell under "+rngFor(pr,0)[0]+unit+" → drop the weight a step and build back up."};
  return {cls:"",txt:last+"Same weight — get every set to "+rngFor(pr,0)[1]+unit+"."};
}

function render(fromSync){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===ui.tab));
  const s=settings(), p=prog();
  $("#weekPill").textContent = "Week "+weekNo()+(isDeload()?" · Deload":"");
  $("#weekPill").className = "pill"+(isDeload()?" hot":"");
  $("#hdrSub").textContent = "SHRED 2.0 · "+s.split+"-day V"+s.ver;
  if(fromSync && document.activeElement && document.activeElement.tagName==="INPUT") return;
  const v=$("#view");
  if(ui.tab==="today") v.innerHTML=viewToday();
  if(ui.tab==="train") v.innerHTML=viewTrain();
  if(ui.tab==="fuel") v.innerHTML=viewFuel();
  if(ui.tab==="guide") v.innerHTML=viewGuide();
}

function lblFor(key){ if(!key) return "Rest"; return prog().names[key]||key }
function shortLbl(key){ if(!key) return "Rest"; return ({A:"A",B:"B",C:"C",U1:"Upper",U2:"Upper",L1:"Lower",L2:"Lower",UP:"Upper",PU:"Push",PL:"Pull"})[key]||key }

  ${isDeload()?`<div class="banner" style="margin-top:14px">Deload week: same workouts, half the sets, ~20% lighter. Back to normal next week.</div>`:""}
  <div class="week">${strip}</div>
  <div class="card plan stack" style="margin-top:12px">
    <div class="row between"><span class="label" style="color:inherit;opacity:.7">${isToday?"Today":DOW[d.getDay()]+" "+(d.getMonth()+1)+"/"+d.getDate()}</span><span class="pill">${sc.n}/${sc.t} done</span></div>
    <div class="big">${plan.w?lblFor(plan.w):"Rest day"}</div>
    <div class="row">${plan.extras.map(e=>`<span class="chip">${EXTRA[e].name}</span>`).join("")}<span class="chip">8,000+ steps</span><span class="chip">5-min stretch</span></div>
    ${go?`<button type="button" class="btn primary" data-go="${go}">Start ${plan.w?lblFor(plan.w):EXTRA[go].name} →</button>`:""}
  </div>
  <div class="progress" style="margin-top:10px"><i style="width:${Math.round(sc.n/sc.t*100)}%"></i></div>
  <p class="small muted" style="margin-top:6px">Goal is 70-80% of these every week, not perfection.</p>

  ${session?`<h2>Training</h2><div class="stack">${session}</div>`:""}

  <h2>Steps</h2>
  <div class="card row between">
    <div style="flex:1;min-width:140px"><label class="label" for="stepsIn">Today's steps</label>
    <input id="stepsIn" type="number" inputmode="numeric" placeholder="e.g. 9,200" value="${rec.steps??""}"></div>
    <div class="small muted" style="min-width:120px">Target <b class="mono">8,000-12,000</b>. Ticks off at 8k.</div>
  </div>
  <div class="stack" style="margin-top:10px">${ck("stretch","Daily 5-min stretch","Cat-cow, world's greatest, deep squat, T-spine rotations, wall slides")}</div>

  <h2>Nutrition</h2>
  <div class="stack">
    ${ck("cals","Hit goal calorie range","From your Pocket Coach, logged in MyFitnessPal")}
    ${ck("protein","Hit minimum protein","Up to 2-3 scoops of whey helps")}
  </div>

  <h2>Morning weigh-in</h2>
  <div class="card row between">
    <div style="flex:1;min-width:140px"><label class="label" for="wIn">After bathroom, before food (lb)</label>
    <input id="wIn" type="number" inputmode="decimal" step="0.1" placeholder="e.g. 182.4" value="${rec.wt??""}"></div>
    <div class="small muted" style="min-width:120px">${weighTrend()}</div>

  <div class="stack">${SUPPS.filter(x=>x.k!=="zinc").map(x=>ck(x.k,x.t,x.s)).join("")}</div>

  <p class="sync" style="margin-top:20px">${S.status==="synced"?"Synced · shows up on all your devices":S.status==="offline"?"Offline — saved on this device, will sync when back"+(S.err?" ("+esc(S.err)+")":""):"Connecting…"}</p>`;

function weighTrend(){
  const pts=[]; for(let i=0;i<14;i++){ const x=new Date(); x.setDate(x.getDate()-i); const w=+get("day-"+ymd(x)).wt; if(w) pts.push([i,w]) }
  const a=pts.filter(p=>p[0]<7).map(p=>p[1]), b=pts.filter(p=>p[0]>=7).map(p=>p[1]);
  if(!a.length) return "Log daily. The weekly average is what matters.";
  const av=x=>x.reduce((s,v)=>s+v,0)/x.length;
  let t=`7-day avg <b class="mono">${av(a).toFixed(1)}</b>`;
  if(b.length){ const dl=av(a)-av(b); t+=`<br>vs prior week <b class="mono">${dl>0?"+":""}${dl.toFixed(1)}</b>` }
  return t;
}

function timelineCard(){
  const s=settings(), plan=dayPlan(TODAY);
  const wake=t2m(s.wake), bed0=t2m(s.bed), bed=bed0<wake?bed0+1440:bed0;
  const items=[{m:wake,n:"Wake + weigh-in",d:"Before eating or drinking"}];
  if(plan.w){
    const wt=t2m(s.wt);
    items.push({m:wt-150,n:"Pre-workout meal (2-3 h out)",d:"Carbs + protein, fats OK: oats + eggs, potatoes + chicken, rice + chicken + salad"});
    items.push({m:wt-60,n:"…or a quick pre-workout snack (30-90 min out)",d:"Fast carbs + fast protein, low fat: rice cakes or banana + shake, bagel + deli meat. Coffee here if you want it."});
    items.push({m:wt,n:lblFor(plan.w),d:"Warm-up, then working sets",key:1});
    items.push({m:wt+70,n:"Protein shake",d:"Whey isolate right after to start recovery",key:1});
    items.push({m:wt+70+90,n:"Post-workout meal",d:"Protein + carbs within 1-3 h"});
  }
  items.push({m:bed-90,n:"Optional pre-bed protein",d:"~40 g casein: cottage cheese, Greek yogurt, casein shake"});
  items.sort((a,b)=>a.m-b.m);
  return `<div class="card stack">
    <div class="row" style="gap:8px">
      <div style="flex:1;min-width:90px"><label class="label" for="sWt">Workout</label><input id="sWt" type="time" value="${s.wt}"></div>
      <div style="flex:1;min-width:90px"><label class="label" for="sWake">Wake</label><input id="sWake" type="time" value="${s.wake}"></div>
      <div style="flex:1;min-width:90px"><label class="label" for="sBed">Bed</label><input id="sBed" type="time" value="${s.bed}"></div>
    </div>
    <div class="tl">${items.map(i=>`<div class="tli ${i.key?"key":""}"><div class="tm">${m2t(i.m)}</div><div class="nm">${esc(i.n)}</div><div class="small muted">${esc(i.d)}</div></div>`).join("")}</div>
    <p class="small muted">Late session? Go easy on caffeine so it doesn't wreck your sleep.</p>
  </div>`;
}

function viewTrain(){
  const s=settings(), p=prog(), plan=dayPlan(TODAY);
  const keys=[...p.keys,"abs1","abs2","prehab","home"];
  const wk = keys.includes(ui.wk)? ui.wk : (plan.w || plan.extras[0] || p.keys[0]); ui.wk=wk;
  const seg=keys.map(k=>`<button type="button" class="${k===wk?"on":""}" data-wk="${k}">${EXTRA[k]?EXTRA[k].name.replace(" (5 min)",""):p.names[k]}</button>`).join("");
  const w=workout(wk);
  let wu="";
  if(!EXTRA[wk]){
    const wt=warmType(wk);
    const rows=[...(wt!=="lower"?WARM.upper:[]),...(wt!=="upper"?WARM.lower:[])];
    wu=`<details class="g"><summary><h3>Warm-up · 5-10 min</h3></summary><div class="gb">
      <p class="small muted">Optional: 5 min easy cardio first if you've been sitting or it's cold.</p>
      <div class="tbl"><table>${rows.map(r=>`<tr><td>${r[0]}</td><td class="mono">${r[1]}</td></tr>`).join("")}</table></div>
      <div class="label" style="margin-top:6px">Ramp-up sets · first ${wt==="both"?"upper and first lower":"exercise"} only</div>
      <div class="tbl"><table>${RAMP.map(r=>`<tr><td>${r[0]}</td><td class="mono">${r[1]}</td><td class="mono">${r[2]}</td></tr>`).join("")}</table></div></div></details>`;
  }
  const hasSS = w.ex.some(e=>e.ss), hasTri=w.ex.some(e=>/3$/.test(e.ss||"")), hasRP=w.ex.some(e=>/^RP/.test(e.r));
  const tips=[];
  if(w.circuit) tips.push("Circuit: one set of each back to back, rest 2 min, 3 rounds. Work up to 3×15, then add weight. Not on back-to-back days.");
  else if(w.home) tips.push("No-equipment routine (from SHRED 1.0), 3-4×/week with a rest day between. Every set 1-3 reps short of failure; if a set goes past 30 reps, move to the harder variation. Supersets: 30-45s between moves.");
  else if(hasSS) tips.push("Supersets (A1/A2…): first move, rest 1 min, second move, rest 1 min, repeat for all sets.");
  if(hasTri) tips.push("Tri-sets (A1/A2/A3): 30s between moves, 1 min after each round.");
  if(hasRP) tips.push("Rest-pause: as many reps as you can, rest 15-20s, go again, until you hit 30 total. Log each mini-set.");
  const note = tips.map(t=>`<div class="tip">${t}</div>`).join("");
  const len=s.len||"full";
  const lenSeg = EXTRA[wk]? "" : `<div class="row" style="gap:6px;margin-top:10px"><span class="label">Length</span>${[["full","Full ~60 min"],["30","30 min"],["15","15 min"]].map(([v,l])=>`<button type="button" class="btn sm ${len===v?"primary":"ghost"}" data-len="${v}">${l}</button>`).join("")}</div>${len!=="full"?`<p class="small muted">Time-saving version of your ${s.split}-day routine (same for V1-V3). Use it all week or just on busy days.</p>`:""}`;
  const verWk = weeksSince(s.verStart||s.start);
  return `<h2>Workouts</h2>
  <div class="row between" style="margin-bottom:10px"><span class="small muted">${p.label} · Version ${s.ver} · week ${verWk} on this version</span><button type="button" class="btn sm ghost" data-tab="guide">Change</button></div>
  <button type="button" class="check ${s.dbMode?"on":""}" data-dbmode="1" style="margin-bottom:10px"><span class="box">✓</span><span><div class="t" style="text-decoration:none;color:var(--ink)">Dumbbell mode</div><div class="s">Swap barbell, cable and machine lifts for their dumbbell alternatives</div></span></button>
  <div class="seg">${seg}</div>
  ${lenSeg}
  <div class="stack" style="margin-top:12px">
    ${isDeload()?`<div class="banner">Deload week: half the sets, ~20% lighter.</div>`:""}
    ${wu}${note}
    ${w.ex.map((e,i)=>exCard(wk,e,i)).join("")}
  </div>
  <p class="small muted" style="margin-top:16px">Push every set to 1-3 reps short of failure with clean form. First couple of weeks, just find your weights.</p>`;
}

function exCard(wk,e,i){
  const s=settings();
  const swapKey=s.split+"|"+e.n;
  const res = resolveName(e), name=res.name;
  const pr = parseReps(e.r);
  const key = "ex-"+slug(name)+(pr.rp?"-rp":"");
  const rec=get(key,{hist:[]}); const hist=rec.hist||[];
  const today=(hist.find(h=>h.d===TODAY)||{sets:[]}).sets;
  const prev=(hist.filter(h=>h.d!==TODAY).slice(-1)[0]||{sets:[]}).sets;
  const open=ui.open[wk+i];
  const loggedN=today.filter(x=>x&&x[1]!==""&&x[1]!=null).length;
  const rpTot=today.reduce((a,x)=>a+(+(x&&x[1])||0),0);
  const nSets = pr.rp? Math.max(4,loggedN+1) : isDeload()? Math.max(1,Math.ceil(e.s/2)) : e.s;
  const doneN=pr.rp? rpTot : today.slice(0,nSets).filter(x=>x&&x[1]!==""&&x[1]!=null).length;
  let rows="";
  for(let j=0;j<nSets;j++){
    const [lo,hi]=rngFor(pr,j); const t=today[j]||["",""]; const pv=prev[j]||[];
    rows+=`<div class="n">${pr.rp?"Mini ":""}${j+1}${pr.rr?`<br><span style="font-size:10px">${lo}-${hi}</span>`:""}</div>
      <input type="number" inputmode="decimal" step="0.5" aria-label="Set ${j+1} weight" data-set="${key}|${j}|0" value="${t[0]??""}" placeholder="${pv[0]??"lb"}">
      <input type="number" inputmode="numeric" aria-label="Set ${j+1} ${pr.unit||"reps"}" data-set="${key}|${j}|1" value="${t[1]??""}" placeholder="${pv[1]??(pr.unit?"sec":"reps")}">`;
  }
  const a=advice(name,pr,hist);
  const alts=ALT[e.n]||[];
  const cue = name===e.n ? (e.note||CUE[e.n]||"") : (CUE[name]||"Same sets, reps and rest as the original.");
  return `<div class="card ex">
    <div class="exh" data-open="${wk+i}">
      <div class="exn">${e.ss?"":"E"+(i+1)}</div>
      <div style="flex:1;min-width:0">
        ${name!==e.n?`<div class="swapped">${res.why==="manual"?"Swapped for":res.why==="Dumbbell mode"?"Dumbbell mode · replaces":"Your gear · replaces"} ${esc(e.n)}</div>`:""}
        <h3>${e.ss?`<span class="sstag">${e.ss}</span>`:""}${esc(name)}</h3>
        <div class="meta">${pr.rp?pr.label+" · 15-20s mini-rests":(nSets+" × "+pr.label+" · rest "+(e.ss&&e.rest===SS?"1 min between":e.ss&&e.rest===30?"30s between":fmtRest(e.rest)))}</div>
      </div>
      ${doneN?`<span class="pill ok done-badge">${doneN}/${pr.rp?30:nSets}</span>`:""}
      <a class="play" href="${ytLink(name)}" target="_blank" rel="noopener" aria-label="Watch ${esc(name)} tutorial" title="${YT[name]?"Watch tutorial":"Search YouTube"}"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></a>
    </div>
    ${open?`<div class="exb">
      <div class="tip ${a.cls}">${esc(a.txt)}</div>
      ${cue?`<p class="small">${esc(cue)}</p>`:""}
      <div class="sets"><div class="h">Set</div><div class="h">Weight</div><div class="h">${pr.unit?"Seconds":"Reps"}</div>${rows}</div>
      <div class="row">
        ${e.rest?`<button type="button" class="btn sm primary" data-timer="${pr.rp?20:e.rest}">${pr.rp?"20s mini-rest":"Start rest timer"}</button>`:""}
        <a class="btn sm ghost" href="${ytLink(name)}" target="_blank" rel="noopener" style="text-decoration:none">▶ ${YT[name]?"Watch tutorial":"Find on YouTube"}</a>
        ${alts.length||name!==e.n?`<button type="button" class="btn sm ghost" data-swapopen="${wk+i}">Swap</button>`:""}
      </div>
      ${ui.swapOpen[wk+i]?`<div class="stack small">
        <div class="label">Swap ${esc(e.n)} for (logs under the new name)</div>
        <div class="row" style="gap:6px">${[e.n,...alts].map(al=>`<button type="button" class="btn sm ${al===name?"primary":""}" data-swap="${esc(swapKey)}" data-alt="${esc(al)}">${esc(al)}${al===e.n?" (original)":""}${needs(al).includes("db")?" · DB":""}${canDo(al)?"":` <span style="opacity:.7;font-weight:600">· needs ${esc(missingGear(al).join(", "))}</span>`}</button>`).join("")}</div>
        <p class="small muted">Everything's tappable, including machine moves for when you're at a gym.</p>
        ${s.swaps[swapKey]?`<button type="button" class="btn sm ghost" data-swap="${esc(swapKey)}" data-alt="${esc(e.n)}" data-clear="1">Clear my pick (back to auto)</button>`:""}
      </div>`:""}
    </div>`:""}
  </div>`;
}

function g(title,html,open){ return `<details class="g"${open?" open":""}><summary><h3>${title}</h3></summary><div class="gb">${html}</div></details>` }

function viewFuel(){
  return `<h2>The two things that matter</h2>
  <div class="card stack small">
    <p><b>1. Calories:</b> eat in your goal range (a deficit). <b>2. Protein:</b> hit your minimum every day to keep muscle while you lose fat.</p>
    <p class="muted">Get both numbers from your BWS Pocket Coach. Stick to them for 3 weeks while logging weight and calories daily; from week 4 it adjusts your calories. Trust it.</p>
  </div>

  <h2>Around your workout</h2>
  <div class="stack">
  ${g("Pre-workout meal",`<p>Carbs are the star, plus some protein, within ~3 hours of training. Keep fat low if it's close to the session.</p>
   <div class="grid2"><div><div class="label">30-90 min before</div><ul><li>Rice cakes + whey shake</li><li>Banana + shake</li><li>Granola + low-fat Greek yogurt</li><li>Bagel + deli meat</li><li>Pretzels + shake</li></ul></div>
   <div><div class="label">2-3 h before</div><ul><li>Oats + peanut butter, eggs on the side</li><li>Potatoes + chicken</li><li>Rice, chicken, salad</li></ul></div></div>
   <p class="muted">Early morning session: still get some fast carbs in (banana, rice cakes, a handful of granola). Caffeine or pre-workout helps on tough days.</p>`,true)}
  ${g("Post-workout",`<p>If pre-workout was set up right, there's no rush. Have a scoop of whey after, then a protein + carb meal within 1-3 hours.</p>`)}
  ${g("Spread your protein",`<p>Splitting protein across ~4 meals is a small extra edge for muscle building. Total daily protein still matters most, so eat on whatever schedule you'll stick to. Optional: ~40 g casein (cottage cheese, Greek yogurt) 1-2 h before bed.</p>`)}
  </div>

  <h2>Supplements</h2>
  <div class="card tbl"><table>
   <tr><th>What</th><th>Dose</th><th>Why</th></tr>
   <tr><td><b>Whey isolate</b></td><td class="mono">up to 2-3 scoops</td><td>Easiest way to hit protein; best around training</td></tr>
   <tr><td><b>Creatine mono</b></td><td class="mono">3-5 g/day</td><td>Strength and size; take it daily</td></tr>
   <tr><td><b>Fish oil</b></td><td class="mono">2-5 g omega-3</td><td>EPA/DHA from fish oil + fish meals; recovery</td></tr>
   <tr><td><b>Vitamin D3</b></td><td class="mono">1-2k IU</td><td>Hard to get from food</td></tr>
   <tr><td><b>Zinc citrate</b></td><td class="mono">~11 mg</td><td>If you don't eat much seafood or poultry</td></tr>
   <tr><td><b>Pre-workout</b></td><td class="mono">optional</td><td>Mostly caffeine; helps when short on sleep</td></tr>
  </table></div>
  <p class="small muted" style="margin-top:8px">Check with your doctor first, especially if you take medication.</p>

  <h2>Food & tracking</h2>
  <div class="stack">
  ${g("Swaps that save calories",`<ul><li>Powdered peanut butter instead of regular (half the calories)</li><li>Sugar-free syrup and sugar-free BBQ sauce</li><li>Low-cal ice cream (Halo Top, Enlightened)</li><li>Stevia or monk fruit instead of sugar</li><li>Spray oil instead of pouring oil</li></ul>`)}
  ${g("Tracking accurately",`<ul><li>Weigh food with a scale for peanut butter, meat, rice, potatoes</li><li>Pick the right "cooked" vs "raw" entry</li><li>Hidden calories: oils, dressings, sauces, bites, drinks</li><li>Eating out: find the chain's entry, or log the ingredients</li></ul>`)}
  ${g("80/20 rule",`<p>About 80% whole, nutritious foods; 20% foods you just enjoy — still logged. Fruit or veg with most meals.</p>`)}
  ${g("Weekends, treats, drinks",`<ul><li><b>Bank calories:</b> eat lighter, high-protein meals earlier on days with a big dinner or event</li><li>Treat meals are fine when they fit your weekly calories</li><li><b>Alcohol:</b> a beer is 200-300 empty calories. On nights out, go liquor + zero-cal mixer (vodka soda)</li><li>Take a rest day after heavy drinking</li></ul>`)}
  ${g("Intermittent fasting (optional)",`<p>16:8 doesn't burn more fat, but a shorter eating window can make a deficit easier. Black coffee, tea and gum are fine during the fast. Not great during a bulk.</p>`)}
  </div>

  <h2>When fat loss stalls</h2>
  <div class="stack">
  ${g("Plateau steps",`<ol><li><b>Audit tracking.</b> Most stalls are untracked bites, oils and drinks.</li><li><b>Confirm it's real.</b> Weekly average flat for 2+ weeks with no new low.</li><li><b>Follow the Pocket Coach</b> — let it lower calories a little, or add steps.</li><li><b>Diet break or refeed</b> if you're worn out.</li></ol>`)}
  ${g("Diet breaks & refeeds",`<p>Use when you've dieted 8+ weeks, feel drained or very hungry, are getting lean (~12%), or hit a plateau.</p><ul><li><b>Diet break:</b> a week at maintenance, mostly from extra carbs. In studies, one after every 4 weeks of dieting.</li><li><b>Refeed:</b> 1-2 days at maintenance, carb-heavy.</li><li>Expect a little water weight. Neither is a binge.</li></ul>`)}
  </div>`;
}

function viewGuide(){
  const s=settings(); const bw=+s.bw||0; const sc=schedule(), p=prog();
  const std=[["Bench press",1.344],["Incline DB press (each DB)",0.531],["Standing barbell OHP",0.906],["Weighted pull-up (BW + added)",1.3125],["Deadlift",2.0],["Back squat",1.719]];
  const rm=ui.rm||{w:"",r:""}; const e1 = rm.w&&rm.r? (+rm.w)*(1+(+rm.r)/30):0;
  const opts=k=>`<option value="">Rest</option>`+p.keys.map(x=>`<option value="${x}" ${x===k?"selected":""}>${p.names[x]}</option>`).join("");
  return `<h2>Your program</h2>
  <div class="card stack">
    <div class="grid2">
      <div><label class="label" for="sSplit">Days per week</label><select id="sSplit">${[3,4,5].map(n=>`<option value="${n}" ${s.split==n?"selected":""}>${n}-day</option>`).join("")}</select></div>
      <div><label class="label" for="sVer">Version</label><select id="sVer">${[1,2,3].map(n=>`<option value="${n}" ${s.ver==n?"selected":""}>V${n}</option>`).join("")}</select></div>
      <div><label class="label" for="sStart">Program start</label><input id="sStart" type="date" value="${s.start}"></div>
      <div><label class="label" for="sBw">Bodyweight (lb)</label><input id="sBw" type="number" inputmode="decimal" value="${s.bw}" placeholder="e.g. 180"></div>
    </div>
    <p class="small muted">Start with V1 and run it 8-12 weeks before switching versions. Every 9th week from your start date is a deload. Your logs follow the exercise, so lifts shared between versions keep their history.</p>
    <div class="label" style="margin-top:4px">Weekly schedule</div>
    <div class="grid2">${[1,2,3,4,5,6,0].map(d=>`<div><label class="label" for="sd${d}">${DOW[d]}</label><select id="sd${d}" data-sd="${d}">${opts(sc[d])}</select></div>`).join("")}</div>
    <p class="small muted">Exact days don't matter. ${s.split==3?"Keep a rest day between full-body sessions.":s.split==4?"Don't do more than 2 days in a row; rest after lower days.":"No more than 3 days in a row; rest after lower days."}</p>
  </div>

  <h2>Home gear</h2>
  <div class="card stack">
    <p class="small muted">Untick anything you don't have. Exercises that need it switch to the first alternative you can do.</p>
    <div class="row" style="gap:6px">${GEAR.map(([k,l])=>`<button type="button" class="btn sm ${gear()[k]===false?"ghost":"primary"}" data-gear="${k}">${gear()[k]===false?"":"✓ "}${l}</button>`).join("")}</div>
  </div>

  <h2>Backups</h2>
  <div class="card stack">
    <p class="small">Your logs sync across your devices automatically. For an extra copy you keep yourself:</p>
    <div class="row">
      <button type="button" class="btn sm primary" id="exportBtn">Export backup (.json)</button>
      <button type="button" class="btn sm" id="copyBtn">Copy backup text</button>
      <button type="button" class="btn sm ghost" id="importBtn">Import backup</button>
    </div>
    <p class="small muted">Import merges into what's here. Keep the file in iCloud Drive or wherever you like.</p>
  </div>

  <h2>Training rules</h2>
  <div class="stack">
  ${g("Double progression",`<p>Stay at a weight until you hit the <b>top of the rep range on every set</b>, then add a little weight (~5 lb; 10 lb on squats and deadlifts). The Train tab reads your last session and tells you which way to go.</p><ul><li>Missed the bottom of the range → drop the weight back</li><li>Any extra rep is progress</li><li>Focus progress on the first big lifts of each workout</li><li>Strength gains are harder in a deficit; holding strength late in a cut is fine</li></ul>`,true)}
  ${g("How hard to push",`<p>Every working set ends 1-3 reps short of failure, with good form. Most people stop too early. Don't go to all-out failure every set; it costs recovery without much extra gain.</p>`)}
  ${g("Reverse pyramid (RPT)",`<p>Heaviest set first (6-8), then ~10% lighter for 8-10, then ~10% lighter again for 10-12. Progress the top set.</p>`)}
  ${g("Deload weeks",`<p>After 8 weeks of training, week 9 is a deload: same workouts, <b>half the sets, ~20% lighter</b>. Go by feel too: take one early if you're unmotivated, tired, or losing strength; never go past 10 weeks without one. Taking a week fully off works too.</p>`)}
  ${g("Strength plateau (stalled 3+ weeks)",`<p>First check sleep (7h+), effort, calories and protein, too much cardio, stress, and whether your form has slipped.</p><ol><li>Drop 5-10 lb and climb back in smaller jumps (microplates help)</li><li>Chase extra reps above the range before adding weight; try rest-pause on the last set</li><li>Take an early deload</li><li>Swap to an alternative for 8-12 weeks</li><li>Weekly undulating: rotate 4, 8 and 12 reps week to week on the big compounds (use the calculator below)</li></ol>`)}
  ${g("Exercise order",`<p>Lagging muscle? Move its exercise earlier in the workout and push a strong area later. A few swaps only.</p>`)}
  ${g("Mind-muscle cues",`<ul><li><b>Chest:</b> think "squeeze the biceps together"</li><li><b>Back:</b> thumbless grip, hands are hooks, pull with the elbows</li><li><b>Shoulders:</b> raise out, not up; no shrugging</li><li><b>Abs:</b> pelvis tucked so hip flexors don't take over</li></ul>`)}
  </div>

  <h2>Rest days</h2>
  <div class="stack">
  ${g("Daily 5-min stretch",`<div class="tbl"><table>${STRETCH.map(r=>`<tr><td>${r[0]}</td><td class="mono">${r[1]}</td></tr>`).join("")}</table></div><p class="muted">As many quality reps as you can in each slot. Once a day, whenever you'll do it.</p>`)}
  ${g("Active rest",`<p>Don't sit all day: extra walk for steps, foam rolling, a hobby or sport. Do prehab and abs here. Optional cool-down after leg days: 5 min foam rolling + 5 min easy bike.</p>`)}
  ${g("Optional HIIT",`<p>Not in the 2.0 plan (steps do the job), but if you like it: on a bike, 30 s hard / 60-90 s easy × 6, once a week, never right before lifting.</p>`)}
  </div>

  <h2>Calculators</h2>
  <div class="card stack">
    <h3>Estimated 1RM</h3>
    <div class="grid2">
      <div><label class="label" for="rmW">Weight</label><input id="rmW" type="number" inputmode="decimal" value="${rm.w}" placeholder="185"></div>
      <div><label class="label" for="rmR">Reps</label><input id="rmR" type="number" inputmode="numeric" value="${rm.r}" placeholder="8"></div>
    </div>
    <div id="rmOut">${rmOut(e1)}</div>
  </div>
  <div class="card stack" style="margin-top:10px">
    <h3>Strength targets (5 reps)</h3>
    <p class="small muted">Stronger than ~80% of lifters for your bodyweight${bw?"":". Add your bodyweight above"}. Good form, full range.</p>
    <div class="tbl"><table><tr><th>Lift</th><th>Goal × 5</th></tr>${std.map(r=>`<tr><td>${r[0]}</td><td class="mono">${bw? Math.round(bw*r[1]/5)*5+" lb" : r[1].toFixed(2)+"× BW"}</td></tr>`).join("")}</table></div>
  </div>

  <h2>Progress</h2>
  <div class="stack">
  ${g("What to track",`<ul><li>Morning weight daily → weekly average</li><li>Waist measurement and progress photos monthly</li><li>Strength, energy, how clothes fit</li><li>Weight flat but waist down and photos better? Change nothing</li></ul>`)}
  ${g("When do abs show?",`<p>Fat comes off face, arms and chest first; the lower belly is last. Abs show around 12% body fat for most men, sharper near 10%. At ~1 lb a week, 15% → roughly 10+ weeks.</p>`)}
  ${g("After the cut",`<ul><li><b>Maintain:</b> set the Pocket Coach to maintain, ease calories up, same training, 8-12k steps</li><li><b>Build:</b> set it to build muscle, raise calories over a few weeks, push for strength. Run 3+ months, ideally 6-12</li></ul>`)}
  </div>
  <p class="small muted" style="margin-top:18px">Summarized from the Built With Science Intermediate SHRED 2.0 program for personal use.</p>`;
}
function rmOut(e1){ if(!e1) return `<p class="small muted">Enter a set you took near failure.</p>`; return `<p>Est. 1RM <b class="mono">${Math.round(e1)} lb</b></p><div class="tbl"><table><tr><th>Undulating week</th><th>% 1RM</th><th>Start weight</th></tr>${[["4 reps",.85],["8 reps",.75],["12 reps",.65]].map(r=>`<tr><td>${r[0]}</td><td class="mono">${Math.round(r[1]*100)}%</td><td class="mono">${Math.floor(e1*r[1]/5)*5} lb</td></tr>`).join("")}</table></div>` }

/* ===================== EVENTS ===================== */
document.addEventListener("click",async ev=>{
  const t=ev.target.closest("button"); if(!t) return;
  if(t.dataset.tab){ ui.tab=t.dataset.tab; try{localStorage.setItem("shredcoach.tab",ui.tab)}catch(e){} render(); window.scrollTo(0,0); return }
  if(t.dataset.day){ ui.day=t.dataset.day; render(); return }
  if(t.dataset.ck){ const id="day-"+ui.day; const r=get(id); r.c=r.c||{}; r.c[t.dataset.ck]=!r.c[t.dataset.ck]; put(id,r); render(); return }
  if(t.dataset.go){ ui.tab="train"; ui.wk=t.dataset.go; render(); window.scrollTo(0,0); return }
  if(t.dataset.wk){ ui.wk=t.dataset.wk; render(); return }
  if(t.dataset.open!==undefined){ ui.open[t.dataset.open]=!ui.open[t.dataset.open]; render(); return }
  if(t.dataset.swapopen){ ui.swapOpen[t.dataset.swapopen]=!ui.swapOpen[t.dataset.swapopen]; render(); return }
  if(t.dataset.swap){ const s=get("settings"); s.swaps=s.swaps||{}; if(t.dataset.clear) delete s.swaps[t.dataset.swap]; else s.swaps[t.dataset.swap]=t.dataset.alt; put("settings",s); render(); return }
  if(t.dataset.len){ const s=get("settings"); s.len=t.dataset.len; put("settings",s); render(); return }
  if(t.dataset.dbmode!==undefined){ const s=get("settings"); s.dbMode=!settings().dbMode; put("settings",s); render(); toast(s.dbMode?"Dumbbell mode on":"Dumbbell mode off"); return }
  if(t.dataset.gear){ const s=get("settings"); s.gear=Object.assign({},s.gear||{}); s.gear[t.dataset.gear]= gear()[t.dataset.gear]===false; put("settings",s); render(); return }
  if(t.dataset.timer){ startTimer(+t.dataset.timer); return }
  if(t.id==="exportBtn"){ try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(S.data,null,1)],{type:"application/json"})); a.download="shred-coach-backup-"+TODAY+".json"; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000); toast("Backup saved") }catch(e){ toast("Couldn't save the file here — use Copy backup text") } return }
  if(t.id==="copyBtn"){ const txt=JSON.stringify(S.data); try{ await navigator.clipboard.writeText(txt); toast("Backup copied — paste it into Notes or a file") }catch(e){ toast("Clipboard blocked here") } return }
  if(t.id==="importBtn"){ $("#importFile").click(); return }
});
$("#importFile").addEventListener("change",async ev=>{
  const f=ev.target.files[0]; if(!f) return;
  try{ const obj=JSON.parse(await f.text()); let n=0; Object.keys(obj).forEach(k=>{ if(/^(day-|ex-|settings$)/.test(k)){ put(k,obj[k]); n++ } }); toast("Imported "+n+" records"); render() }catch(e){ toast("That file isn't a Shred Coach backup") }
  ev.target.value="";
});
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.dataset.set){
    const [id,j,f]=el.dataset.set.split("|"); const r=get(id,{hist:[]}); r.hist=r.hist||[];
    let h=r.hist.find(x=>x.d===TODAY); if(!h){ h={d:TODAY,sets:[]}; r.hist.push(h) }
    while(h.sets.length<=+j) h.sets.push(["",""]);
    h.sets[+j][+f]= el.value===""?"":+el.value;
    r.hist=r.hist.slice(-60); put(id,r); return;
  }
  if(el.id==="wIn"){ const id="day-"+ui.day; const r=get(id); r.wt=el.value===""?null:+el.value; put(id,r); return }
  if(el.id==="stepsIn"){ const id="day-"+ui.day; const r=get(id); r.steps=el.value===""?null:+el.value; put(id,r); return }
  const map={sWt:"wt",sWake:"wake",sBed:"bed",sStart:"start",sBw:"bw"};
  if(map[el.id]){ const s=get("settings"); s[map[el.id]]=el.value; put("settings",s); return }
  if(el.id==="rmW"||el.id==="rmR"){ ui.rm={w:$("#rmW").value,r:$("#rmR").value}; const e1=ui.rm.w&&ui.rm.r?(+ui.rm.w)*(1+(+ui.rm.r)/30):0; $("#rmOut").innerHTML=rmOut(e1); return }
});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.id==="sSplit"||el.id==="sVer"){ const s=get("settings"); if(el.id==="sSplit") s.split=el.value; else s.ver=el.value; s.verStart=TODAY; put("settings",s); ui.wk=null; render(); toast("Switched to "+settings().split+"-day V"+settings().ver); return }
  if(el.dataset.sd!==undefined){ const s=get("settings"); const sp=settings().split; s.sched=s.sched||{}; s.sched[sp]=Object.assign({},schedule(),s.sched[sp]||{}); s.sched[sp][el.dataset.sd]=el.value; put("settings",s); render(); return }
  if(["sWt","sWake","sBed","sStart","sBw"].includes(el.id)) render();
  if(el.id==="stepsIn"||el.id==="wIn") render();
});

/* rest timer */
let tEnd=0,tInt=null,actx=null;
function startTimer(sec){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)() }catch(e){}
  tEnd=Date.now()+sec*1000; $("#timer").hidden=false; $("#timer").classList.remove("done");
  clearInterval(tInt); tInt=setInterval(tick,250); tick();
}
function tick(){
  const left=Math.max(0,Math.round((tEnd-Date.now())/1000));
  $("#tv").textContent=Math.floor(left/60)+":"+pad(left%60);
  if(left===0){ clearInterval(tInt); $("#timer").classList.add("done"); $("#tv").textContent="Go!"; beep(); try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){} }
}
function beep(){ try{ if(!actx) return; [0,.25].forEach(d=>{const o=actx.createOscillator(),gn=actx.createGain();o.frequency.value=880;gn.gain.value=.15;o.connect(gn);gn.connect(actx.destination);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.15)}) }catch(e){} }
$("#tPlus").onclick=()=>{ tEnd=Math.max(tEnd,Date.now())+30000; $("#timer").classList.remove("done"); clearInterval(tInt); tInt=setInterval(tick,250); tick() };
$("#tStop").onclick=()=>{ clearInterval(tInt); $("#timer").hidden=true };

render();
</script>

</body></html>
