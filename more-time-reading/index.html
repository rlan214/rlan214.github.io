<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MORE TIME">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MORE TIME Reading</title>
<link rel="apple-touch-icon" sizes="180x180" href="/more-time-reading/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="/more-time-reading/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap">
<style>
/* MORE TIME Reading: kid side = library, reader, quiz. Parent side behind a PIN.
   Same season theme engine as Word Hive / ABC Rocket. */
:root{
  --sky:#FFF6E6; --sky-ink:#2A1F3D; --surface:#FFFFFF; --ink:#2A1F3D; --muted:#7A6F8E; --line:#EFE4D3;
  --accent:#E8574F; --accent-deep:#B23A33; --accent-soft:#FDE6E4;
  --honey:#FFB31F; --honey-deep:#C77F00; --honey-soft:#FFF0CC;
  --good:#22B07D; --good-deep:#158A5F; --good-soft:#DCF5EA;
  --bad:#E0464C; --bad-deep:#A82C32; --bad-soft:#FCE3E4;
  --on:#FFFFFF; --page:#FFFCF5; --page-ink:#2B2433;
  --f-display:"Baloo 2","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-weight:700;font-size:17px;-webkit-tap-highlight-color:transparent;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}

/* ---------- scene (season backdrop) ---------- */
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--sky)}
#scene .p{position:absolute;top:-12vh;left:var(--x);width:var(--s);animation:fall var(--d) linear var(--dl) infinite;opacity:var(--o,1)}
#scene .p > svg{display:block;width:100%;height:auto;animation:sway var(--sw) ease-in-out infinite alternate}
#scene .p.up{top:auto;bottom:-12vh;animation-name:rise}
#scene .p.fly{top:var(--y);left:-14vw;animation-name:flyx}
#scene .p.fly > svg{animation:flap .22s ease-in-out infinite alternate}
#scene .p.still{top:var(--y);animation:twinkle var(--d) ease-in-out var(--dl) infinite alternate}
#scene .p.still > svg{animation:none}
@keyframes fall{to{transform:translateY(126vh)}}
@keyframes rise{to{transform:translateY(-126vh)}}
@keyframes flyx{0%{transform:translate(0,0)}50%{transform:translate(64vw,-4vh)}100%{transform:translate(128vw,2vh)}}
@keyframes sway{from{transform:translateX(-26px) rotate(-28deg)}to{transform:translateX(26px) rotate(32deg)}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.55)}}
@keyframes twinkle{from{opacity:.25;transform:scale(.8)}to{opacity:1;transform:scale(1.1)}}
#scene .sun{position:absolute;right:4vw;top:calc(var(--safe-t) + 56px);width:clamp(70px,11vw,120px);aspect-ratio:1}
#scene .sun .rays{animation:spin 40s linear infinite;transform-origin:50% 50%}
#scene .moon{position:absolute;right:7vw;top:calc(var(--safe-t) + 9vh);width:clamp(80px,12vw,130px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 36% 34%,#FFFBE6,#FFE9A8 55%,#F0CC6A);box-shadow:0 0 50px 16px rgba(255,236,170,.35)}
#scene .moon::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 62% 60%,rgba(200,160,70,.35) 0 9%,transparent 10%),radial-gradient(circle at 40% 70%,rgba(200,160,70,.28) 0 6%,transparent 7%),radial-gradient(circle at 66% 32%,rgba(200,160,70,.25) 0 5%,transparent 6%)}
@keyframes spin{to{transform:rotate(360deg)}}
#scene .ground{position:absolute;left:0;right:0;bottom:0;height:18vh;min-height:110px}
#scene .ground svg{width:100%;height:100%;display:block}
#scene .lights{position:absolute;left:0;right:0;top:calc(var(--safe-t) - 6px);height:36px}
body.has-lights .screen{padding-top:calc(var(--safe-t) + 22px)}
#scene .lights svg{width:100%;height:100%;display:block}
#scene .lights .bulb{animation:blink 1.6s ease-in-out infinite alternate}
@keyframes blink{from{opacity:.45}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#scene *{animation:none!important}}


/* ---------- shell ---------- */
#app{position:relative;z-index:1;height:100%}
.screen{height:100%;display:flex;flex-direction:column;max-width:960px;margin:0 auto;padding-top:var(--safe-t)}
body.has-lights .screen{padding-top:calc(var(--safe-t) + 22px)}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;flex:none}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;font-family:var(--f-display);font-weight:800;font-size:1.45rem;color:var(--sky-ink);line-height:1}
.brand img{width:40px;height:40px;border-radius:11px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.brand small{display:block;font-size:.8rem;opacity:.8;letter-spacing:.14em}
.title{margin-right:auto;font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--sky-ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:var(--ink);background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);flex:none}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.iconbtn svg{width:24px;height:24px}
.iconbtn.sm{width:44px;height:44px;border-radius:14px}
.iconbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 0 var(--accent-deep)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(30px + var(--safe-b))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 24px;border-radius:20px;font-family:var(--f-display);font-weight:800;font-size:1.3rem;
  background:var(--accent);color:var(--on);box-shadow:0 6px 0 var(--accent-deep);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.good{background:var(--good);box-shadow:0 6px 0 var(--good-deep)}
.btn.good:active{box-shadow:0 1px 0 var(--good-deep)}
.btn.honey{background:var(--honey);color:#3A2600;box-shadow:0 6px 0 var(--honey-deep)}
.btn.honey:active{box-shadow:0 1px 0 var(--honey-deep)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn svg{width:24px;height:24px}
.btn.sm{font-size:1.05rem;padding:11px 16px;border-radius:16px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:18px;box-shadow:0 5px 0 var(--line),0 14px 30px rgba(0,0,0,.08)}

/* ---------- home ---------- */
.hello{padding:4px 4px 14px;color:var(--sky-ink)}
.hello h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(2.1rem,6.5vw,3rem);line-height:1}
.hello p{margin:6px 0 0;font-size:1.1rem;opacity:.9}
.play{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pring{--p:0;position:relative;width:96px;height:96px;border-radius:50%;flex:none;display:grid;place-items:center}
.pring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p)*1%),color-mix(in srgb,var(--ink) 13%,transparent) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 12px),#000 calc(100% - 11px));mask:radial-gradient(farthest-side,transparent calc(100% - 12px),#000 calc(100% - 11px))}
.pring>div{position:relative;text-align:center;line-height:1}
.pring b{display:block;font-family:var(--f-display);font-weight:800;font-size:2.1rem}
.pring small{font-size:.74rem;color:var(--muted)}
.ptext{flex:1;min-width:170px}
.ptext h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.35rem}
.ptext p{margin:2px 0 0;color:var(--muted)}
.pbtns{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.shelf{margin-top:24px}
.shelf-h{display:flex;align-items:flex-end;gap:12px;margin:0 4px 12px;color:var(--sky-ink)}
.shelf-h h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.45rem;line-height:1.05}
.shelf-h small{display:block;font-size:.85rem;opacity:.8;font-weight:700}
.shelf-h .count{margin-left:auto;font-size:.9rem;opacity:.85;white-space:nowrap}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.book{position:relative;display:flex;flex-direction:column;text-align:left;border-radius:22px;overflow:hidden;background:var(--surface);border:2px solid var(--line);box-shadow:0 5px 0 var(--line),0 12px 24px rgba(0,0,0,.08);transition:transform .08s}
.book:active{transform:translateY(4px)}
.cover{position:relative;height:118px;display:grid;place-items:center;background:var(--c);overflow:hidden}
.cover::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.17);top:-60px;right:-50px}
.cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:rgba(0,0,0,.14)}
.cover .em{position:relative;font-size:3.6rem;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.16))}
.cover .num{position:absolute;left:20px;top:10px;font-family:var(--f-display);font-weight:800;font-size:.95rem;color:rgba(255,255,255,.92);letter-spacing:.06em}
.bmeta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.bmeta b{font-family:var(--f-display);font-weight:800;font-size:1.06rem;line-height:1.15;color:var(--ink)}
.bmeta span{font-size:.82rem;color:var(--muted)}
.bbar{height:6px;border-radius:999px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden;margin-top:auto}
.bbar i{display:block;height:100%;background:var(--good);border-radius:inherit}
.badge{position:absolute;top:8px;right:8px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.95);color:#1d6b4b;font-size:.78rem;font-weight:800}
.badge.go{color:var(--accent-deep)}

/* ---------- reader ---------- */
.reader .topbar{gap:8px}
.rprog{height:6px;margin:0 16px;border-radius:999px;background:color-mix(in srgb,var(--sky-ink) 18%,transparent);overflow:hidden;flex:none}
.rprog i{display:block;height:100%;width:0;background:var(--good);border-radius:inherit;transition:width .2s}
.rscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px calc(40px + var(--safe-b))}
.page{max-width:720px;margin:0 auto;background:var(--page);color:var(--page-ink);border-radius:26px;padding:clamp(22px,5vw,46px);box-shadow:0 6px 0 rgba(0,0,0,.08),0 22px 46px rgba(0,0,0,.16);position:relative}
.page::before{content:"";position:absolute;inset:10px;border:1.5px dashed rgba(120,90,60,.16);border-radius:20px;pointer-events:none}
.page .hd{text-align:center;margin-bottom:22px}
.page .hd .em{font-size:3.4rem;line-height:1}
.page .hd .kicker{font-family:var(--f-display);font-weight:800;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-deep)}
.page .hd h1{margin:4px 0 0;font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,5vw,2.4rem);line-height:1.08;color:var(--page-ink)}
.page .hd .min{margin-top:6px;font-size:.9rem;color:#8a7f73}
.txt{font-family:var(--f-read);font-weight:400;font-size:calc(1.22rem * var(--fs,1));line-height:1.75;color:var(--page-ink);-webkit-user-select:none;user-select:none}
.txt p{margin:0 0 1.05em;border-radius:10px;transition:background .2s}
.txt h3.ch{font-family:var(--f-display);font-weight:800;font-size:1.25em;margin:1.4em 0 .6em;color:var(--accent-deep);text-align:center}
.txt h3.ch:first-child{margin-top:0}
.txt p.drop::first-letter{font-family:var(--f-display);font-weight:800;float:left;font-size:3.6em;line-height:.85;margin:.06em .1em 0 0;color:var(--accent)}
.txt .verse{margin:0 0 1.05em 1.4em;font-style:italic}
.txt .verse span.l{display:block}
.txt p.now,.txt .verse.now{background:color-mix(in srgb,var(--honey) 28%,transparent);box-shadow:0 0 0 6px color-mix(in srgb,var(--honey) 28%,transparent)}
.w{border-radius:5px;cursor:pointer}
.w.hit{background:var(--honey);color:#2a1a00;box-shadow:0 0 0 3px var(--honey)}
.endbox{margin-top:26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.endbox p{margin:0;color:#8a7f73;font-family:var(--f-body)}
.tip{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%);background:#1d1730;color:#fff;padding:10px 16px;border-radius:14px;z-index:20;font-weight:800;font-size:1rem;max-width:90vw;text-align:center;animation:pop .25s}
.paused{position:fixed;inset:0;z-index:15;display:grid;place-items:center;background:rgba(20,14,40,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.paused .card{text-align:center;max-width:340px}
.paused h3{margin:0 0 6px;font-family:var(--f-display);font-size:1.5rem}
.paused p{margin:0 0 14px;color:var(--muted)}

/* ---------- quiz ---------- */
.quiz{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:10px 16px calc(20px + var(--safe-b));overflow-y:auto}
.qcard{width:100%;max-width:640px}
.qcount{font-family:var(--f-display);font-weight:800;color:var(--sky-ink);font-size:1.05rem;letter-spacing:.06em;text-align:center}
.qcard h2{margin:0 0 16px;font-family:var(--f-display);font-weight:800;font-size:clamp(1.4rem,4.2vw,1.8rem);line-height:1.2}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:15px 16px;border-radius:18px;background:var(--surface);border:2.5px solid var(--line);box-shadow:0 4px 0 var(--line);font-size:1.12rem;color:var(--ink)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .k{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-deep);font-family:var(--f-display);font-weight:800}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:.85}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.qdots{display:flex;gap:8px;justify-content:center}
.qdots i{width:16px;height:16px;border-radius:50%;background:color-mix(in srgb,var(--sky-ink) 20%,transparent)}
.qdots i.ok{background:var(--good)}.qdots i.no{background:var(--bad)}.qdots i.cur{background:var(--honey)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:16px;overflow-y:auto}
.center h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(2.2rem,7vw,3.2rem);color:var(--sky-ink);line-height:1.05}
.center p.sub{margin:0;color:var(--sky-ink);font-size:1.2rem;opacity:.92}
.bigem{font-size:clamp(4rem,14vw,6rem);line-height:1;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.done-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.statrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stat{min-width:110px;padding:12px 16px;border-radius:18px;background:var(--surface);border:2px solid var(--line)}
.stat b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.7rem;color:var(--ink);line-height:1}
.stat small{color:var(--muted);font-size:.82rem}

/* ---------- PIN + parent ---------- */
.pin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:16px}
.pin h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.8rem;color:var(--sky-ink)}
.pdots{display:flex;gap:14px}
.pdots i{width:20px;height:20px;border-radius:50%;background:color-mix(in srgb,var(--sky-ink) 22%,transparent)}
.pdots i.on{background:var(--sky-ink)}
.pdots.shake{animation:wig .35s}
@keyframes wig{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:12px}
.pad button{height:72px;border-radius:20px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-family:var(--f-display);font-weight:800;font-size:1.8rem;color:var(--ink)}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad .blank{visibility:hidden}
.parent .card{margin-top:14px}
.parent h3{margin:0 0 4px;font-family:var(--f-display);font-weight:800;font-size:1.25rem}
.parent p.hint{margin:0 0 10px;color:var(--muted);font-size:.92rem;line-height:1.45}
.parent label{display:block;font-size:.9rem;margin:12px 0 6px}
.parent input[type=text],.parent select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:10px 14px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-weight:800;text-align:left}
.seg button small{display:block;font-weight:700;font-size:.78rem;color:var(--muted)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg button.on small{color:rgba(255,255,255,.85)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.switch input{width:52px;height:30px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:999px;position:relative;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch input:checked{background:var(--good)}
.switch input:checked::after{left:25px}
input[type=range]{width:100%;accent-color:var(--accent)}
.days{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.days span{min-width:46px;padding:6px 8px;border-radius:12px;background:var(--accent-soft);text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.05rem;color:var(--ink)}
.days span small{display:block;font-family:var(--f-body);font-size:.7rem;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:8px 0 6px}
.kpi{padding:12px;border-radius:16px;background:var(--accent-soft)}
.kpi b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1.05;color:var(--ink)}
.kpi small{color:var(--muted);font-size:.8rem}
.kpi em{font-style:normal;font-size:.8rem;font-weight:800}
.up{color:var(--good-deep)}.down{color:var(--bad-deep)}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:8px}
.tbl th{text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 5px;border-bottom:2px solid var(--line)}
.tbl td{padding:8px 5px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n{font-family:var(--f-display);font-weight:800;white-space:nowrap}
.tbl .flag{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:8px;background:var(--bad-soft);color:var(--bad-deep);font-size:.72rem}
.tbl .tw{color:var(--muted);font-size:.82rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--honey-soft);color:var(--ink);padding:4px 10px;border-radius:10px;font-size:.9rem}
.chip b{opacity:.6;margin-left:3px}
.btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}

  try{ const r = JSON.parse(localStorage.getItem(KEY)); if (r && r.v === 1){ const b = blank(); r.set = Object.assign(b.set, r.set||{}); r.reads = r.reads||{}; r.days = r.days||{}; return r; } }catch(e){}

const THEME_ORDER = ['auto','autumn','halloween','christmas','winter','spring','summer','classic'];
function themeName(){
  const t = S.set.theme || 'auto';
  if (THEMES[t]) return t;
  const m = new Date().getMonth();
  return Object.keys(THEMES).find(k => THEMES[k].months.includes(m)) || 'classic';
}
const TH = () => THEMES[themeName()];
const CLASSIC_DARK = {'--sky':'#17122A','--sky-ink':'#F2ECFF','--surface':'#221B3A','--ink':'#F2ECFF','--muted':'#A79CC4','--line':'#342A55',

function particle(svg, cls, o){
  const st = Object.entries(o).map(([k,v])=>`--${k}:${v}`).join(';');
  return `<div class="p ${cls}" style="${st}">${svg}</div>`;
}
const rnd = (a,b) => a + Math.random()*(b-a);
function sceneFx(kind){
  const out = [];
  const fallers = (n, svgs, smin, smax, dmin, dmax) => { for (let i=0;i<n;i++) out.push(particle(pick(svgs), '', {x:rnd(-4,98).toFixed(1)+'vw', s:rnd(smin,smax).toFixed(0)+'px', d:rnd(dmin,dmax).toFixed(1)+'s', dl:(-rnd(0,dmax)).toFixed(1)+'s', sw:rnd(1.6,3.4).toFixed(1)+'s', o:rnd(.75,1).toFixed(2)})); };
  if (kind==='leaves'){
    const cs = ['#D2542A','#F4A93A','#B83A1B','#E8C547','#9C4A2A','#E07A2E'];
    fallers(16, cs.map((c,i)=>i%2?OVAL_LEAF(c):LEAF(c)), 22, 42, 11, 20);
  } else if (kind==='snow'){
    for (let i=0;i<34;i++) out.push(particle(DOT, '', {x:rnd(0,100).toFixed(1)+'vw', s:rnd(4,10).toFixed(0)+'px', d:rnd(9,18).toFixed(1)+'s', dl:(-rnd(0,18)).toFixed(1)+'s', sw:rnd(2,4).toFixed(1)+'s', o:rnd(.5,.95).toFixed(2)}));

  } else if (kind==='petals'){
    fallers(18, ['#FF9EC4','#FFC2D9','#FFFFFF','#F7B3CF'].map(PETAL), 14, 24, 12, 20);
  } else if (kind==='bubbles'){
    for (let i=0;i<14;i++) out.push(particle(BUBBLE, 'up', {x:rnd(0,96).toFixed(1)+'vw', s:rnd(18,44).toFixed(0)+'px', d:rnd(14,26).toFixed(1)+'s', dl:(-rnd(0,26)).toFixed(1)+'s', sw:rnd(2.5,4.5).toFixed(1)+'s', o:rnd(.7,1).toFixed(2)}));
  } else if (kind==='bats'){
    for (let i=0;i<26;i++) out.push(particle(SPARK('#FFF4C9'), 'still', {x:rnd(0,100).toFixed(1)+'vw', y:rnd(2,60).toFixed(1)+'vh', s:rnd(5,12).toFixed(0)+'px', d:rnd(1.4,3.4).toFixed(1)+'s', dl:(-rnd(0,3)).toFixed(1)+'s', sw:'1s'}));
    for (let i=0;i<4;i++) out.push(particle(BAT, 'fly', {x:'0', y:rnd(10,38).toFixed(1)+'vh', s:rnd(34,62).toFixed(0)+'px', d:rnd(16,28).toFixed(1)+'s', dl:(-rnd(0,24)).toFixed(1)+'s', sw:'1s'}));
  } else if (kind==='bees'){
    for (let i=0;i<3;i++) out.push(particle(BEE, 'fly', {x:'0', y:rnd(14,50).toFixed(1)+'vh', s:rnd(30,44).toFixed(0)+'px', d:rnd(22,34).toFixed(1)+'s', dl:(-rnd(0,30)).toFixed(1)+'s', sw:'1s'}));
  }
  return out.join('');
}
function lightsSvg(){

  return `<svg viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 10 Q 25 26 50 12 T 100 12 T 150 12 T 200 12 T 250 12 T 300 12 T 350 12 T 400 12 T 450 12 T 500 12 T 550 12 T 600 12 T 650 12 T 700 12 T 750 12 T 800 12 T 850 12 T 900 12 T 950 12 T 1000 12 T 1050 12 T 1100 12 T 1150 12 T 1200 12" stroke="#2B3A2B" stroke-width="2" fill="none"/>${b}</svg>`;

let appliedTheme = null;
function applyTheme(force){
  const name = themeName();
  const dark = name==='classic' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  const key = name + (dark?'-d':'');
  if (key === appliedTheme && !force) return;

  const t = THEMES[name], root = document.documentElement;
  const all = new Set([...Object.values(THEMES).flatMap(x=>Object.keys(x.vars)), ...Object.keys(CLASSIC_DARK), '--accent-ink','--honey-ink']);
  all.forEach(k => root.style.removeProperty(k));
  Object.entries(dark ? CLASSIC_DARK : t.vars).forEach(([k,v]) => root.style.setProperty(k,v));
  const ground = dark ? hills('#2A2147','#352A5A') : t.ground;
  $('#scene').innerHTML =
    (t.sun ? `<div class="sun">${SUN}</div>` : '') +
    (t.moon ? `<div class="moon"></div>` : '') +
    (t.lights ? `<div class="lights">${lightsSvg()}</div>` : '') +

  const meta = document.querySelector('meta[name=theme-color]') || Object.assign(document.head.appendChild(document.createElement('meta')),{name:'theme-color'});

}

function burst(){
  const t = TH(); let svgs;
  switch(t.fx){
    case 'leaves': svgs = ['#D2542A','#F4A93A','#E8C547'].map(LEAF); break;
    case 'snow': svgs = [FLAKE, SPARK('#FFD166'), SPARK('#FFFFFF')]; break;
    case 'petals': svgs = ['#FF9EC4','#FFD25A','#B98CFF'].map(PETAL); break;
    case 'bats': svgs = [SPARK('#FFC23D'), SPARK('#FF8A1F'), SPARK('#C9A6FF')]; break;
    case 'bubbles': svgs = [SPARK('#FFC93C'), SPARK('#FF6B35'), BUBBLE]; break;
    default: svgs = [SPARK('#FFB31F'), SPARK('#7B4DE0'), BEE];
  }
  for (let i=0;i<34;i++){
    const a = Math.random()*Math.PI*2, r = rnd(140, Math.min(innerWidth, 700)*.62);
    const el = document.createElement('div');
    el.className = 'burst';
    el.style.cssText = `--s:${rnd(18,34).toFixed(0)}px;--tx:${(Math.cos(a)*r).toFixed(0)}px;--ty:${(Math.sin(a)*r*.8).toFixed(0)}px;--r:${rnd(-260,260).toFixed(0)}deg;animation-delay:${rnd(0,.12).toFixed(2)}s`;
    el.innerHTML = pick(svgs);
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 1800);
  }
}


/* ---------- sound + speech ---------- */
let ac = null;
function tone(fr, t0, dur, type='sine', vol=.14){
  if (!S.set.sound) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + t0;
    o.type = type; o.frequency.value = fr;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.02); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+.05);
  }catch(e){}
}
const sfxGood = () => { tone(784,0,.18); tone(1047,.11,.3); };
const sfxBad = () => { tone(311,0,.22,'triangle',.16); tone(233,.14,.32,'triangle',.16); };
const sfxDone = () => { [523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.35)); };
const sfxKey = () => tone(1400,0,.04,'sine',.04);

const HAS_TTS = 'speechSynthesis' in window;
const NOVELTY = /albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|junior|ralph|fred|kathy|grandma|grandpa|rocko|shelley|eddy|flo|reed|sandy/i;
let voices = [];
function loadVoices(){
  if (!HAS_TTS) return;
  voices = (speechSynthesis.getVoices()||[]).filter(v => /^en[-_]/i.test(v.lang) || v.lang==='en');
  if (view==='parent') fillVoiceSelect();
}
if (HAS_TTS){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; setTimeout(loadVoices, 600); }
function voiceRank(v){
  let r = 10;
  if (/premium/i.test(v.name)) r = 0; else if (/enhanced/i.test(v.name)) r = 1;
  else if (/samantha|ava|allison|susan|zoe|nicky|evan|nathan|joelle/i.test(v.name)) r = 3;
  if (NOVELTY.test(v.name)) r += 50;
  if (!/en[-_]US/i.test(v.lang)) r += 4;
  return r;
}
function bestVoice(){
  if (S.set.voice){ const v = voices.find(x => x.voiceURI === S.set.voice); if (v) return v; }
  return voices.slice().sort((a,b)=>voiceRank(a)-voiceRank(b))[0] || null;
}
let lastUtt = null, speakTimer = null;
function say(parts, rateMul=1){
  if (!HAS_TTS) return;
  try{
    speechSynthesis.cancel();
    const v = bestVoice();
    parts.filter(Boolean).forEach((txt, i, arr) => {
      const u = new SpeechSynthesisUtterance(txt);
      if (v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
      u.rate = Math.max(.4, Math.min(1.3, S.set.rate * rateMul)); u.pitch = 1;
      if (i === 0) u.onstart = () => setTalking(true);
      if (i === arr.length-1){ u.onend = () => setTalking(false); u.onerror = () => setTalking(false); }
      lastUtt = u;
      speechSynthesis.speak(u);
    });
    clearTimeout(speakTimer); speakTimer = setTimeout(()=>setTalking(false), 9000);
  }catch(e){}
}
function setTalking(on){ const b = $('#speakBtn'); if (b) b.classList.toggle('talking', on); }
function praise(){ return pick(TH().praise).replace(/!$/,''); }

/* ---------- today's log + active-time tracking ---------- */
function today(){ const k = dayKey(); return S.days[k] || (S.days[k] = {sec:0, finished:[], goalHit:0}); }
let lastAct = Date.now(), pausedShown = false;
const IDLE = 180;   // seconds without a touch/scroll before reading time pauses
['pointerdown','keydown','wheel','touchmove'].forEach(t => document.addEventListener(t, () => { lastAct = Date.now(); if (pausedShown) hidePaused(); }, {capture:true, passive:true}));
const TICK = 5;
setInterval(() => {
  if (document.hidden) return;
  const reading = view === 'reader' || view === 'quiz';

  if (!talking && Date.now() - lastAct > IDLE*1000){ if (!pausedShown && view === 'reader') showPaused(); return; }
  const d = today(); d.sec += TICK;

  save();
  const g = +S.set.goal || 0;
  if (g && d.goalHit !== g && d.sec >= g*60){ d.goalHit = g; save(); goalReached(); }

/* ---------- reports + performance ---------- */
function finishedList(days=7){
  const cut = Date.now() - days*864e5;
  return Object.entries(S.reads).filter(([id,r]) => r.done && r.doneAt >= cut && byId(id)).sort((a,b) => b[1].doneAt - a[1].doneAt).map(([id,r]) => ({id, it:byId(id), r}));
}
function perf(days){
  const list = finishedList(days).filter(x => x.r.quiz);
  const w = list.map(x => wpm(Object.assign({words:x.it.words}, x.r))).filter(Boolean);
  const q = list.map(x => x.r.quiz.score / x.r.quiz.total);
  const avg = a => a.length ? a.reduce((s,v)=>s+v,0)/a.length : null;
  return {n:list.length, wpm: avg(w) ? Math.round(avg(w)) : null, quiz: avg(q) !== null ? Math.round(avg(q)*100) : null};
}
function skimmed(it, r){ const s = wpm(Object.assign({words:it.words}, r)); return s && s > 320 && r.quiz && r.quiz.score/r.quiz.total < .67; }
function reportText(){
  const d = today(), name = S.set.name || 'Reader', g = +S.set.goal || 0;
  const L = [`📚 ${name} — MORE TIME Reading, ${fmtDay(new Date())}`, `Read ${mins(d.sec)} min${g ? (d.sec >= g*60 ? ` ✅ (goal ${g} min)` : ` (goal ${g} min)`) : ''}`];
  const todays = finishedList(1).filter(x => dayKey(new Date(x.r.doneAt)) === dayKey());
  if (todays.length){
    L.push('', 'Finished today:');
    todays.forEach(({it,r}) => {
      const s = wpm(Object.assign({words:it.words}, r));
      L.push(`• ${it.short} — ${mins(r.sec) || '<1'} min${s ? `, ~${s} words/min` : ''}${r.quiz ? `, quiz ${r.quiz.score}/${r.quiz.total}` : ''}${skimmed(it,r) ? ' ⚠️ fast + low quiz, may have skimmed' : ''}`);
    });
  }
  const inProg = Object.entries(S.reads).filter(([id,r]) => !r.done && r.pos > .05 && byId(id)).sort((a,b) => (b[1].last||0) - (a[1].last||0))[0];
  if (inProg) L.push(`Still reading: ${byId(inProg[0]).short} (${Math.round(inProg[1].pos*100)}%)`);
  const taps = todays.flatMap(x => x.r.taps || []).concat(inProg ? (inProg[1].taps||[]) : []);
  if (taps.length) L.push(`Words tapped to hear: ${[...new Set(taps)].slice(0,12).join(', ')}`);
  const p = perf(7);
  if (p.n) L.push('', `This week: ${p.n} finished · avg ${p.wpm ? `~${p.wpm} words/min` : '—'} · quiz ${p.quiz}%`);
  return L.join('\n');
}
async function share(text){

      </div>
      ${c.picked !== null ? `<button class="btn good" data-act="nextQ">${c.i < c.qs.length-1 ? 'Next question' : 'See my score'}${IC.right}</button>` : `<button class="btn ghost sm" data-act="sayQ">${IC.listen}Read the question</button>`}
    </div></div>`;
}
function pickOpt(k){
  const c = cur; if (c.picked !== null) return;
  c.picked = k; const ok = c.qs[c.i].o[k].ok; c.marks.push(ok); if (ok) c.score++;
  if (ok) sfxGood(); else sfxBad();
  render();
  say([ok ? `${praise()}!` : `Not quite. The answer is: ${c.qs[c.i].o.find(o => o.ok).t}`]);
}
function nextQ(){
  const c = cur;
  if (c.i < c.qs.length-1){ c.i++; c.picked = null; render(); say([c.qs[c.i].q]); return; }
  const r = R(c.id), it = byId(c.id);
  const first = !r.done;
  if (!r.quiz) r.quiz = {score:c.score, total:c.qs.length, at:Date.now()};
  r.tries = (r.tries||0) + 1;
  if (first){ r.done = true; r.doneAt = Date.now(); r.pos = 1; today().finished.push(c.id); }
  save();
  go('qdone', Object.assign(c, {first}));
  sfxDone(); setTimeout(burst, 150);
  say([c.score === c.qs.length ? `Perfect! ${praise()}!` : `${praise()}! You got ${c.score} out of ${c.qs.length}.`]);
}
function vQdone(){
  const c = cur, it = byId(c.id), r = R(c.id), s = wpm(Object.assign({words:it.words}, r));
  const nx = nextUp();
  return `<div class="screen"><div class="center">
    <div class="bigem">${c.score === c.qs.length ? '🏆' : c.score >= c.qs.length-1 ? '🌟' : '📖'}</div>
    <h1>${c.score === c.qs.length ? 'Perfect score!' : esc(praise()) + '!'}</h1>
    <p class="sub">You finished <b>${esc(it.t)}</b>.</p>
    <div class="statrow"><div class="stat"><b>${c.score}/${c.qs.length}</b><small>quiz</small></div><div class="stat"><b>${mins(r.sec) || '<1'}</b><small>minutes</small></div>${s ? `<div class="stat"><b>${s}</b><small>words / min</small></div>` : ''}</div>
    <div class="done-row"><button class="btn ghost" data-act="home">${IC.home}Library</button>${nx ? `<button class="btn good" data-act="open" data-id="${nx.id}">Next story${IC.right}</button>` : ''}</div>
  </div></div>`;
}
function vGoal(){
  const d = today();
  return `<div class="screen"><div class="center">
    <div class="bigem">🏆</div>
    <h1>Time's up!<br>${esc(praise())}!</h1>
    <p class="sub">You read <b>${mins(d.sec)} minutes</b> today${d.finished.length ? ` and finished <b>${d.finished.length}</b> ${d.finished.length===1?'story':'stories'}` : ''}.</p>
    <div class="done-row"><button class="btn honey" data-act="send">📤 Send to Parents</button><button class="btn ghost" data-act="keepReading">Keep reading</button></div>
  </div></div>`;
}

/* ----- PIN + parent ----- */
let pinBuf = '';
function vPin(){
  return `<div class="screen"><div class="topbar"><button class="iconbtn" data-act="home" aria-label="Back">${IC.back}</button><div class="title">Parents</div></div>
    <div class="pin"><h2>Parent code</h2><div class="pdots" id="dots">${[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?'on':''}"></i>`).join('')}</div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="pin" data-k="${n}">${n}</button>`).join('')}<button class="blank" aria-hidden="true"></button><button data-act="pin" data-k="0">0</button><button data-act="pinDel" aria-label="Delete">${IC.bksp}</button></div></div></div>`;
}
function pinPress(k){
  if (pinBuf.length >= 4) return;
  pinBuf += k; document.querySelectorAll('#dots i').forEach((el,i)=>el.classList.toggle('on', i < pinBuf.length));
  if (pinBuf.length === 4) setTimeout(() => {
    if (pinBuf === PIN){ pinBuf = ''; go('parent'); }
    else { pinBuf = ''; const d = $('#dots'); d.classList.add('shake'); setTimeout(()=>{ d.classList.remove('shake'); d.querySelectorAll('i').forEach(i=>i.classList.remove('on')); }, 380); }
  }, 120);
}
function vParent(){
  const d = today(), g = +S.set.goal || 0;
  const wk = perf(7), prev = (() => { const a = perf(14), b = perf(7); if (!a.n || a.n === b.n) return null; return a; })();
  const days = Array.from({length:7}, (_,i) => { const dt = new Date(); dt.setDate(dt.getDate() - (6-i)); const x = S.days[dayKey(dt)]; return `<span>${mins(x ? x.sec : 0)}<small>${dt.toLocaleDateString('en-US',{weekday:'short'})}${x && g && x.sec >= g*60 ? ' ✅' : ''}</small></span>`; }).join('');
  const rows = finishedList(30).slice(0, 25).map(({it,r}) => {
    const s = wpm(Object.assign({words:it.words}, r));
    return `<tr><td>${fmtDay(new Date(r.doneAt))}</td><td>${esc(it.short)}${skimmed(it,r) ? '<span class="flag">may have skimmed</span>' : ''}${r.taps && r.taps.length ? `<div class="tw">tapped: ${esc(r.taps.slice(0,6).join(', '))}</div>` : ''}</td><td class="n">${mins(r.sec) || '<1'}m</td><td class="n">${s || '—'}</td><td class="n">${r.quiz ? r.quiz.score + '/' + r.quiz.total : '—'}</td></tr>`;
  }).join('');
  const tapCounts = {}; Object.values(S.reads).forEach(r => (r.taps||[]).forEach(w => tapCounts[w] = (tapCounts[w]||0) + 1));
  const topTaps = Object.entries(tapCounts).sort((a,b) => b[1]-a[1]).slice(0, 18);
  const themeOpts = THEME_ORDER.map(k => `<option value="${k}" ${S.set.theme===k?'selected':''}>${k==='auto' ? 'Auto by season' : THEMES[k].label}</option>`).join('');
  return `<div class="screen parent"><div class="topbar"><button class="iconbtn" data-act="home" aria-label="Back">${IC.back}</button><div class="title">Parent setup</div></div>
    <div class="scroll">
      <div class="card"><h3>Reader</h3>
        <label for="kname" style="margin-top:4px">Name (home screen and reports)</label>
        <input id="kname" type="text" maxlength="16" autocomplete="off" value="${esc(S.set.name)}">
        <label>Reading level</label>
        <div class="seg">${Object.entries(LEVELS).map(([k,v]) => `<button class="${S.set.level===k?'on':''}" data-act="level" data-v="${k}">${v.label}<small>${v.note}</small></button>`).join('')}</div>
        <p class="hint" style="margin-top:10px">Today's library fits about grades 3–6. Lower levels hide Alice and turn on read-aloud help, which is how a younger child can use it until easier books are added.</p>
      </div>
      <div class="card"><h3>Reading time</h3>
        <p class="hint">Only time in a story or quiz counts. It pauses after 3 minutes with no scrolling or tapping, or when the app is closed. When the goal is reached, a "Time's up!" screen pops up with <b>Send to Parents</b>.</p>
        <div class="seg">${[0,15,30].map(v => `<button class="${g===v?'on':''}" data-act="goal" data-v="${v}">${v ? v + ' min' : 'Off'}</button>`).join('')}</div>
        <p class="hint" style="margin-top:12px">Today: <b>${mins(d.sec)} min</b>${d.finished.length ? ` · ${d.finished.length} finished` : ''}</p>
        <div class="days">${days}</div>
        <div class="btns"><button class="btn honey sm" data-act="send">📤 Send today's report</button><button class="btn ghost sm" data-act="copyReport">Copy report</button></div>
      </div>
      <div class="card"><h3>How it's going</h3>
        <p class="hint">Measured quietly in the background. The reader never sees a timer or a speed number while reading.</p>
        <div class="kpis">
          <div class="kpi"><b>${wk.n}</b><small>finished this week</small></div>
          <div class="kpi"><b>${wk.wpm ? '~' + wk.wpm : '—'}</b><small>words / minute</small></div>
          <div class="kpi"><b>${wk.quiz !== null ? wk.quiz + '%' : '—'}</b><small>quiz score</small></div>
        </div>
        <p class="hint"><b>How to read this:</b> most 4th graders read silently around 120–150 words a minute (younger kids less). Watch the trend over weeks, not one day. Getting all or all-but-one quiz questions right means it was understood. A "may have skimmed" flag means very fast reading with missed questions. Tapped words show vocabulary that was unfamiliar.</p>
        ${rows ? `<table class="tbl"><thead><tr><th>Day</th><th>Read</th><th>Time</th><th>WPM</th><th>Quiz</th></tr></thead><tbody>${rows}</tbody></table>` : '<p class="hint">Nothing finished yet.</p>'}
        ${topTaps.length ? `<label>Words tapped most</label><div class="chips">${topTaps.map(([w,n]) => `<span class="chip">${esc(w)}${n>1?`<b>×${n}</b>`:''}</span>`).join('')}</div>` : ''}
      </div>
      <div class="card"><h3>Voice &amp; look</h3>
        <label for="voice">Read-aloud voice</label><select id="voice"></select>
        <label for="rate">Speed</label><input id="rate" type="range" min="0.6" max="1.15" step="0.05" value="${S.set.rate}">
        <div class="switch"><span>Sound effects</span><input id="sound" type="checkbox" ${S.set.sound?'checked':''}></div>
        <label for="theme">Theme</label><select id="theme">${themeOpts}</select>
        <p class="hint" style="margin-top:8px">Better voices: Settings → Accessibility → Spoken Content → Voices → English, download an Enhanced voice.</p>
      </div>
      <div class="card"><h3>Reset</h3><p class="hint">Clears all reading progress and history on this iPad.</p><button class="btn ghost sm" data-act="reset">Reset progress</button></div>
      <div style="height:20px"></div>
    </div></div>`;
}
function fillVoiceSelect(){
  const sel = $('#voice'); if (!sel) return;
  const list = voices.filter(v => !NOVELTY.test(v.name)).sort((a,b) => voiceRank(a)-voiceRank(b) || a.name.localeCompare(b.name));
  sel.innerHTML = `<option value="">Auto (best available)</option>` + list.map(v => `<option value="${esc(v.voiceURI)}" ${S.set.voice===v.voiceURI?'selected':''}>${esc(v.name)} — ${esc(v.lang)}</option>`).join('');
}
function bindParent(){
  fillVoiceSelect();
  $('#voice').addEventListener('change', e => { S.set.voice = e.target.value; save(); });
  $('#rate').addEventListener('input', e => { S.set.rate = +e.target.value; save(); });
  $('#sound').addEventListener('change', e => { S.set.sound = e.target.checked; save(); });
  $('#theme').addEventListener('change', e => { S.set.theme = e.target.value; save(); applyTheme(true); });
  $('#kname').addEventListener('input', e => { S.set.name = e.target.value.trim(); save(); });
}

/* ---------- events ---------- */
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  switch(a){
    case 'home': go('home'); break;
    case 'open': openRead(b.dataset.id); break;
    case 'size': S.set.size = Math.max(.8, Math.min(1.6, +(S.set.size + (+b.dataset.d)*.1).toFixed(2))); save(); { const t = $('#txt'); if (t) t.style.setProperty('--fs', S.set.size); } break;
    case 'listen': if (cur.listening) stopListen(); else startListen(firstVisiblePara()); break;
    case 'quiz': startQuiz(); break;
    case 'backRead': go('reader', {id:cur.id}); break;
    case 'pickOpt': pickOpt(+b.dataset.k); break;
    case 'nextQ': nextQ(); break;
    case 'sayQ': say([cur.qs[cur.i].q, ...cur.qs[cur.i].o.map((o,k) => `${'ABC'[k]}. ${o.t}`)]); break;
    case 'send': share(reportText()); break;
    case 'copyReport': navigator.clipboard?.writeText(reportText()).then(()=>toast('Report copied'), ()=>toast("Couldn't copy")); break;
    case 'keepReading': { const bk = cur._back; if (bk && bk.view !== 'goal'){ view = bk.view; cur = bk.cur; render(); } else go('home'); } break;
    case 'parent': pinBuf = ''; go('pin'); break;
    case 'pin': pinPress(b.dataset.k); break;
    case 'pinDel': pinBuf = pinBuf.slice(0,-1); document.querySelectorAll('#dots i').forEach((el,i)=>el.classList.toggle('on', i < pinBuf.length)); break;
    case 'goal': S.set.goal = +b.dataset.v; save(); render(); break;
    case 'level': S.set.level = b.dataset.v; save(); render(); break;
    case 'reset': if (confirm('Clear all reading progress and history on this iPad?')){ S.reads = {}; S.days = {}; save(); render(); toast('Progress cleared'); } break;
  }
});
document.addEventListener('click', e => { if (e.target.closest('#paused')) hidePaused(); });
document.addEventListener('keydown', e => {
  if (view === 'pin'){ if (/^[0-9]$/.test(e.key)) pinPress(e.key); else if (e.key === 'Backspace'){ pinBuf = pinBuf.slice(0,-1); render(); } }
});
document.addEventListener('visibilitychange', () => { if (document.hidden){ stopListen(); } else { appliedTheme = null; applyTheme(); lastAct = Date.now(); } });
render();
</script>
</body>
</html>
