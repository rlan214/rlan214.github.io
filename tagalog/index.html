<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9E4FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tagalog">
<link rel="apple-touch-icon" href="icon.png">
<title>Sakay! Tagalog Adventure</title>
<style>
  :root{
    --sky-top:#E9E4FA;
    --sky-bottom:#FFF7F9;
    --ink:#3D3866;
    --muted:#6F6990;
    --card:#FFFFFF;
    --line:#E6E1F5;
    --blue:#7FA8E6;
    --blue-d:#4F78BD;
    --lav:#B7A8E6;
    --pink:#F2A7BF;
    --butter:#F7D58A;
    --mint:#8FD3B6;
    --mint-d:#3E9272;
    --peach:#F8B992;
    --coral:#EF8A8A;
    --coral-d:#C9514F;
    --shadow:0 8px 24px rgba(92,80,150,.14);
    --shadow-sm:0 3px 10px rgba(92,80,150,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--sky-bottom);
    background-image:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 100%);
    background-repeat:no-repeat;
    background-size:100% 560px;
    color:var(--ink);
    font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  button{font-family:inherit;}
  :focus-visible{outline:3px solid var(--blue-d);outline-offset:3px;}
  .app{max-width:720px;margin:0 auto;min-height:100vh;padding:0 20px;}
  .hidden{display:none !important;}

  /* ---------- home ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:max(16px,env(safe-area-inset-top)) 0 10px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px;letter-spacing:.2px;}
  .brand svg{width:38px;height:38px;}
  .stats{display:flex;gap:10px;}
  .pill{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:7px 14px;font-weight:900;font-size:16px;box-shadow:var(--shadow-sm);}
  .hero{margin-top:6px;border-radius:28px;overflow:hidden;box-shadow:var(--shadow);line-height:0;}
  .hero img{width:100%;display:block;}
  .intro{padding:20px 2px 4px;}
  .intro h1{margin:0 0 4px;font-size:30px;font-weight:900;letter-spacing:-.2px;}
  .intro p{margin:0 0 14px;color:var(--muted);font-size:16px;font-weight:700;}
  .meter{height:12px;background:#E3DEF3;border-radius:999px;overflow:hidden;}
  .meter-fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--lav));border-radius:999px;transition:width .4s ease;}
  .meter-label{margin-top:8px;font-size:14px;font-weight:800;color:var(--muted);}

  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin:18px 0 8px;}
  .tile{
    position:relative;border:0;text-align:left;border-radius:26px;padding:18px;min-height:168px;
    display:flex;flex-direction:column;justify-content:flex-end;gap:4px;
    font-size:16px;color:var(--ink);cursor:pointer;box-shadow:var(--shadow-sm);
    transition:transform .12s ease;
  }
  .tile:active{transform:scale(.97);}
  .tile-emoji{position:absolute;top:16px;left:16px;width:68px;height:68px;border-radius:22px;background:rgba(255,255,255,.78);display:grid;place-items:center;font-size:38px;}
  .tile-title{font-size:21px;font-weight:900;}
  .tile-sub{font-size:14px;font-weight:700;color:var(--muted);}
  .tile-badge{position:absolute;top:16px;right:14px;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:900;color:#fff;background:var(--blue-d);}
  .tile-badge.done{background:var(--mint-d);}
  .tile-badge.lock{background:transparent;color:var(--muted);font-size:20px;padding:0;}
  .tint-butter{background:#FFF0C9;} .tint-pink{background:#FFE0EA;} .tint-blue{background:#DCE9FB;}
  .tint-mint{background:#D9F2E7;} .tint-peach{background:#FFE5D4;} .tint-lav{background:#E7E1FA;}
  .tile.current{box-shadow:0 0 0 4px var(--pink),var(--shadow-sm);}
  .tile.locked{opacity:.55;filter:saturate(.4);cursor:default;}
  .tile.locked:active{transform:none;}
  .daily{width:100%;border:0;border-radius:26px;padding:18px 20px;margin-top:18px;display:flex;align-items:center;gap:16px;text-align:left;cursor:pointer;color:#fff;background:linear-gradient(135deg,#8C7FD9,#5F8DDB);box-shadow:var(--shadow);font-size:16px;}
  .daily:active{transform:scale(.98);}
  .daily-emoji{width:60px;height:60px;border-radius:20px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:34px;flex-shrink:0;}
  .daily-text{flex:1;display:flex;flex-direction:column;gap:2px;}
  .daily-title{font-size:21px;font-weight:900;}
  .daily-sub{font-size:14px;font-weight:700;opacity:.92;}
  .daily-go{background:#fff;color:var(--blue-d);border-radius:999px;padding:8px 16px;font-weight:900;font-size:14px;}
  .daily.done{background:linear-gradient(135deg,#6FBF9F,#3E9272);}

  .reset-link{display:block;margin:22px auto 28px;font-size:13px;color:#9690B3;font-weight:700;background:none;border:none;cursor:pointer;text-decoration:underline;}

  /* ---------- lesson ---------- */
  .lesson-screen{display:none;flex-direction:column;min-height:100vh;}
  .lesson-screen.active{display:flex;}
  .lesson-top{display:flex;align-items:center;gap:12px;padding:max(14px,env(safe-area-inset-top)) 0 8px;}
  .exit-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow-sm);font-size:20px;color:var(--ink);cursor:pointer;flex-shrink:0;}
  .progress-track{flex:1;height:14px;background:#E3DEF3;border-radius:999px;overflow:hidden;}
  .progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--mint-d));border-radius:999px;transition:width .3s ease;}
  .hearts{display:flex;gap:2px;font-size:20px;min-width:64px;justify-content:flex-end;}
  .lesson-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:6px 0 22px;}
  .eyebrow{text-align:center;font-size:14px;font-weight:900;color:var(--blue-d);text-transform:uppercase;letter-spacing:.09em;}
  .stage{background:var(--card);border-radius:28px;padding:26px 18px 24px;text-align:center;box-shadow:var(--shadow);}
  .stage-emoji{font-size:84px;line-height:1;margin-bottom:10px;}
  .stage-word{display:flex;align-items:center;justify-content:center;gap:14px;font-size:clamp(36px,9vw,54px);font-weight:900;line-height:1.1;}
  .stage-phon{display:inline-block;margin-top:12px;background:#EEF3FC;color:#3F66A8;padding:6px 16px;border-radius:999px;font-size:17px;font-weight:800;}
  .speak-btn{width:50px;height:50px;border-radius:50%;border:0;background:var(--blue-d);color:#fff;font-size:21px;cursor:pointer;flex-shrink:0;box-shadow:0 4px 10px rgba(79,120,189,.35);display:grid;place-items:center;}
  .speak-btn:active{transform:scale(.93);}

  .options{display:grid;grid-template-columns:1fr;gap:12px;}
  @media (min-width:600px){.options{grid-template-columns:1fr 1fr;}}
  .option{
    min-height:70px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 16px;
    font-size:20px;font-weight:800;color:var(--ink);text-align:left;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--shadow-sm);
    transition:transform .08s ease;
  }
  .option:active{transform:scale(.98);}
  .opt-text{display:flex;flex-direction:column;gap:2px;}
  .opt-phon{font-size:14px;font-weight:800;color:#3F66A8;}
  .opt-speak{width:42px;height:42px;border-radius:50%;background:#EEF3FC;display:grid;place-items:center;font-size:18px;flex-shrink:0;}
  .option.selected{border-color:var(--blue-d);background:#F1F6FF;box-shadow:0 0 0 3px rgba(79,120,189,.22);}
  .option.correct{border-color:var(--mint-d);background:#E9F8F1;box-shadow:0 0 0 3px rgba(62,146,114,.22);}
  .option.incorrect{border-color:var(--coral-d);background:#FDECEC;box-shadow:0 0 0 3px rgba(201,81,79,.2);}
  .option:disabled{cursor:default;}

  .footer-bar{
    position:sticky;bottom:0;margin:0 -20px;padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-radius:26px 26px 0 0;box-shadow:0 -6px 20px rgba(92,80,150,.12);
    display:flex;align-items:center;justify-content:flex-end;gap:14px;
  }
  .footer-bar.feedback-correct{background:#DDF4E9;}
  .footer-bar.feedback-wrong{background:#FDE5E5;}
  .feedback-msg{flex:1;font-size:18px;font-weight:900;line-height:1.25;}
  .feedback-msg.correct-text{color:#2B7157;}
  .feedback-msg.wrong-text{color:var(--coral-d);}
  .feedback-sub{display:block;font-size:15px;font-weight:700;color:var(--muted);}
  .btn{border:0;border-radius:18px;padding:16px 28px;min-width:140px;font-size:17px;font-weight:900;letter-spacing:.05em;cursor:pointer;color:#fff;}
  .btn:active{transform:scale(.97);}
  .btn-check{background:var(--blue-d);box-shadow:0 6px 14px rgba(79,120,189,.3);}
  .btn-check:disabled{background:#E3DEF3;color:#A39DBF;box-shadow:none;cursor:default;}
  .btn-continue{background:var(--mint-d);box-shadow:0 6px 14px rgba(62,146,114,.3);}
  .btn-retry{background:var(--coral-d);box-shadow:0 6px 14px rgba(201,81,79,.3);}

  /* ---------- result ---------- */
  .result-screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;gap:6px;}
  .result-screen.active{display:flex;}
  .result-icon{font-size:88px;line-height:1;}
  .result-title{font-size:30px;font-weight:900;margin:6px 0 0;}
  .result-sub{color:var(--muted);font-weight:700;font-size:17px;margin-bottom:18px;}
  .result-stats{display:flex;gap:14px;margin-bottom:26px;}
  .result-stat{background:var(--card);border-radius:22px;padding:16px 24px;min-width:110px;box-shadow:var(--shadow-sm);font-weight:800;color:var(--muted);}
  .result-stat b{display:block;font-size:26px;color:var(--ink);}


  .tint-sage{background:#E4F1D6;}
  .snackbtn{width:100%;border:0;border-radius:26px;padding:14px 18px;margin-top:12px;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;background:#FFE5D4;color:var(--ink);box-shadow:var(--shadow-sm);font-size:16px;}
  .snackbtn:active{transform:scale(.98);}
  .snack-emoji{width:52px;height:52px;border-radius:18px;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:30px;flex-shrink:0;}
  .snack-sub{font-size:14px;font-weight:700;color:var(--muted);}
  .snack-go{background:#fff;color:#C0714A;border-radius:999px;padding:8px 16px;font-weight:900;font-size:14px;}
  .sticker-hint{color:var(--muted);font-weight:700;font-size:15px;margin:6px 2px 0;}
  .sticker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin:16px 0 30px;}
  .sticker,.new-sticker{border:0;border-radius:22px;background:#fff;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:var(--shadow-sm);font-weight:900;font-size:16px;color:var(--ink);cursor:pointer;}
  .sticker:active,.new-sticker:active{transform:scale(.96);}
  .s-emoji{font-size:48px;line-height:1.1;}
  .sticker small,.new-sticker small{font-weight:700;color:var(--muted);font-size:12px;text-align:center;}
  .sticker.locked{opacity:.5;filter:grayscale(1);cursor:default;}
  .new-stickers{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:20px;}
  .new-sticker{min-width:140px;animation:pop .5s ease;}
  @keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  .options.one{grid-template-columns:1fr;}
  .speak-btn.slow{background:var(--mint-d);box-shadow:0 4px 10px rgba(62,146,114,.35);}
  .listen-pair{display:flex;gap:16px;align-items:center;}
  .speak-btn.big{width:96px;height:96px;font-size:42px;}
  .listen-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0;}
  .listen-hint{color:var(--muted);font-weight:800;font-size:15px;}
  .type-input{width:100%;font:inherit;font-size:30px;font-weight:800;text-align:center;padding:16px;border-radius:20px;border:2px solid var(--line);background:#fff;color:var(--ink);box-shadow:var(--shadow-sm);}
  .slot-wrap{position:relative;width:100%;cursor:text;}
  .slots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:6px 4px;}
  .slot{width:44px;height:58px;border-bottom:5px solid #B9C3DC;border-radius:4px 4px 0 0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:var(--ink);text-transform:uppercase;background:#F4F7FD;}
  .slot.active{border-bottom-color:var(--blue-d);background:#EAF1FF;}
  .slot.hinted{color:var(--blue-d);}
  .slot.filled{border-bottom-color:var(--blue-d);}
  .slot-wrap .type-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;padding:0;border:0;box-shadow:none;cursor:text;}
  .slots.correct .slot{border-bottom-color:var(--mint-d);background:#E9F8F1;}
  .slots.incorrect .slot{border-bottom-color:var(--coral-d);background:#FDECEC;}
  .slot-tip{text-align:center;color:var(--ink-soft,#6b7390);font-weight:800;font-size:14px;margin-top:2px;}
  .type-input:focus{outline:none;border-color:var(--blue-d);box-shadow:0 0 0 3px rgba(79,120,189,.22);}
  .type-input.correct{border-color:var(--mint-d);background:#E9F8F1;}
  .type-input.incorrect{border-color:var(--coral-d);background:#FDECEC;}
  .hint-btn{align-self:center;border:0;background:none;color:var(--blue-d);font-weight:900;font-size:15px;padding:8px 14px;cursor:pointer;}
  .answer-line{min-height:72px;border-radius:20px;background:#fff;border:2px dashed #CFC8EA;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .answer-line.correct{border:2px solid var(--mint-d);background:#E9F8F1;}
  .answer-line.incorrect{border:2px solid var(--coral-d);background:#FDECEC;}
  .bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
  .tile-word{border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 18px;font-size:21px;font-weight:800;color:var(--ink);box-shadow:var(--shadow-sm);cursor:pointer;}
  .tile-word.used{opacity:.25;}
  .answer-line .tile-word{background:#F1F6FF;border-color:var(--blue);}
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .match-col{display:flex;flex-direction:column;gap:12px;}
  .m-btn{min-height:68px;border:2px solid var(--line);background:#fff;border-radius:18px;padding:10px 12px;font-size:19px;font-weight:800;color:var(--ink);box-shadow:var(--shadow-sm);cursor:pointer;}
  .m-btn.sel{border-color:var(--blue-d);background:#F1F6FF;box-shadow:0 0 0 3px rgba(79,120,189,.22);}
  .m-btn.done{border-color:var(--mint-d);background:#E9F8F1;opacity:.75;}
  .m-btn.bad{border-color:var(--coral-d);background:#FDECEC;animation:shake .4s;}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .btn.btn-parent small{display:block;font-size:13px;font-weight:800;letter-spacing:.03em;text-transform:none;opacity:.85;margin-top:3px;}
  .btn.btn-parent{background:#fff;color:var(--blue-d);border:2px solid var(--blue);margin-bottom:12px;box-shadow:var(--shadow-sm);}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>

/* ============ HELPERS ============ */
const $ = (id) => document.getElementById(id);
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function dayStr(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function norm(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
}
function isPhrase(w){ return w.tag.trim().indexOf(" ") > -1; }
const ALL_WORDS = UNITS.flatMap(u=>u.words);
function wordByFile(f){ return ALL_WORDS.find(w=>w.file===f); }

/* ============ PROGRESS (saved in this browser) ============ */
const STORAGE_KEY = "tagalog-progress-v1";
function freshProgress(){
  return { completedUnits:{}, xp:0, streak:0, lastActiveDate:null, dailyDone:null,
           stickers:[], streakRewards:{}, missed:{}, dailyPlan:null };
}
let progress = freshProgress();
let session = null;

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) progress = Object.assign(freshProgress(), JSON.parse(raw));
  }catch(e){}
  const today = dayStr(new Date());
  const y = new Date(); y.setDate(y.getDate()-1);
  if(progress.lastActiveDate && progress.lastActiveDate !== today && progress.lastActiveDate !== dayStr(y)){
    progress.streak = 0;
  }
  renderHome();
}
function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
}
function markActiveToday(){
  const today = dayStr(new Date());
  if(progress.lastActiveDate !== today){
    const y = new Date(); y.setDate(y.getDate()-1);
    progress.streak = (progress.lastActiveDate === dayStr(y)) ? progress.streak + 1 : 1;
    progress.lastActiveDate = today;
  }
}
function noteMissed(w){ progress.missed[w.file] = (progress.missed[w.file]||0) + 1; saveProgress(); }
function noteCorrect(w){
  if(progress.missed[w.file]){ progress.missed[w.file]--; if(progress.missed[w.file] <= 0) delete progress.missed[w.file]; saveProgress(); }
}
function awardSticker(){
  const have = new Set(progress.stickers);
  const next = STICKERS.find(s=>!have.has(s.file));
  if(next) progress.stickers.push(next.file);
  return next || null;
}

let currentClip = null;
let tagalogVoice = null;
function pickVoice(){
  const voices = speechSynthesis.getVoices();
  tagalogVoice = voices.find(v=>v.lang==="fil-PH") || voices.find(v=>v.lang==="tl-PH") ||
                 voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("fil")) || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function stopAudio(){
  if(currentClip){ try{ currentClip.pause(); }catch(e){} }
  if("speechSynthesis" in window) speechSynthesis.cancel();
}
function speakFallback(text, lang, voice){
  if(!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; if(voice) u.voice = voice; u.rate = 0.85;
  speechSynthesis.speak(u);
}
function playClip(path, fallback){
  stopAudio();
  const clip = new Audio(path);
  currentClip = clip;
  clip.addEventListener("error", ()=>{ if(fallback) fallback(); }, {once:true});
  const p = clip.play();
  if(p && p.catch) p.catch(()=>{});
}
function sayTagalog(w){
  playClip("audio/"+w.file+".mp3", ()=>speakFallback(tagalogVoice ? w.tag : w.phon, tagalogVoice ? tagalogVoice.lang : "en-US", tagalogVoice));
}
function sayTagalogSlow(w){
  /* slow = the normal clip played at reduced speed, pitch kept (no extra audio files needed) */
  stopAudio();
  const clip = new Audio("audio/"+w.file+".mp3");
  currentClip = clip;
  clip.preservesPitch = true; clip.webkitPreservesPitch = true; clip.mozPreservesPitch = true;
  clip.defaultPlaybackRate = 0.65; clip.playbackRate = 0.65;
  clip.addEventListener("error", ()=>{
    if(!("speechSynthesis" in window)) return;
    const u = new SpeechSynthesisUtterance(tagalogVoice ? w.tag : w.phon);
    u.lang = tagalogVoice ? tagalogVoice.lang : "en-US"; if(tagalogVoice) u.voice = tagalogVoice; u.rate = 0.5;
    speechSynthesis.speak(u);
  }, {once:true});
  clip.addEventListener("loadedmetadata", ()=>{ clip.playbackRate = 0.65; });
  const p = clip.play();
  if(p && p.catch) p.catch(()=>{});
}
function sayEnglish(w){
  playClip("audio/en_"+w.file+".mp3", ()=>speakFallback(w.enSay || w.en, "en-US", null));
}

/* ============ QUESTIONS ============ */
function tooSimilar(a, b){
  const x = norm(a.tag), y = norm(b.tag);
  return x === y || (" "+y+" ").indexOf(" "+x+" ") > -1 || (" "+x+" ").indexOf(" "+y+" ") > -1 || norm(a.en) === norm(b.en);
}
function distractors(word, pool){
  const ok = pool.filter(w=>w.file!==word.file && !tooSimilar(w, word));
  const same = ok.filter(w=>isPhrase(w)===isPhrase(word));
  const base = same.length >= 3 ? same : ok;
  return shuffle(base).slice(0,3);
}
function mkQ(word, pool, type){
  const q = { type, word, pool };
  if(type==="tag2en" || type==="en2tag" || type==="listen"){
    q.options = shuffle([word, ...distractors(word, pool)]);
  }
  if(type==="build"){
    const toks = word.tag.split(" ");
    const bank = toks.slice();
    const others = pool.filter(w=>w.file!==word.file && isPhrase(w));
    if(others.length){
      const extra = shuffle(others).flatMap(w=>w.tag.split(" ")).filter(t=>!toks.some(x=>norm(x)===norm(t)));
      if(extra.length) bank.push(extra[Math.floor(Math.random()*extra.length)]);
    }
    q.tokens = shuffle(bank);
  }
  return q;
}
function variantType(t){
  return ({tag2en:"listen", listen:"tag2en", en2tag:"tag2en", type:"en2tag", build:"en2tag"})[t] || "tag2en";
}
function buildQuestions(unit){
  const pool = unit.words;
  const A = [], B = [];
  const keep = pool.length > 8 ? new Set(shuffle(pool).slice(0,6).map(w=>w.file)) : null; /* long lessons: 6 words get a 2nd question */
  shuffle(pool).forEach(w=>{
    A.push(mkQ(w, pool, Math.random()<0.5 ? "tag2en" : "listen"));
    const second = isPhrase(w) ? (Math.random()<0.65 ? "build" : "en2tag") : (Math.random()<0.5 ? "en2tag" : "type");
    B.push((!keep || keep.has(w.file)) ? mkQ(w, pool, second) : null);
  });
  const qs = [];
  A.forEach((q,k)=>{ qs.push(q); if(k>=2 && B[k-2]) qs.push(B[k-2]); });
  for(let k=Math.max(0,A.length-2); k<B.length; k++) if(B[k]) qs.push(B[k]);
  if(pool.length >= 4 && !isPhrase(pool[0])){
    qs.splice(Math.floor(qs.length/2), 0, { type:"match", words:shuffle(pool).slice(0,4), pool, word:pool[0] });
  }
  return qs;
}
function startLesson(i){
  session = { unitIdx:i, daily:false, title:UNITS[i].title, questions:buildQuestions(UNITS[i]),
              current:0, hearts:3, correct:0, selected:null, answered:false, requeued:new Set() };
  showScreen("lesson");
  renderQuestion();
}

/* Daily lesson: same 15 questions all day, includes words they've missed before */
function seededRand(seed){
  let a = seed >>> 0;
  return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function pickType(w, rand, avoid){
  let list = isPhrase(w) ? ["tag2en","en2tag","listen","build"] : ["tag2en","en2tag","listen","type"];
  const f = list.filter(t=>t!==avoid);
  return f[Math.floor(rand()*f.length)];
}
const DAILY_N = 15;
function getDailyPlan(pool){
  const today = dayStr(new Date());
  if(progress.dailyPlan && progress.dailyPlan.date === today && progress.dailyPlan.entries.length === DAILY_N){
    const ok = progress.dailyPlan.entries.every(e=>pool.some(w=>w.file===e.file) || wordByFile(e.file));
    if(ok) return progress.dailyPlan.entries;
  }
  let seed = 0; for(const c of today) seed = (seed*31 + c.charCodeAt(0)) | 0;
  const rand = seededRand(seed);
  const missed = Object.entries(progress.missed).filter(([f,c])=>c>0 && pool.some(w=>w.file===f))
    .sort((a,b)=>b[1]-a[1]).slice(0,4).map(([f])=>pool.find(w=>w.file===f));
  /* newest: words from the two most recently finished lessons */
  const doneIdx = UNITS.map((u,i)=>i).filter(i=>progress.completedUnits[i]);
  const newestUnits = doneIdx.slice(-2);
  const newestPool = newestUnits.flatMap(i=>UNITS[i].words).filter(w=>!missed.includes(w))
    .map(w=>[rand(),w]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]).slice(0,4);
  const taken = new Set([...missed, ...newestPool]);
  const rest = pool.filter(w=>!taken.has(w)).map(w=>[rand(),w]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  const picked = [...missed, ...newestPool, ...rest].slice(0,DAILY_N);
  const entries = picked.map(w=>({file:w.file, type:pickType(w, rand, null)}));
  for(let k=0; entries.length < DAILY_N; k++){
    const j = k % picked.length;
    entries.push({file:picked[j].file, type:pickType(picked[j], rand, entries[j].type)});
  }
  const mixed = entries.map(e=>[rand(),e]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  progress.dailyPlan = { date:today, entries:mixed };
  saveProgress();
  return mixed;
}
function startDaily(){
  const pool = UNITS.filter((u,i)=>seenUnit(i)).flatMap(u=>u.words);
  const entries = getDailyPlan(pool);
  const qs = entries.map(e=>mkQ(wordByFile(e.file), pool, e.type));
  session = { unitIdx:-1, daily:true, title:"Daily lesson", questions:qs,
              current:0, hearts:3, correct:0, selected:null, answered:false, requeued:new Set() };
  showScreen("lesson");
  renderQuestion();
}

function wordRow(text, btn, btn2){
  const row = document.createElement("div");
  row.className = "stage-word";
  const span = document.createElement("span"); span.textContent = text;
  row.appendChild(span);
  if(btn) row.appendChild(btn);
  if(btn2) row.appendChild(btn2);
  return row;
}
function emojiEl(e){ const d = document.createElement("div"); d.className = "stage-emoji"; d.textContent = e; return d; }

function renderQuestion(){
  const q = session.questions[session.current];
  $("progress-fill").style.width = (session.current/session.questions.length*100) + "%";
  renderHearts();
  session.selected = null; session.answered = false;
  const check = $("check-btn");
  check.disabled = true; check.textContent = "CHECK"; check.className = "btn btn-check"; check.onclick = handleCheck;
  $("feedback-msg").className = "feedback-msg hidden";
  $("footer-bar").className = "footer-bar";
  const stage = $("stage"), opts = $("options");
  stage.innerHTML = ""; stage.classList.remove("hidden");
  opts.innerHTML = ""; opts.className = "options";
  ({tag2en:rTag2En, en2tag:rEn2Tag, listen:rListen, type:rType, build:rBuild, match:rMatch})[q.type](q, stage, opts);
}
function fillChoices(q, opts, valueKey, showEmoji, showPhon){
  q.options.forEach(o=>{
    const value = o[valueKey];
    const btn = document.createElement("button");
    btn.className = "option"; btn.dataset.value = value;
    const text = document.createElement("span"); text.className = "opt-text";
    const main = document.createElement("span"); main.textContent = (showEmoji ? o.emoji + "  " : "") + value; text.appendChild(main);
    if(showPhon){ const ph = document.createElement("span"); ph.className = "opt-phon"; ph.textContent = o.phon; text.appendChild(ph); }
    btn.appendChild(text);
    if(showPhon){
      const sp = document.createElement("span");
      sp.className = "opt-speak"; sp.textContent = "🔊"; sp.setAttribute("role","button"); sp.setAttribute("aria-label","Hear "+o.tag);
      sp.addEventListener("click", (e)=>{ e.stopPropagation(); sayTagalog(o); });
      btn.appendChild(sp);
    }
    btn.addEventListener("click", ()=>selectOption(btn, value));
    opts.appendChild(btn);
  });
}
function rTag2En(q, stage, opts){
  const w = q.word;
  $("eyebrow").textContent = "What does this mean?";
  stage.appendChild(wordRow(w.tag, speakButton("Hear "+w.tag, ()=>sayTagalog(w)), slowButton(w)));
  const ph = document.createElement("div"); ph.className = "stage-phon"; ph.textContent = "Say it: " + w.phon;
  stage.appendChild(ph);
  fillChoices(q, opts, "en", false, false);
}
function rEn2Tag(q, stage, opts){
  const w = q.word;
  $("eyebrow").textContent = "How do you say this in Tagalog?";
  stage.appendChild(emojiEl(w.emoji));
  stage.appendChild(wordRow(w.en, speakButton("Hear "+w.en, ()=>sayEnglish(w))));
  fillChoices(q, opts, "tag", false, true);
}
function rListen(q, stage, opts){
  const w = q.word;
  $("eyebrow").textContent = "Listen and pick the meaning";
  const wrap = document.createElement("div"); wrap.className = "listen-wrap";
  const pair = document.createElement("div"); pair.className = "listen-pair";
  pair.appendChild(speakButton("Hear the word", ()=>sayTagalog(w), true));
  pair.appendChild(slowButton(w, true));
  wrap.appendChild(pair);
  const hint = document.createElement("div"); hint.className = "listen-hint"; hint.textContent = "Tap to listen again";
  wrap.appendChild(hint);
  stage.appendChild(wrap);
  fillChoices(q, opts, "en", true, false);
  setTimeout(()=>{ if(session && session.questions[session.current]===q) sayTagalog(w); }, 250);
}
function rType(q, stage, opts){
  const w = q.word;
  $("eyebrow").textContent = "Type it in Tagalog";
  stage.appendChild(emojiEl(w.emoji));
  stage.appendChild(wordRow(w.en, speakButton("Hear "+w.en, ()=>sayEnglish(w))));
  opts.className = "options one";
  const input = document.createElement("input");
  input.id = "type-input"; input.className = "type-input"; input.type = "text";
  input.setAttribute("autocapitalize","off"); input.setAttribute("autocorrect","off");
  input.setAttribute("autocomplete","off"); input.setAttribute("spellcheck","false");
  input.setAttribute("enterkeyhint","go"); input.setAttribute("aria-label","Type the Tagalog word");
  input.placeholder = "";
  const target = norm(w.tag).replace(/ /g,"");
  const wrap = document.createElement("div"); wrap.className = "slot-wrap";
  const slots = document.createElement("div"); slots.className = "slots"; slots.id = "type-slots";
  const slotEls = [];
  for(let k=0;k<target.length;k++){ const d = document.createElement("div"); d.className = "slot"; slots.appendChild(d); slotEls.push(d); }
  input.maxLength = target.length + 2;
  function drawSlots(){
    const typed = norm(input.value).replace(/ /g,"");
    const focused = document.activeElement === input;
    slotEls.forEach((d,k)=>{
      d.textContent = typed[k] || "";
      d.classList.toggle("filled", !!typed[k]);
      d.classList.toggle("active", focused && !session.answered && k === Math.min(typed.length, slotEls.length-1));
    });
  }
  input.addEventListener("focus", drawSlots); input.addEventListener("blur", drawSlots);
  input.addEventListener("input", ()=>{ drawSlots(); if(!session.answered) $("check-btn").disabled = !input.value.trim(); });
  input.addEventListener("keydown", (e)=>{ if(e.key==="Enter" && !$("check-btn").disabled){ e.preventDefault(); $("check-btn").click(); } });
  wrap.appendChild(slots); wrap.appendChild(input);
  wrap.addEventListener("click", ()=>input.focus());
  opts.appendChild(wrap);
  const tip = document.createElement("div"); tip.className = "slot-tip"; tip.textContent = target.length + " letters · tap the lines to type";
  opts.appendChild(tip);
  drawSlots();
  const letterBtn = document.createElement("button");
  letterBtn.className = "hint-btn"; letterBtn.textContent = "💡 Show me a letter";
  letterBtn.addEventListener("click", ()=>{
    if(session.answered) return;
    const typed = norm(input.value).replace(/ /g,"");
    let ok = 0; while(ok < typed.length && ok < target.length && typed[ok] === target[ok]) ok++;
    if(ok >= target.length) return;
    input.value = target.slice(0, ok + 1);
    drawSlots(); $("check-btn").disabled = false;
    slotEls[ok].classList.add("hinted");
    input.focus();
  });
  opts.appendChild(letterBtn);
  const hint = document.createElement("button");
  hint.className = "hint-btn"; hint.textContent = "🔊 Hear it in Tagalog (hint)";
  hint.addEventListener("click", ()=>sayTagalog(w));
  opts.appendChild(hint);
}
function rBuild(q, stage, opts){
  const w = q.word;
  $("eyebrow").textContent = "Build it in Tagalog";
  stage.appendChild(emojiEl(w.emoji));
  stage.appendChild(wordRow(w.en, speakButton("Hear "+w.en, ()=>sayEnglish(w))));
  opts.className = "options one";
  const line = document.createElement("div"); line.className = "answer-line"; line.id = "answer-line";
  const bank = document.createElement("div"); bank.className = "bank";
  const placed = []; session.placed = placed;
  const btns = q.tokens.map((t,i)=>{
    const b = document.createElement("button"); b.className = "tile-word"; b.textContent = t;
    b.addEventListener("click", ()=>{ if(session.answered) return; placed.push(i); redraw(); });
    bank.appendChild(b); return b;
  });
  function redraw(){
    line.innerHTML = "";
    placed.forEach(i=>{
      const b = document.createElement("button"); b.className = "tile-word"; b.textContent = q.tokens[i];
      b.addEventListener("click", ()=>{ if(session.answered) return; placed.splice(placed.indexOf(i),1); redraw(); });
      line.appendChild(b);
    });
    btns.forEach((b,i)=>{ const used = placed.includes(i); b.classList.toggle("used", used); b.disabled = used; });
    $("check-btn").disabled = placed.length === 0;
  }
  opts.appendChild(line); opts.appendChild(bank);
}
function rMatch(q, stage, opts){
  $("eyebrow").textContent = "Match the pairs";
  stage.classList.add("hidden");
  opts.className = "options one";
  const grid = document.createElement("div"); grid.className = "match-grid";
  const colL = document.createElement("div"), colR = document.createElement("div");
  colL.className = colR.className = "match-col";
  let sel = null, matched = 0, errors = 0;
  function finishMatch(failed){
    session.answered = true;
    if(!failed && errors === 0) session.correct++;
    const fb = $("feedback-msg"); fb.classList.remove("hidden");
    fb.className = "feedback-msg " + (failed ? "wrong-text" : "correct-text");
    fb.innerHTML = failed ? "Mali. 😅<span class=\"feedback-sub\">Out of hearts</span>"
                          : "Tama! 🎉<span class=\"feedback-sub\">"+(errors ? "You got them all matched" : "Perfect matching!")+"</span>";
    $("footer-bar").className = "footer-bar " + (failed ? "feedback-wrong" : "feedback-correct");
    const c = $("check-btn");
    c.disabled = false; c.textContent = session.hearts <= 0 ? "SEE RESULTS" : "CONTINUE"; c.className = "btn btn-continue";
  }
  function mk(w, side){
    const b = document.createElement("button"); b.className = "m-btn";
    b.textContent = side === "L" ? w.tag : (w.emoji + " " + w.en);
    b.addEventListener("click", ()=>{
      if(session.answered || b.classList.contains("done")) return;
      if(side === "L") sayTagalog(w);
      if(!sel || sel.side === side){
        if(sel) sel.b.classList.remove("sel");
        sel = { w, side, b }; b.classList.add("sel"); return;
      }
      const L = side === "L" ? { w, b } : sel, R = side === "R" ? { w, b } : sel;
      sel.b.classList.remove("sel"); sel = null;
      if(L.w.file === R.w.file){
        [L.b, R.b].forEach(x=>{ x.classList.add("done"); x.disabled = true; });
        noteCorrect(L.w); matched++;
        if(matched === q.words.length) finishMatch(false);
      } else {
        errors++; noteMissed(L.w);
        [L.b, R.b].forEach(x=>{ x.classList.add("bad"); setTimeout(()=>x.classList.remove("bad"), 450); });
        if(errors === 1){ session.hearts--; renderHearts(); }
        if(session.hearts <= 0) finishMatch(true);
      }
    });
    return b;
  }
  shuffle(q.words).forEach(w=>colL.appendChild(mk(w,"L")));
  shuffle(q.words).forEach(w=>colR.appendChild(mk(w,"R")));
  grid.appendChild(colL); grid.appendChild(colR);
  opts.appendChild(grid);
}
function selectOption(btn, value){
  if(session.answered) return;
  document.querySelectorAll(".option").forEach(o=>o.classList.remove("selected"));
  btn.classList.add("selected");
  session.selected = { btn, value };
  $("check-btn").disabled = false;
}
function handleCheck(){
  if(session.answered){ nextStep(); return; }
  const q = session.questions[session.current], w = q.word;
  let ok = false, wrongSub = "";
  if(q.type === "tag2en" || q.type === "listen" || q.type === "en2tag"){
    const answer = q.type === "en2tag" ? w.tag : w.en;
    ok = session.selected.value === answer;
    document.querySelectorAll(".option").forEach(o=>{
      o.disabled = true;
      if(o.dataset.value === answer) o.classList.add("correct");
    });
    if(!ok) session.selected.btn.classList.add("incorrect");
  } else if(q.type === "type"){
    const input = $("type-input");
    ok = norm(input.value) === norm(w.tag);
    input.disabled = true; input.classList.add(ok ? "correct" : "incorrect");
    $("type-slots").classList.add(ok ? "correct" : "incorrect");
    document.querySelectorAll("#type-slots .slot").forEach(d=>d.classList.remove("active"));
    if(!ok) wrongSub = "The answer is " + w.tag;
  } else if(q.type === "build"){
    const got = session.placed.map(i=>q.tokens[i]).join(" ");
    ok = norm(got) === norm(w.tag);
    $("answer-line").classList.add(ok ? "correct" : "incorrect");
    document.querySelectorAll(".tile-word").forEach(b=>b.disabled = true);
    if(!ok) wrongSub = "The answer is " + w.tag;
  }
  session.answered = true;
  if(ok){ session.correct++; noteCorrect(w); }
  else {
    session.hearts--; renderHearts(); noteMissed(w);
    if(!session.requeued.has(w.file)){
      session.requeued.add(w.file);
      const at = Math.min(session.current + 3, session.questions.length);
      session.questions.splice(at, 0, mkQ(w, q.pool, variantType(q.type)));
    }
  }
  const fb = $("feedback-msg");
  fb.classList.remove("hidden");
  fb.className = "feedback-msg " + (ok ? "correct-text" : "wrong-text");
  fb.innerHTML = (ok ? "Tama! " : "Mali. ") + w.emoji +
    '<span class="feedback-sub">'+(wrongSub ? wrongSub + " — " : "")+w.tag+' means “'+w.en+'”</span>';
  $("footer-bar").className = "footer-bar " + (ok ? "feedback-correct" : "feedback-wrong");
  const check = $("check-btn");
  check.disabled = false;
  check.textContent = session.hearts <= 0 ? "SEE RESULTS" : "CONTINUE";
  check.className = "btn btn-continue";
  sayTagalog(w);
}
function nextStep(){
  if(session.hearts <= 0){ finishLesson(false); return; }
  session.current++;
  if(session.current >= session.questions.length){ finishLesson(true); return; }
  renderQuestion();
}
function finishLesson(passed){
  const total = session.questions.length;
  const acc = Math.round(Math.min(session.correct, total)/total*100);
  let stars = 0;
  const gained = [];
  if(passed){
    const today = dayStr(new Date());
    stars = 10 + session.correct;
    let first = false;
    if(session.daily){ first = progress.dailyDone !== today; progress.dailyDone = today; }
    else { first = !progress.completedUnits[session.unitIdx]; progress.completedUnits[session.unitIdx] = true; }
    progress.xp += stars;
    markActiveToday();
    if(first){ const s = awardSticker(); if(s) gained.push(s); }
    [3,7,14].forEach(t=>{
      if(progress.streak >= t && !progress.streakRewards[t]){
        progress.streakRewards[t] = true;
        const s = awardSticker(); if(s) gained.push(s);
      }
    });
    saveProgress();
  }
  $("result-icon").textContent = passed ? "🎉" : "😅";
  $("result-title").textContent = passed ? "Galing! Great job!" : "Ubos ang puso! Out of hearts";
  $("result-sub").textContent = passed ? "You finished the " + session.title + "." : "No worries. Try this lesson again!";
  $("result-xp").textContent = stars;
  $("result-acc").textContent = acc + "%";

  const box = $("new-stickers"); box.innerHTML = "";
  $("new-sticker-title").classList.toggle("hidden", !gained.length);
  gained.forEach(s=>{
    const b = document.createElement("button"); b.className = "new-sticker";
    b.innerHTML = '<span class="s-emoji">'+s.emoji+'</span><span>'+s.tag+'</span><small>'+s.en+'</small>';
    b.addEventListener("click", ()=>sayTagalog(s));
    box.appendChild(b);
  });
  if(gained.length) setTimeout(()=>sayTagalog(gained[0]), 700);

  const btn = $("result-btn");
  btn.textContent = passed ? "CONTINUE" : "TRY AGAIN";
  btn.className = "btn " + (passed ? "btn-continue" : "btn-retry");
  const again = session.daily ? startDaily : ()=>startLesson(session.unitIdx);
  btn.onclick = ()=>{ if(passed){ showScreen("home"); renderHome(); } else { again(); } };

  const pb = $("parent-btn");
  pb.classList.toggle("hidden", !passed);
  const en = "⭐ Tagalog Adventure: finished the " + session.title + " today! " +
    session.correct + " of " + total + " correct (" + acc + "%), " + stars + " stars earned. 🔥 " + progress.streak + "-day streak." +
    (gained.length ? " New snack sticker: " + gained.map(s=>s.emoji+" "+s.tag).join(", ") + "." : "");
  const tl = "⭐ Tagalog Adventure: Natapos ko ang " + session.title + " ngayon! " +
    session.correct + " sa " + total + " ang tama (" + acc + "%), " + stars + " bituin. 🔥 " + progress.streak + " araw na magkakasunod." +
    (gained.length ? " Bagong sticker: " + gained.map(s=>s.emoji+" "+s.tag).join(", ") + "." : "");
  const msg = tl + "\n\n" + en;
  pb.onclick = ()=>sendToParent(msg);
  showScreen("result");
}
async function sendToParent(text){
  if(navigator.share){
    try{ await navigator.share({ title:"Tagalog Adventure", text }); return; }
    catch(e){ if(e && e.name === "AbortError") return; }
  }
  let email = "";
  try{ email = localStorage.getItem("tagalog-parent-email") || ""; }catch(e){}
  if(!email){
    email = (prompt("Parent's email address?") || "").trim();
    if(!email) return;
    try{ localStorage.setItem("tagalog-parent-email", email); }catch(e){}
  }
  location.href = "mailto:" + email + "?subject=" + encodeURIComponent("Tagalog Adventure progress") + "&body=" + encodeURIComponent(text);
}

/* ============ SCREENS ============ */
function showScreen(name){
  stopAudio();
  $("home-screen").style.display = name==="home" ? "block" : "none";
  $("stickers-screen").style.display = name==="stickers" ? "block" : "none";
  $("lesson-screen").classList.toggle("active", name==="lesson");
  $("result-screen").classList.toggle("active", name==="result");
  window.scrollTo(0,0);
}
$("exit-btn").addEventListener("click", ()=>{ showScreen("home"); renderHome(); });
$("stickers-back").addEventListener("click", ()=>{ showScreen("home"); renderHome(); });
$("reset-btn").addEventListener("click", ()=>{
  if(!confirm("Reset all progress? This can't be undone.")) return;
  progress = freshProgress();
  saveProgress(); renderHome();
});

/* ============ START ============ */
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
showScreen("home");
loadProgress();
</script>
