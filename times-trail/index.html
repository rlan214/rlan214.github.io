<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Times Trail">
<link rel="apple-touch-icon" sizes="180x180" href="/times-trail/apple-touch-icon-v2.png"><link rel="icon" type="image/png" sizes="512x512" href="/times-trail/icon-512.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Times Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one-screen app. Home is a scrolling zigzag trail of lesson nodes (easy tables first); a lesson takes over the screen with an answer sheet docked at the bottom */
:root{
  --bg:#F5F7FC; --surface:#FFFFFF; --ink:#1B2440; --muted:#66708C; --line:#E1E6F1;
  --accent:#2F6BE0; --accent-deep:#1D4CA8; --accent-soft:#E2EBFD;
  --sun:#FFB020; --sun-deep:#B87600; --sun-soft:#FFF1D4;
  --good:#1FA35B; --good-deep:#137840; --good-soft:#DCF4E6;
  --bad:#DE444A; --bad-deep:#A82C32; --bad-soft:#FCE3E4;
  --lock:#D3D9E6; --lock-deep:#AEB7CB; --on-color:#FFFFFF;
  --fb-good:var(--good-deep); --fb-bad:var(--bad-deep);
  --f-display:"Fredoka", "Nunito", system-ui, sans-serif;
  --f-body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1428; --surface:#181F3A; --ink:#EDF0FA; --muted:#97A1BF; --line:#2A3354;
    --accent:#5A8BFF; --accent-deep:#3A62C6; --accent-soft:#1E2B55;
    --sun:#FFB830; --sun-deep:#C98B10; --sun-soft:#3A2F14;
    --good:#2EBD6D; --good-deep:#1C8A4C; --good-soft:#15382A;
    --bad:#F0626A; --bad-deep:#B13940; --bad-soft:#3D1E26;
    --lock:#353E5E; --lock-deep:#242B47; --on-color:#FFFFFF;
    --fb-good:var(--good); --fb-bad:var(--bad);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1428; --surface:#181F3A; --ink:#EDF0FA; --muted:#97A1BF; --line:#2A3354;
  --accent:#5A8BFF; --accent-deep:#3A62C6; --accent-soft:#1E2B55;
  --sun:#FFB830; --sun-deep:#C98B10; --sun-soft:#3A2F14;
  --good:#2EBD6D; --good-deep:#1C8A4C; --good-soft:#15382A;
  --bad:#F0626A; --bad-deep:#B13940; --bad-soft:#3D1E26;
  --lock:#353E5E; --lock-deep:#242B47; --on-color:#FFFFFF;
  --fb-good:var(--good); --fb-bad:var(--bad);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.screen{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
#app{position:relative;z-index:1;height:100%}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}

.btn{display:block;width:100%;padding:14px 18px;border-radius:16px;font-family:var(--f-display);font-weight:600;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;
  background:var(--accent);color:var(--on-color);box-shadow:0 5px 0 var(--accent-deep);transition:transform .06s, box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--accent-deep)}
.btn:disabled{background:var(--lock);color:var(--muted);box-shadow:0 5px 0 var(--lock-deep);cursor:default}
.btn.good{background:var(--good);box-shadow:0 5px 0 var(--good-deep)}
.btn.bad{background:var(--bad);box-shadow:0 5px 0 var(--bad-deep)}
.btn.ghost{background:var(--surface);color:var(--accent);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}

/* ---------- HOME ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:2px solid var(--line);background:var(--bg);flex:none}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.3rem;color:var(--accent);margin-right:auto;display:flex;align-items:center;gap:8px}
.stat{display:flex;align-items:center;gap:5px;font-weight:800}
.stat svg{width:22px;height:22px}
.stat.streak{color:var(--sun-deep)}
.stat.xp{color:var(--accent)}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn svg{width:22px;height:22px}
.home-scroll{flex:1;overflow-y:auto;padding:16px 16px 48px}
.goal{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px}
.goal .ring{width:56px;height:56px;flex:none}
.goal h3{margin:0 0 2px;font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.goal p{margin:0;color:var(--muted);font-size:.92rem}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.quick button{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 8px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;min-width:0}
.quick button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.quick button:disabled{opacity:.5;cursor:default}
.quick .qi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.quick .qi svg{width:20px;height:20px}
.quick b{display:block;font-size:.88rem;line-height:1.15}
.quick small{color:var(--muted);font-size:.74rem;line-height:1.2;display:block}

.unit{margin-top:26px}
.banner{border-radius:18px;padding:14px 16px;background:var(--c);color:var(--bt,var(--on-color));position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 4px 0 var(--deep)}
.banner .eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;opacity:.9;font-weight:800}
.banner h2{margin:2px 0 0;font-family:var(--f-display);font-weight:600;font-size:1.35rem}
.banner .tipline{margin:4px 0 0;font-size:.85rem;font-weight:700;opacity:.92}
.banner .big{font-family:var(--f-display);font-weight:700;font-size:2.3rem;line-height:1;opacity:.9;flex:none}
.banner.locked{background:var(--lock)!important;color:var(--muted);box-shadow:0 4px 0 var(--lock-deep)}
.trail{display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 0 4px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center;transform:translateX(calc(var(--o,0) * var(--spread,1) * 1px))}
.node{position:relative;width:76px;height:70px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.9rem;color:var(--bt,var(--on-color));
  background:var(--c);box-shadow:0 7px 0 var(--deep);transition:transform .06s, box-shadow .06s}
.node svg{width:34px;height:34px}
.node .sm{font-size:1.45rem;letter-spacing:-.02em}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--deep)}
.node.locked{background:var(--lock);box-shadow:0 7px 0 var(--lock-deep);color:var(--muted)}
.node.done{background:var(--sun);box-shadow:0 7px 0 var(--sun-deep)}
.node-label{margin-top:12px;font-size:.8rem;font-weight:800;color:var(--muted);letter-spacing:.04em}
.start-tag{position:absolute;top:-38px;background:var(--surface);border:2px solid var(--line);color:var(--accent);font-family:var(--f-display);font-weight:700;letter-spacing:.06em;padding:4px 12px;border-radius:12px;font-size:.9rem;animation:bob 1.4s ease-in-out infinite;white-space:nowrap}
.start-tag::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.node-wrap.current{margin-top:24px}
.node-wrap.current .node{outline:6px solid color-mix(in srgb, var(--c) 28%, transparent);outline-offset:4px}
@keyframes bob{50%{transform:translateY(-5px)}}
.finale{margin-top:30px;text-align:center;color:var(--muted);font-size:.9rem}
.unit.exam{margin-top:40px}
.banner .big svg{width:44px;height:44px}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;max-width:26em}
.rules li{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700}
.rules b{color:var(--accent)}
.exam-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:400px}
.exam-grid span{border-radius:10px;padding:6px 0;font-weight:800;font-size:.85rem}
.exam-grid .ok{background:var(--good-soft);color:var(--fb-good)}
.exam-grid .meh{background:var(--sun-soft);color:var(--sun-deep)}
.exam-grid .no{background:var(--bad-soft);color:var(--fb-bad)}
.results h1.miss{color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:.92rem;max-width:calc(100% - 32px);z-index:30}

.overlay{position:fixed;inset:0;background:color-mix(in srgb, #0B1020 50%, transparent);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.sheet h3{margin:0 0 4px;font-family:var(--f-display);font-weight:600;font-size:1.3rem}
.sheet > p{margin:0 0 8px;color:var(--muted);font-weight:600;font-size:.92rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:2px solid var(--line)}
.row span small{display:block;color:var(--muted);font-weight:600;font-size:.82rem}
.row input{font:inherit;font-weight:700;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:6px 10px;width:9em;min-width:0}
.switch{width:52px;height:30px;border-radius:15px;background:var(--lock);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{left:25px}
.sheet .btn{margin-top:10px}
.report{margin:0;white-space:pre-wrap;word-break:break-word;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:14px;font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace;font-size:.84rem;line-height:1.5;color:var(--ink);user-select:text;-webkit-user-select:text}
.sheet a.btn{text-decoration:none;text-align:center}
.sheet h3.gap{margin-top:16px}
.both{display:flex;flex-direction:column;gap:8px}
.report.code{word-break:break-all;max-height:7.5em;overflow:auto;font-size:.74rem;color:var(--muted)}
.sheet textarea{font:inherit;font-size:.85rem;font-weight:600;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;min-width:0;resize:vertical;word-break:break-all}
.sheet textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rmsg{margin:2px 0 0;font-weight:700;font-size:.9rem;min-height:1.2em}
.rmsg.ok{color:var(--fb-good)}
.rmsg.err{color:var(--fb-bad)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- INTRO (Learn lesson) ---------- */
.intro{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.intro h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:2.1rem;color:var(--accent)}
.intro .tip{background:var(--sun-soft);border:2px solid var(--sun);border-radius:18px;padding:14px 16px;font-weight:800;font-size:1.1rem;max-width:30em;text-wrap:balance}
.intro .flip{color:var(--muted);font-weight:700;margin:0}
.ladder{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:28em}
.ladder span{min-width:3.1em;padding:8px 6px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-family:var(--f-display);font-weight:600;font-size:1.2rem}
.ladder span em{display:block;font-style:normal;font-family:var(--f-body);font-size:.68rem;color:var(--muted);font-weight:800}
.intro .mascot{width:96px;height:96px}

/* ---------- LESSON ---------- */
.lesson-top{display:flex;align-items:center;gap:12px;padding:16px 16px 8px;flex:none}
.bar{flex:1;height:18px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:var(--good);transition:width .4s cubic-bezier(.3,1.3,.6,1);box-shadow:inset 0 -5px 0 color-mix(in srgb, var(--good-deep) 35%, transparent)}
.bar.drop i{background:var(--bad)}
.score{font-family:var(--f-display);font-weight:700;font-size:1.05rem;color:var(--good);min-width:3.2em;text-align:right}
.score.drop{color:var(--bad)}
.stage{flex:1;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;gap:16px}
.kicker{font-family:var(--f-display);font-weight:600;font-size:1.35rem;margin:4px 0 0;text-wrap:balance}
.combo{color:var(--sun-deep);font-weight:800;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;min-height:1.2em}
.prompt-row{display:flex;align-items:center;gap:14px}
.mascot{width:80px;height:80px;flex:none}
.bubble{position:relative;flex:1;min-width:0;border:2px solid var(--line);border-radius:18px;padding:14px 10px;background:var(--surface);
  font-family:var(--f-display);font-weight:600;font-size:clamp(1.8rem, 8.5vw, 2.7rem);display:flex;align-items:center;justify-content:center;gap:.28em;flex-wrap:wrap}
.bubble.seq{font-size:clamp(1.5rem, 7vw, 2.2rem)}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.op{color:var(--accent)}
.blank{min-width:1.7em;padding:0 .2em;border-bottom:5px solid var(--accent);text-align:center;color:var(--accent);line-height:1.15}
.blank.empty{color:transparent}
.helper{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:14px;padding:10px 12px;font-weight:700;font-size:.95rem;color:var(--ink)}
.helper b{color:var(--accent);flex:none;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding-top:3px}
.array-box{display:flex;justify-content:center;overflow-x:auto}
.array-box svg{max-width:100%;height:auto}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{border:2px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 4px 0 var(--line);padding:15px 8px;font-family:var(--f-display);font-weight:600;font-size:1.7rem;position:relative}
.choice small{position:absolute;top:6px;left:9px;font-family:var(--f-body);font-size:.7rem;color:var(--muted);font-weight:800;border:2px solid var(--line);border-radius:6px;padding:0 5px}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.choice.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 4px 0 var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{border:2px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 4px 0 var(--line);padding:11px 0;font-family:var(--f-display);font-weight:600;font-size:1.5rem;display:grid;place-items:center}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.key svg{width:26px;height:26px;color:var(--muted)}
.lesson-foot{flex:none;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:12px}
.lesson-foot.good{background:var(--good-soft);border-color:transparent}
.lesson-foot.bad{background:var(--bad-soft);border-color:transparent}
.fb{display:flex;align-items:flex-start;gap:12px}
.fb .badge{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);flex:none}
.fb .badge svg{width:26px;height:26px}
.fb h4{margin:0;font-family:var(--f-display);font-weight:600;font-size:1.3rem}
.fb p{margin:2px 0 0;font-weight:700}
.fb .how{margin-top:6px;font-weight:700;color:var(--ink);font-size:.95rem}
.good .fb{color:var(--fb-good)}
.bad .fb{color:var(--fb-bad)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.pop{animation:pop .3s}
@keyframes pop{40%{transform:scale(1.08)}}

/* ---------- RESULTS ---------- */
.results{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 16px;text-align:center}
.results h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:2rem;color:var(--sun-deep);text-wrap:balance}
.results .sub{margin:0;color:var(--muted);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:400px}
.tile{border:2px solid var(--t);border-radius:16px;overflow:hidden;background:var(--surface)}
.tile .h{background:var(--t);color:var(--on-color);font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:5px 0}
.tile .v{font-family:var(--f-display);font-weight:600;font-size:1.5rem;padding:10px 0;color:var(--ink)}
.results .mascot{width:120px;height:120px}
.res-foot{flex:none;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.missed{width:100%;max-width:400px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.missed b{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.missed div{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.missed span{background:var(--bad-soft);color:var(--fb-bad);border-radius:8px;padding:3px 9px;font-weight:800}

/* ---------- iPad and large screens ---------- */
@media (min-width:700px){
  body{font-size:18px;--spread:1.7}
  .screen{max-width:780px}
  .topbar{padding:14px 24px}
  .brand{font-size:1.6rem}
  .stat{font-size:1.15rem} .stat svg{width:26px;height:26px}
  .iconbtn{width:48px;height:48px} .iconbtn svg{width:26px;height:26px}
  .home-scroll{padding:24px 28px 140px}
  .goal{padding:18px 20px;border-radius:22px} .goal .ring{width:70px;height:70px} .goal h3{font-size:1.3rem} .goal p{font-size:1rem}
  .quick{gap:14px;margin-top:14px} .quick button{padding:16px 10px;border-radius:20px} .quick .qi{width:50px;height:50px;border-radius:14px} .quick .qi svg{width:26px;height:26px} .quick b{font-size:1.08rem} .quick small{font-size:.85rem}
  .unit{margin-top:40px}
  .banner{padding:22px 26px;border-radius:24px} .banner .eyebrow{font-size:.85rem} .banner h2{font-size:1.9rem} .banner .tipline{font-size:1.02rem} .banner .big{font-size:3.3rem} .banner .big svg{width:66px;height:66px}
  .trail{gap:30px;padding:34px 0 10px}
  .node{width:100px;height:94px;font-size:2.5rem} .node svg{width:44px;height:44px}
  .node-label{font-size:.92rem}
  .start-tag{top:-46px;font-size:1.02rem}
  .lesson-top{padding:20px 28px 10px;gap:16px} .bar{height:22px;border-radius:11px} .bar i{border-radius:11px} .score{font-size:1.3rem}
  .stage{padding:14px 32px;gap:22px}
  .kicker{font-size:1.85rem} .combo{font-size:.95rem}
  .mascot{width:124px;height:124px}
  .bubble{font-size:clamp(2.6rem,6.2vw,4.4rem);padding:24px 14px;border-radius:26px}
  .bubble.seq{font-size:clamp(2rem,4.6vw,3.1rem)}

<div id="app"></div>

<script>
(function(){
/* ---------- storage (this device only) ---------- */
const KEY = 'timesTrail.v2';
const defaults = () => ({done:{}, xp:0, streak:{count:0,last:null}, daily:{date:null,xp:0}, facts:{}, log:[], exam:{best:null, passed:null, last:null}, sound:true, unlockAll:false, goal:30, name:'', theme:'auto', division:true, enhanced:true});
let S = defaults();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(defaults(), JSON.parse(raw)); } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

const app = document.getElementById('app');
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const shuffle = (arr) => { for (let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; };
const dayKey = (d=new Date()) => d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const todayXP = () => S.daily.date === dayKey() ? S.daily.xp : 0;
const yesterday = () => { const y = new Date(); y.setDate(y.getDate()-1); return dayKey(y); };
const liveStreak = () => (S.streak.last===dayKey() || S.streak.last===yesterday()) ? S.streak.count : 0;

/* ---------- curriculum ----------
   Easy tables first (the order most fact-fluency programs use): 1, 2, 10, 5, 11, then 3, 4, 9, 6, 8, 7, 12.
   Each table: Learn (strategy + skip counting + arrays) -> Multiply -> Divide (fact families) -> Master (mixed). */
const ORDER = [1,2,10,5,11,3,4,9,6,8,7,12];
const GOAL = 10;      // correct answers to finish a lesson
const DROP = 3;       // progress lost on a wrong answer
const EXAM_N = 36;    // final exam: 3 questions from each of the 12 tables
const EXAM_PASS = 90; // percent needed to pass
const DAILY_N = 20;   // Daily Mix length
const FAST_MS = 4000; // a typed answer this fast counts as remembered, not counted out
const TIPS = {
  1:'Anything times 1 stays the same number.',
  2:'Times 2 means double it.',
  10:'Times 10: put a 0 on the end.',
  5:'Times 5 is half of times 10. Answers end in 0 or 5.',
  11:'Up to 9, just repeat the digit: 11 × 4 = 44.',
  3:'Times 3: double it, then add one more group.',
  4:'Times 4: double it, then double again.',
  9:'Times 9: times 10, then take one group away.',
  6:'Times 6: times 5, then add one more group.',
  8:'Times 8: double, double, double.',
  7:'Times 7: times 5 plus times 2.',
  12:'Times 12: times 10 plus times 2.'
};
function strategy(n, b){
  const p = n*b;
  switch(n){
    case 1: return `Anything times 1 stays the same: 1 × ${b} = ${p}.`;
    case 2: return `Double it: ${b} + ${b} = ${p}.`;
    case 10: return `Put a 0 on the end: ${b} becomes ${p}.`;
    case 5: return `Half of × 10: ${b} × 10 = ${b*10}, and half of that is ${p}.`;
    case 11: return b<=9 ? `Repeat the digit: 11 × ${b} = ${p}.` : `× 10 plus one more: ${b*10} + ${b} = ${p}.`;
    case 3: return `Double, then add one more ${b}: ${2*b} + ${b} = ${p}.`;
    case 4: return `Double, then double again: ${b} → ${2*b} → ${p}.`;
    case 9: return `× 10, then take one ${b} away: ${b*10} − ${b} = ${p}.`;
    case 6: return `× 5, then add one more ${b}: ${5*b} + ${b} = ${p}.`;
    case 8: return `Double three times: ${b} → ${2*b} → ${4*b} → ${p}.`;
    case 7: return `× 5 plus × 2: ${5*b} + ${2*b} = ${p}.`;
    case 12: return `× 10 plus × 2: ${10*b} + ${2*b} = ${p}.`;
  }
}
// explain a fact with whichever of its two tables is easier
function explain(q){
  let [a,b] = q.f;
  if (ORDER.indexOf(b) < ORDER.indexOf(a)) [a,b] = [b,a];
  const s = strategy(a,b);
  if (q.op==='÷') return `Think: ${q.y} × what = ${q.x}? ${s}`;
  return s;
}

const KINDS = [
  {k:'learn', name:'Learn'},
  {k:'mul', name:'Multiply'},
  {k:'div', name:'Divide'},
  {k:'mix', name:'Master'}
];
const divOn = () => S.division !== false;
const activeKinds = () => divOn() ? KINDS : KINDS.filter(K => K.k !== 'div');
const pickOp = (pMul=.5) => (!divOn() || Math.random() < pMul) ? '×' : '÷';
let LESSONS = [];
function rebuildLessons(){
  LESSONS = [];
  ORDER.forEach(n => activeKinds().forEach(K => LESSONS.push({id:n+K.k, unit:n, kind:K.k, name:K.name})));
}
rebuildLessons();
const isUnlocked = (i) => S.unlockAll || i===0 || !!S.done[LESSONS[i-1].id];
const currentIdx = () => LESSONS.findIndex(l => !S.done[l.id]);
const UNIT_COLORS = [['var(--accent)','var(--accent-deep)'],['var(--good)','var(--good-deep)'],['var(--bad)','var(--bad-deep)'],['var(--sun)','var(--sun-deep)']];

/* ---------- question makers ---------- */
function fact(n,b,op){
  if (op==='÷'){ const p=n*b; return Math.random()<.5 ? {kind:'fact',x:p,op:'÷',y:n,r:b,f:[n,b]} : {kind:'fact',x:p,op:'÷',y:b,r:n,f:[n,b]}; }
  const flip = Math.random()<.5;
  return {kind:'fact', x:flip?b:n, op:'×', y:flip?n:b, r:n*b, f:[n,b]};
}
function factKey(f){ const [a,b] = f.slice().sort((p,q)=>p-q); return a+' × '+b; }
function finalize(q, style){
  q.blank = q.blank || 'r';
  if (style==='missing' && q.kind==='fact') q.blank = q.op==='×' ? (Math.random()<.5?'x':'y') : 'y';
  q.ans = q.kind==='fact' ? q[q.blank] : q.ans;
  q.type = style==='choice' ? 'choice' : 'type';
  if (q.type==='choice') q.opts = options(q.ans, q.f);
  return q;
}
function options(ans, f){
  const [a,b] = f, set = new Set();
  shuffle([ans+1, ans-1, ans+a, ans-a, ans+b, ans-b, ans+10, ans-10, ans+2, (a+1)*b, a*(b+1)])
    .forEach(v => { if (v>=0 && v!==ans && set.size<3) set.add(v); });
  for (let k=3; set.size<3; k++) set.add(ans+k);
  return shuffle([ans, ...set]);
}

function buildExam(){
  const list = [];
  const prev = new Set(S.exam.lastFacts || []);   // facts from her last attempt
  ORDER.forEach(n => {
    const all = [...Array(12)].map((_,k)=>k+1);
    const fresh = shuffle(all.filter(b => !prev.has(factKey([n,b]))));
    const stale = shuffle(all.filter(b => prev.has(factKey([n,b]))));
    const bs = fresh.concat(stale).slice(0,3);
    const a = fact(n, bs[0], '×'); a.table = n; list.push(finalize(a, 'type'));
    const d = fact(n, bs[1], divOn() ? '÷' : '×'); d.table = n; list.push(finalize(d, 'type'));
    const m = fact(n, bs[2], pickOp()); m.table = n; list.push(finalize(m, 'missing'));
  });
  S.exam.lastFacts = list.map(q => factKey(q.f)); save();
  return shuffle(list);
}
function poolTables(){ const t = ORDER.filter(n => S.unlockAll || S.done[n+'learn']); return t.length ? t : [1,2,10]; }
function factWeight(k){
  const r = S.facts[k], now = Date.now();
  if (!r || (r.c||0) + (r.w||0) === 0) return 2.5;                       // never tried: worth a look
  let w = 1 + 2.5 * (r.w / Math.max(1, r.c + r.w))                        // misses pull it in
        + ((r.t||0) > FAST_MS ? Math.min(2, (r.t - FAST_MS) / 2000) : 0); // slow answers pull it in
  if ((r.fs||0) >= 3) w = .35 + Math.min(1.2, (now - (r.last||0)) / (7*864e5)); // memorized: returns as days pass
  if (r.last && now - r.last < 10*60e3) w *= .3;                          // just seen: rest it
  return w;
}
function buildDaily(){
  const tabs = new Set(poolTables()), facts = [];
  for (let a=1;a<=12;a++) for (let b=a;b<=12;b++) if (tabs.has(a) || tabs.has(b)) facts.push([a,b]);
  const pick = [];
  let pool = facts.map(f => ({f, w:factWeight(factKey(f))}));
  while (pick.length < DAILY_N){
    if (!pool.length) pool = facts.map(f => ({f, w:1}));
    let r = Math.random() * pool.reduce((s,p) => s + p.w, 0), i = 0;
    while (i < pool.length-1 && r > pool[i].w){ r -= pool[i].w; i++; }
    pick.push(pool.splice(i,1)[0].f);
  }
  return pick.map((f,i) => { const [x,y] = Math.random()<.5 ? f : [f[1],f[0]]; return finalize(fact(x, y, pickOp(.6)), i%5===4 ? 'missing' : 'type'); });
}
function factStatus(k){
  const r = S.facts[k];
  if (!r || (r.c||0) + (r.w||0) === 0) return 'new';
  if ((r.fs||0) >= 3) return 'ok';
  if (r.w > (r.c||0)/3 || (r.t||0) > 7000) return 'bad';
  return 'mid';
}
const masteredCount = () => { let n = 0; for (let a=1;a<=12;a++) for (let b=a;b<=12;b++) if (factStatus(a+' × '+b)==='ok') n++; return n; };
function factMapText(){
  const E = {ok:'🟩', mid:'🟨', bad:'🟥', new:'⬜'}, rows = [];
  for (let a=1;a<=12;a++){ let line = ''; for (let b=1;b<=12;b++) line += E[factStatus(factKey([a,b]))]; rows.push(String(a).padStart(2,' ') + ' ' + line); }
  return rows.join('\n');
}
function factMapHTML(){
  let h = '<table aria-label="Fact map, 1 to 12"><tr><th></th>' + [...Array(12)].map((_,i)=>`<th>${i+1}</th>`).join('') + '</tr>';
  for (let a=1;a<=12;a++){
    h += `<tr><th>${a}</th>`;
    for (let b=1;b<=12;b++){ const st = factStatus(factKey([a,b])); h += `<td class="${st}" title="${a} × ${b}"></td>`; }
    h += '</tr>';
  }
  return h + '</table>';
}
function makeGenerator(L){
  if (L.kind==='daily'){ const list = buildDaily(); let j = 0; return () => list[Math.min(j++, list.length-1)]; }
  if (L.kind==='exam'){ const list = buildExam(); let j = 0; return () => list[Math.min(j++, list.length-1)]; }
  if (L.kind==='strat'){ let j = 0; return () => { const m = j<4 ? 'guided' : j<7 ? 'hint' : 'solo'; j++; return stratProblem(m); }; }
  let i = 0, bag = [];
  const draw = () => { if (!bag.length) bag = shuffle([...Array(12)].map((_,k)=>k+1)); return bag.pop(); };
  const unlockedTables = () => {
    const t = ORDER.filter(n => S.unlockAll || S.done[n+'learn']);
    return t.length ? t : [1,2,10];
  };
  return function(){
    const n = L.unit, b = draw(), step = i++;
    if (L.kind==='learn'){
      const phase = step % 9;
      if (phase < 3){ // skip counting
        const k = ri(1,8);
        return finalize({kind:'skip', n, seq:[k*n,(k+1)*n,(k+2)*n], ans:(k+3)*n, f:[n,k+3]}, 'type');
      }
      if (phase < 6){ // arrays
        const c = ri(2,6);
        const q = fact(n,c,'×'); q.x = n; q.y = c; q.array = true;
        return finalize(q, 'choice');
      }
      const q = fact(n, ri(1,10), '×'); q.help = true;
      return finalize(q, phase===8 ? 'type' : 'choice');
    }
    if (L.kind==='mul'){
      const q = fact(n,b,'×');
      return finalize(q, step<3 ? 'choice' : (step%4===3 ? 'missing' : 'type'));
    }
    if (L.kind==='div'){
      const q = fact(n,b,'÷');
      if (step<4){ q.family = true; return finalize(q, 'type'); }  // fact-family scaffold
      return finalize(q, step%5===0 ? 'choice' : (step%4===2 ? 'missing' : 'type'));
    }
    if (L.kind==='mix'){
      // about 1 in 4 questions come from the 2 tables learned just before this one
      const pos = ORDER.indexOf(n);
      const earlier = ORDER.slice(Math.max(0, pos-2), pos);
      const useEarlier = earlier.length && step%4===2;
      const t = useEarlier ? earlier[ri(0, earlier.length-1)] : n;
      const q = fact(t, useEarlier ? ri(1,12) : b, pickOp());
      if (useEarlier) q.earlier = t;
      return finalize(q, step%3===1 ? 'missing' : 'type');
    }
    if (L.kind==='weak'){
      const list = weakFacts();
      const f = list.length ? list[step % list.length].f : [ri(2,9), ri(2,9)];
      return finalize(fact(f[0], f[1], pickOp()), step%4===3 ? 'missing' : 'type');
    }
    // review: only tables she has started
    const t = unlockedTables();
    const q = fact(t[ri(0,t.length-1)], ri(1,12), pickOp(.55));
    return finalize(q, step%5===4 ? 'choice' : (step%3===2 ? 'missing' : 'type'));
  };
}
/* ---------- Strategy lessons (Greg Tang style) ----------
   Bigger problems she can't just remember, solved by breaking them into easy facts.
   mode: 'guided' (step by step) -> 'hint' (idea shown, she works it out) -> 'solo' (hint on request). */
const STRAT_KINDS = [['split',35],['sub',25],['double',15],['halve',15],['quarter',10]];
let lastStrat = '';
function stratProblem(mode){
  const big = mode !== 'guided';
  let kind;
  do {
    let r = Math.random()*100, i = 0;
    while (r > STRAT_KINDS[i][1]){ r -= STRAT_KINDS[i][1]; i++; }
    kind = STRAT_KINDS[i][0];
  } while (kind === lastStrat);
  lastStrat = kind;
  let x, y, name, hint, steps;
  if (kind==='split'){
    const a = ri(3,9), T = 10*ri(1, big ? 4 : 2), u = ri(2,9), b = T+u;
    x = a; y = b; name = 'Break apart';
    hint = `Break ${b} into ${T} and ${u}. Multiply each part by ${a}, then add.`;
    steps = [{t:`${a} × ${T}`, a:a*T}, {t:`${a} × ${u}`, a:a*u}, {t:`${a*T} + ${a*u}`, a:a*b}];
  } else if (kind==='sub'){
    const a = ri(3,9), R = 10*ri(2, big ? 5 : 3), d = Math.random()<.65 ? 1 : 2, b = R-d;
    x = a; y = b; name = 'Subtract to add';
    if (d===1){
      hint = `${b} is one less than ${R}. Do ${a} × ${R}, then take away one ${a}.`;
      steps = [{t:`${a} × ${R}`, a:a*R}, {t:`${a*R} − ${a}`, a:a*b}];
    } else {
      hint = `${b} is ${R} − 2. Do ${a} × ${R}, then take away ${a} × 2.`;
      steps = [{t:`${a} × ${R}`, a:a*R}, {t:`${a} × 2`, a:a*2}, {t:`${a*R} − ${a*2}`, a:a*b}];
    }
  } else if (kind==='double'){
    const a = Math.random()<.5 ? 4 : 8, b = a===4 ? ri(13, big ? 39 : 25) : ri(12, big ? 24 : 16);
    x = a; y = b; name = a===4 ? 'Double, double' : 'Double three times';
    hint = a===4 ? `× 4 is double, then double again. Start with ${b}.` : `× 8 is double, double, double. Start with ${b}.`;
    steps = [{t:`Double ${b}`, a:2*b}, {t:`Double ${2*b}`, a:4*b}];
    if (a===8) steps.push({t:`Double ${4*b}`, a:8*b});
  } else if (kind==='halve'){
    const b = 2*ri(6, big ? 24 : 12);
    x = 5; y = b; name = 'Halve it';
    hint = `× 5 is half of × 10. Take half of ${b}, then times 10.`;
    steps = [{t:`Half of ${b}`, a:b/2}, {t:`${b/2} × 10`, a:5*b}];
  } else {
    const b = 4*ri(3, big ? 9 : 5);
    x = 25; y = b; name = 'Quarters';
    hint = `Four 25s make 100. How many 4s are in ${b}? Then times 100.`;
    steps = [{t:`${b} ÷ 4`, a:b/4}, {t:`${b/4} × 100`, a:25*b}];
  }
  return {kind:'strat', mode, x, y, r:x*y, name, hint, steps, si:0,
          summary: steps.map(s => `${s.t} = ${s.a}`).join(', then ')};
}

function weakFacts(){
  return Object.entries(S.facts).filter(([,v])=>v.w>0)
    .map(([k,v]) => ({k, f:k.split(' × ').map(Number), w:v.w, c:v.c}))
    .sort((a,b)=>(b.w*2-b.c)-(a.w*2-a.c)).slice(0,12);
}

/* ---------- icons + mascot ---------- */
const I = {

function arraySVG(rows, cols){

/* ---------- sound ---------- */
let ac;
function tone(freqs, dur=.12, type='triangle'){
  if (!S.sound) return;
  try {
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i*dur;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur+.08);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.1);
    });
  } catch(e){}
}
function glide(){
  if (!S.sound) return;
  try {
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = 'sine'; o.frequency.setValueAtTime(330,t); o.frequency.linearRampToValueAtTime(560,t+.45); o.frequency.linearRampToValueAtTime(290,t+1.1);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.12,t+.1); g.gain.exponentialRampToValueAtTime(.0001,t+1.2);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+1.25);
  } catch(e){}
}
/* enhanced audio: clicks, bells and a little echo */
const enh = () => S.sound && S.enhanced !== false;
let bus = null, noiseBuf = null;
function actx(){ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; }
function out(){
  if (bus) return bus;
  const a = actx(), comp = a.createDynamicsCompressor(), dry = a.createGain(), send = a.createGain();
  const dly = a.createDelay(), fb = a.createGain(), wet = a.createGain();
  dry.gain.value = .9; dly.delayTime.value = .17; fb.gain.value = .28; wet.gain.value = .22;
  dry.connect(comp); comp.connect(a.destination);
  send.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(comp);
  bus = {dry, send}; return bus;
}
function bell(f, when=0, dur=.9, vol=.15, wetAmt=.6){
  try {
    const a = actx(), b = out(), t = a.currentTime + when;
    [[1,1],[2,.45],[2.76,.25],[5.4,.1]].forEach(([r,v]) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.value = f*r;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol*v,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+dur/Math.sqrt(r));
      o.connect(g); g.connect(b.dry);
      if (wetAmt){ const sg = a.createGain(); sg.gain.value = wetAmt; g.connect(sg); sg.connect(b.send); }
      o.start(t); o.stop(t+dur+.05);
    });
  } catch(e){}
}
function sweep(f1, f2, when=0, dur=.28, vol=.2, type='sine'){
  try {
    const a = actx(), b = out(), t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+dur+.05);
    o.connect(g); g.connect(b.dry); o.start(t); o.stop(t+dur+.1);
  } catch(e){}
}
function noise(when=0, dur=.05, freq=3000, vol=.3, type='bandpass', toBus=false){
  try {
    const a = actx(), t = a.currentTime + when;
    if (!noiseBuf){
      noiseBuf = a.createBuffer(1, Math.floor(a.sampleRate*.25), a.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    }
    const n = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    n.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = 1.2;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    n.connect(f); f.connect(g); g.connect(toBus ? out().dry : a.destination); n.start(t); n.stop(t+dur+.02);
  } catch(e){}
}
function click(kind){
  if (!enh()) return;
  if (kind === 'key'){ noise(0,.035,2600+Math.random()*400,.32); sweep(1500,900,0,.03,.07); }
  else if (kind === 'big'){ noise(0,.06,1000,.42); sweep(420,200,0,.05,.12); }
  else { noise(0,.03,3400,.24); }
}
/* number-pad sounds that match the theme; each digit is its own note */
const KEY_NOTES = {
  halloween:[293.7,349.2,392,440,523.3,587.3,698.5,784,880,1046.5],  // D minor pentatonic
  christmas:[1046.5,1174.7,1318.5,1568,1760,2093,2349.3,2637,3136,3520] // C major pentatonic, glockenspiel range
};
function wood(f){
  try {
    const a = actx(), b = out(), t = a.currentTime;
    [[1,.3,'triangle'],[2.01,.1,'sine'],[3.9,.05,'sine']].forEach(([r,v,ty]) => {
      const o = a.createOscillator(), g = a.createGain(), sg = a.createGain();
      o.type = ty; o.frequency.setValueAtTime(f*r*1.05,t); o.frequency.exponentialRampToValueAtTime(f*r,t+.03);
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+.2/Math.pow(r,.3));
      sg.gain.value = .4; o.connect(g); g.connect(b.dry); g.connect(sg); sg.connect(b.send);
      o.start(t); o.stop(t+.32);
    });
    noise(0,.02,1800,.16);
  } catch(e){}
}
function keySound(k){
  if (!enh()) return;
  const n = seasonName(), del = (k==='⌫' || k==='C'), d = del ? -1 : Math.max(0, Math.min(9, Number(k)||0));
  if (n==='halloween'){
    if (del){ sweep(170,95,0,.14,.24); noise(0,.06,600,.22); return; }
    wood(KEY_NOTES.halloween[d]);
  } else if (n==='christmas'){
    if (del){ noise(0,.16,5000,.1,'highpass',true); sweep(1500,700,0,.12,.05); return; }
    bell(KEY_NOTES.christmas[d], 0, .45, .075, .4); noise(0,.07,9500,.07,'highpass',true);
  } else click(del ? 'small' : 'key');
}
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('button, a.btn');
  if (!b || b.disabled) return;
  if (b.classList.contains('key')) return keySound(b.dataset.k);
  if (b.classList.contains('choice')) return keySound(String(ri(1,9)));
  click(b.classList.contains('key') || b.classList.contains('choice') ? 'key'
      : (b.classList.contains('btn') || b.classList.contains('node')) ? 'big' : 'small');
}, {passive:true});

const sfx = {
  good: () => {
    const n = seasonName();
    if (enh()){
      if (n==='christmas'){ bell(1319,0,.8,.13); bell(1760,.09,1.1,.13); noise(.02,.12,8000,.06,'highpass',true); }
      else if (n==='halloween'){ bell(587,0,.7,.12); bell(880,.1,1,.12); }
      else { bell(880,0,.6,.12); bell(1319,.08,.9,.12); }
      return;
    }
    n==='christmas' ? tone([1319,1760],.08) : n==='halloween' ? tone([587,880],.11) : tone([660,880]);
  },
  bad: () => {
    if (enh()){ sweep(320,150,0,.26,.24); sweep(160,90,0,.3,.14,'triangle'); return; }
    tone([220,180],.15,'square');
  },
  win: () => {
    const n = seasonName();
    if (enh()){
      if (n==='halloween'){
        [392,466,587,784].forEach((f,i) => bell(f, i*.14, 1.1, .12));
        [196,233,294].forEach(f => sweep(f, f*.995, .6, 1.4, .05, 'triangle'));
        setTimeout(glide, 750);
      } else if (n==='christmas'){
        const mel = [659,659,659,0,659,659,659,0,659,784,523,587,659];
        mel.forEach((f,i) => { if (f) bell(f, i*.13, .7, .12); if (i%2===0) noise(i*.13,.08,9000,.05,'highpass',true); });
        [523,659,784].forEach(f => bell(f, 13*.13, 1.6, .07));
      } else {
        [523,659,784,1047].forEach((f,i) => bell(f, i*.12, .9, .12));
        [523,659,784].forEach(f => bell(f, .55, 1.6, .07));
      }
      return;
    }
    if (n==='halloween'){ tone([392,466,587,784],.14); setTimeout(glide, 650); }
    else if (n==='christmas') tone([659,659,659,659,659,659,659,784,523,587,659],.13);
    else tone([523,659,784,1047],.13);
  },
  tap: () => { if (!enh()) tone([440],.04); }
};

function seasonName(){
  const t = S.theme || 'auto';
  if (t==='classic') return null;
  if (THEMES[t]) return t;
  const m = new Date().getMonth();
  return Object.keys(THEMES).find(k => THEMES[k].months.includes(m)) || null;
}
const TH = () => THEMES[seasonName()] || null;
const unitColors = () => TH() ? TH().units : UNIT_COLORS.map(x => [x[0], x[1], 'var(--on-color)']);

function starShadows(n, maxY, glow){
  const a = [];
  for (let i=0;i<n;i++) a.push(`${(Math.random()*100).toFixed(1)}vw ${(Math.random()*maxY).toFixed(1)}vh 0 ${Math.random()<.25?glow:0}px rgba(255,255,255,${(.45+Math.random()*.55).toFixed(2)})`);
  return a.join(',');
}
function snowShadows(n){
  const a = [];
  for (let i=0;i<n;i++){
    const x = (Math.random()*100).toFixed(1), y = Math.random()*100, o = (.5+Math.random()*.5).toFixed(2);
    a.push(`${x}vw ${y.toFixed(1)}vh 0 0 rgba(255,255,255,${o})`, `${x}vw ${(y+100).toFixed(1)}vh 0 0 rgba(255,255,255,${o})`);
  }
  return a.join(',');
}
function applySeason(view){
  const name = seasonName(), b = document.body;
  b.classList.toggle('seasonal', !!name);
  Object.keys(THEMES).forEach(k => b.classList.toggle('theme-'+k, k===name));
  if (view) b.dataset.view = view;
  let sc = document.getElementById('scene');
  if (sc && sc.dataset.theme !== name){ sc.remove(); sc = null; }
  if (name && !sc){
    sc = document.createElement('div');
    sc.id = 'scene'; sc.dataset.theme = name; sc.setAttribute('aria-hidden','true');
    sc.innerHTML = `<div class="stars s1"></div><div class="stars s2"></div><div class="moon"><i></i><i></i><i></i></div>${THEMES[name].sky}${THEMES[name].ground}`;
    b.prepend(sc);
    sc.querySelector('.s1').style.boxShadow = starShadows(80, 70, .6);
    sc.querySelector('.s2').style.boxShadow = starShadows(24, 60, 1.2);
    [['.sn1',110],['.sn2',55],['.sn3',22]].forEach(([sel,n]) => { const el = sc.querySelector(sel); if (el) el.style.boxShadow = snowShadows(n); });
  }
}
function decorFor(u){
  const T = TH(); if (!T) return null;
  const d = document.createElement('div');
  d.className = 'decor ' + (u%2 ? 'r' : 'l');
  d.setAttribute('aria-hidden','true');
  d.innerHTML = T.decor[u % T.decor.length];
  return d;
}

/* candy / snow bursts */
function burst(x, y, n, rain){
  try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch(e){}
  const T = TH();
  const cv = document.createElement('canvas'); cv.className = 'fx'; document.body.appendChild(cv);
  const dpr = Math.min(2, window.devicePixelRatio||1), W = innerWidth, H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  const g = cv.getContext('2d'); g.scale(dpr,dpr);
  const kinds = T ? T.fx : ['rect'];
  const cols = T ? T.colors : ['#2F6BE0','#1FA35B','#FFB020','#DE444A','#9B6BFF'];
  const P = [...Array(n)].map(() => ({
    x: rain ? Math.random()*W : x, y: rain ? -30 - Math.random()*H*.7 : y,
    vx: rain ? (Math.random()-.5)*1.4 : (Math.random()-.5)*10, vy: rain ? 2+Math.random()*3 : -4-Math.random()*8,
    r: Math.random()*6.28, vr: (Math.random()-.5)*.25, s: 9+Math.random()*9,
    k: kinds[Math.floor(Math.random()*kinds.length)], c: cols[Math.floor(Math.random()*cols.length)]
  }));
  const life = rain ? 3400 : 1100, t0 = performance.now();
  function shape(p){
    const s = p.s;
    g.save(); g.translate(p.x, p.y); g.rotate(p.r);
    if (p.k==='corn'){
      g.beginPath(); g.moveTo(0,-s); g.lineTo(s*.75,s*.8); g.quadraticCurveTo(0,s*1.05,-s*.75,s*.8); g.closePath(); g.save(); g.clip();
      g.fillStyle='#FFF4E0'; g.fillRect(-s,-s,2*s,2*s); g.fillStyle='#FF8A1F'; g.fillRect(-s,-s/3,2*s,2*s); g.fillStyle='#FFD447'; g.fillRect(-s,s*.35,2*s,s); g.restore();
    } else if (p.k==='wrap'){
      g.fillStyle=p.c; g.beginPath(); g.arc(0,0,s*.45,0,6.29); g.fill();
      g.beginPath(); g.moveTo(-s*.4,0); g.lineTo(-s,-s*.4); g.lineTo(-s,s*.4); g.closePath(); g.moveTo(s*.4,0); g.lineTo(s,-s*.4); g.lineTo(s,s*.4); g.closePath(); g.fill();
    } else if (p.k==='pump'){
      g.fillStyle='#FF8A1F'; g.beginPath(); g.ellipse(0,0,s*.6,s*.48,0,0,6.29); g.fill(); g.fillStyle='#3D6B2A'; g.fillRect(-1.5,-s*.7,3,s*.3);
    } else if (p.k==='star'){
      g.fillStyle=p.c; g.beginPath();
      for (let i=0;i<10;i++){ const a=i*Math.PI/5-Math.PI/2, rr=i%2?s*.25:s*.6; g.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
      g.closePath(); g.fill();
    } else if (p.k==='flake'){
      g.strokeStyle='#FFFFFF'; g.lineWidth=2; g.lineCap='round'; g.beginPath();
      for (let i=0;i<6;i++){ const a=i*Math.PI/3; g.moveTo(0,0); g.lineTo(Math.cos(a)*s*.55, Math.sin(a)*s*.55); }
      g.stroke();
    } else if (p.k==='ball'){
      g.fillStyle=p.c; g.beginPath(); g.arc(0,0,s*.45,0,6.29); g.fill(); g.fillStyle='rgba(255,255,255,.7)'; g.beginPath(); g.arc(-s*.15,-s*.15,s*.12,0,6.29); g.fill(); g.fillStyle='#FFD166'; g.fillRect(-s*.15,-s*.6,s*.3,s*.18);
    } else if (p.k==='gift'){
      g.fillStyle=p.c==='#FFFFFF'?'#E8434E':p.c; g.fillRect(-s*.45,-s*.4,s*.9,s*.8); g.fillStyle='#FFD166'; g.fillRect(-s*.08,-s*.4,s*.16,s*.8); g.fillRect(-s*.45,-s*.08,s*.9,s*.16);
    } else {
      g.fillStyle=p.c; g.fillRect(-s/2,-s/4,s,s/2);
    }
    g.restore();
  }
  function frame(now){
    const t = now - t0;
    g.clearRect(0,0,W,H);
    g.globalAlpha = t > life*.7 ? Math.max(0, 1-(t-life*.7)/(life*.3)) : 1;
    P.forEach(p => { p.vy += rain ? .04 : .34; p.x += p.vx; p.y += p.vy; p.r += p.vr; shape(p); });
    if (t < life) requestAnimationFrame(frame); else cv.remove();
  }
  requestAnimationFrame(frame);
}

/* ---------- progress report for a parent ---------- */
function buildReport(){
  const now = new Date();
  const who = S.name || 'Times Trail';
  const finished = ORDER.filter(n => activeKinds().every(K => S.done[n+K.k]));
  const started = ORDER.filter(n => !finished.includes(n) && activeKinds().some(K => S.done[n+K.k]));
  const weekAgo = Date.now() - 7*864e5;
  const week = S.log.filter(e => e.t >= weekAgo);
  const days = new Set(week.map(e => dayKey(new Date(e.t)))).size;
  const acc = week.length ? Math.round(week.reduce((s,e)=>s+e.acc,0)/week.length) : null;
  const mins = Math.round(week.reduce((s,e)=>s+e.secs,0)/60);
  const last = S.log.length ? new Date(S.log[S.log.length-1].t) : null;
  const weak = weakFacts().slice(0,6);
  const lines = [
    `${who} — math progress (${now.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})})`,
    ``,
    `Streak: ${liveStreak()} day${liveStreak()===1?'':'s'} · Total XP: ${S.xp}`,
    `Practicing: ${divOn() ? 'multiplication and division' : 'multiplication only'}`,
    `Tables mastered: ${finished.length ? finished.map(n=>n+'s').join(', ') : 'none yet'}`,
    `Final exam: ${S.exam.best===null ? 'not taken yet' : `best ${S.exam.best}%, last ${S.exam.last.pct}%${S.exam.passed ? ` — PASSED ${new Date(S.exam.passed).toLocaleDateString(undefined,{month:'short',day:'numeric'})}` : ` (needs ${EXAM_PASS}%)`}`}`,
    `Working on: ${started.length ? started.map(n=>`${n}s (${activeKinds().filter(K=>S.done[n+K.k]).length}/${activeKinds().length})`).join(', ') : '—'}`,
    ``,
    `Last 7 days: ${week.length} lesson${week.length===1?'':'s'} on ${days} day${days===1?'':'s'}, about ${mins} min`,
    `First-try accuracy: ${acc===null ? '—' : acc+'%'}`,
    `Facts memorized: ${masteredCount()} of 78 (fast and correct on 3 different days)`,
    `Daily Mix: ${S.dailyLast ? (dayKey(new Date(S.dailyLast))===dayKey() ? 'done today' : 'last done ' + new Date(S.dailyLast).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})) : 'not started yet'}`,
    `Needs practice: ${weak.length ? weak.map(w=>`${w.k} (missed ${w.w})`).join(', ') : 'nothing right now'}`,
    `Last practiced: ${last ? last.toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : 'not yet'}`
  ];
  if (week.length){
    lines.push('', 'Recent lessons:');
    S.log.slice(-5).reverse().forEach(e => lines.push(`• ${new Date(e.t).toLocaleDateString(undefined,{weekday:'short'})} ${e.label} — ${e.acc}%, ${e.wrong} wrong`));
  }
  lines.push('', 'Fact map (row × column):', '🟩 memorized  🟨 learning  🟥 needs work  ⬜ not yet', factMapText());
  return lines.join('\n');
}
/* ---------- backup codes ---------- */
const BK_LABEL = 'Backup code (Settings → Backup & restore):';
const b64enc = (u8) => { let t = ''; for (let i=0;i<u8.length;i+=0x8000) t += String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(t); };
const b64dec = (str) => Uint8Array.from(atob(str), c => c.charCodeAt(0));
async function pipeBytes(bytes, stream){ return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer()); }
async function makeBackup(){
  const data = JSON.stringify(Object.assign({}, S, {log:S.log.slice(-60), saved:Date.now()}));
  let bytes = new TextEncoder().encode(data), tag = 'TT2';
  if (window.CompressionStream){ try { bytes = await pipeBytes(bytes, new CompressionStream('deflate-raw')); tag = 'TT2Z'; } catch(e){} }
  return tag + '-' + b64enc(bytes);
}
async function readBackup(text){
  const at = text.lastIndexOf('TT2');
  if (at < 0) throw new Error('none');
  const m = text.slice(at).replace(/\s+/g,'').match(/^(TT2Z?)-([A-Za-z0-9+/]+=*)/);
  if (!m) throw new Error('format');
  let bytes = b64dec(m[2]);
  if (m[1]==='TT2Z') bytes = await pipeBytes(bytes, new DecompressionStream('deflate-raw'));
  const obj = JSON.parse(new TextDecoder().decode(bytes));
  if (!obj || typeof obj.done!=='object' || typeof obj.xp!=='number' || !Array.isArray(obj.log)) throw new Error('data');
  return obj;
}
function describeBackup(o){
  const mastered = ORDER.filter(n => o.done[n+'mix']).length;
  const when = o.saved ? new Date(o.saved).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : 'unknown date';
  return `Found: ${o.name || 'no name'} · ${o.xp} XP · ${mastered} of 12 tables mastered${o.exam && o.exam.passed ? ' · exam passed' : ''} · backed up ${when}`;
}
function copyText(text, btn, fallbackEl, label){
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = label; }, 2000);
  }).catch(() => {
    const r = document.createRange(); r.selectNodeContents(fallbackEl);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    btn.textContent = 'Selected — press copy';
  });
}
const hasUndo = () => { try { return localStorage.getItem(KEY+'.undo') !== null; } catch(e){ return false; } };

/* ---------- backup & restore sheet ---------- */
function openBackup(){
  let code = '', found = null, armed = false, token = 0;
  const o = $(`<div class="overlay"><div class="sheet" role="dialog" aria-label="Backup and restore">
    <h3>Backup</h3>
    <p>All the progress on this device, saved as one code. Text it to a parent to keep it safe.</p>
    <pre class="report code" id="code">Making backup code…</pre>
    <button class="btn" id="copyb">Copy backup code</button>
    <h3 class="gap">Restore</h3>
    <p>Paste a backup code, or a whole Send to Parent message, to load that progress here. It replaces the progress on this device.</p>
    <label class="sr" for="rcode">Backup code</label>
    <textarea id="rcode" rows="3" placeholder="Paste a code that starts with TT2" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <p class="rmsg" id="rmsg" aria-live="polite"></p>
    <button class="btn good" id="restore" disabled>Restore this progress</button>
    ${hasUndo() ? '<button class="btn ghost" id="undo">Undo last restore</button>' : ''}
    <button class="btn ghost" id="close">Close</button>
  </div></div>`);
  const codeEl = o.querySelector('#code');
  makeBackup().then(c => { code = c; codeEl.textContent = c; })
    .catch(() => { codeEl.textContent = 'This browser could not make a backup code.'; });
  o.querySelector('#copyb').onclick = (e) => { if (code) copyText(code, e.currentTarget, codeEl, 'Copy backup code'); };

  const ta = o.querySelector('#rcode'), msg = o.querySelector('#rmsg'), rb = o.querySelector('#restore');
  ta.oninput = async () => {
    const my = ++token;
    found = null; armed = false; rb.disabled = true; rb.textContent = 'Restore this progress';
    const v = ta.value.trim();
    if (!v){ msg.textContent = ''; return; }
    try {
      const obj = await readBackup(v);
      if (my !== token) return;
      found = obj; msg.className = 'rmsg ok'; msg.textContent = describeBackup(obj); rb.disabled = false;
    } catch(err){
      if (my !== token) return;
      msg.className = 'rmsg err';
      msg.textContent = 'That code isn’t complete. Copy the whole code, starting with TT2, and paste it again.';
    }
  };
  rb.onclick = () => {
    if (!found) return;
    if (!armed){ armed = true; rb.textContent = 'Tap again to replace progress here'; return; }
    try { localStorage.setItem(KEY+'.undo', JSON.stringify(S)); } catch(e){}
    const data = Object.assign({}, found); delete data.saved;
    S = Object.assign(defaults(), data); save();
    o.remove(); renderHome(true); toast('Progress restored.');
  };
  const u = o.querySelector('#undo');
  if (u) u.onclick = () => {
    try {
      const prev = JSON.parse(localStorage.getItem(KEY+'.undo'));
      S = Object.assign(defaults(), prev); save(); localStorage.removeItem(KEY+'.undo');
      o.remove(); renderHome(false); toast('Restore undone.');
    } catch(e){ toast('Nothing to undo.'); }
  };
  o.querySelector('#close').onclick = () => o.remove();
  o.onclick = (e) => { if (e.target===o) o.remove(); };
  document.body.appendChild(o);
}

  };

  o.querySelector('#close').onclick = close;

  document.body.appendChild(o);

/* ---------- LESSON (IXL-style: wrong answers push progress back) ---------- */
function startLesson(L){
  if (L.kind==='weak' && !weakFacts().length){ toast('No missed facts to fix yet.'); return; }
  applySeason('lesson');
  const gen = makeGenerator(L);
  const exam = L.kind==='exam', daily = L.kind==='daily', fixed = exam || daily, TOTAL = exam ? EXAM_N : daily ? DAILY_N : GOAL;
  const newlyMastered = new Set();
  const byTable = {};
  let progress = 0, answered = 0, firstTryRight = 0, wrongs = 0, combo = 0;
  const retries = [];           // [{q, due}] missed facts come back soon
  const missed = new Map();
  const t0 = Date.now();
  let q, input, phase, qStart = 0;

  const scr = $(`<div class="screen lesson">
    <div class="lesson-top">
      <button class="iconbtn" id="quit" aria-label="Quit lesson">${I.x}</button>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${TOTAL}" aria-valuenow="0"><i></i></div>
      <div class="score num" id="sc">0/${TOTAL}</div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="lesson-foot" id="foot"></div></div>`);
  app.replaceChildren(scr);
  const stage = scr.querySelector('#stage'), foot = scr.querySelector('#foot');
  const bar = scr.querySelector('.bar'), barI = bar.querySelector('i'), sc = scr.querySelector('#sc');

  let quitArmed = false;
  scr.querySelector('#quit').onclick = () => {
    if ((fixed ? answered : progress)===0 || quitArmed){ renderHome(false); return; }
    quitArmed = true; toast(`Tap × again to quit. This ${exam?'exam':'lesson'} won’t be saved.`);
    setTimeout(()=>quitArmed=false, 2500);
  };

  function setBar(dropped){
    const v = fixed ? answered : progress;
    barI.style.width = (v/TOTAL*100)+'%';
    sc.textContent = v+'/'+TOTAL;
    bar.setAttribute('aria-valuenow', v);
    bar.classList.toggle('drop', !!dropped); sc.classList.toggle('drop', !!dropped);
  }

  const blankHTML = () => `<span class="blank ${input===''?'empty':''}" id="blank">${input===''?'0':input}</span>`;
  const tok = (part) => q.blank===part ? blankHTML() : `<span>${q[part]}</span>`;

  function next(){
    if (fixed ? answered >= TOTAL : progress >= GOAL) return finish();
    const due = retries.findIndex(r => r.due <= answered);
    if (due > -1){ q = retries.splice(due,1)[0].q; } else q = gen();
    input = ''; phase = 'answer'; qStart = performance.now();
    if (q.kind==='strat') return renderStrat();
    let title, body, extra = '';
    if (q.kind==='skip'){
      title = `Count by ${q.n}s. What comes next?`;
      body = `<div class="bubble seq num" id="bubble">${q.seq.map(v=>`<span>${v},</span>`).join('')}${blankHTML()}</div>`;
    } else {
      title = q.retry ? 'Try this one again' : q.earlier ? `Review: the ${q.earlier}s` : q.array ? `${q.x} rows of ${q.y}. How many dots?` : q.type==='choice' ? 'Pick the right answer' : (q.blank==='r' ? 'Type the answer' : 'Find the missing number');
      body = `<div class="bubble num" id="bubble">${tok('x')}<span class="op">${q.op}</span>${tok('y')}<span class="op">=</span>${tok('r')}</div>`;
      if (q.array) extra = `<div class="array-box">${arraySVG(q.x, q.y)}</div>`;
      if (q.family) extra = `<div class="helper"><b>Fact family</b><span>Think: ${q.y} × what = ${q.x}?</span></div>`;
      if (q.help) extra = `<div class="helper"><b>Tip</b><span>${esc(TIPS[q.f[0]] || '')}</span></div>`;
      if (q.retry) extra = `<div class="helper"><b>Remember</b><span>${esc(explain(q))}</span></div>`;
    }
    stage.innerHTML = `<div><div class="combo">${fixed ? `Question ${answered+1} of ${TOTAL}` : (combo>=3?combo+' in a row':'')}</div><h2 class="kicker">${title}</h2></div>
      <div class="prompt-row">${pip(combo>=3?'wow':'happy')}${body}</div>${extra}<div id="ans"></div>`;
    const ans = stage.querySelector('#ans');
    if (q.type==='choice'){
      ans.className = 'choices';
      q.opts.forEach((v,i) => {
        const b = $(`<button class="choice num"><small>${i+1}</small>${v}</button>`);
        b.onclick = () => pick(i); ans.appendChild(b);
      });
    } else {
      ans.className = 'keypad';
      [1,2,3,4,5,6,7,8,9,'C',0,'⌫'].forEach(k => {
        const b = $(`<button class="key num" data-k="${k}" aria-label="${k==='⌫'?'Delete':k==='C'?'Clear':k}">${k==='⌫'?I.back:k}</button>`);
        b.onclick = () => press(k); ans.appendChild(b);
      });
    }
    foot.className = 'lesson-foot';
    foot.innerHTML = `<button class="btn" id="check" disabled>Check</button>`;
    foot.querySelector('#check').onclick = check;
    setBar(false);
    setKeys(onKey);
  }

  /* ----- Strategy problems: one screen per step ----- */
  function renderStrat(){
    const guided = q.mode==='guided';
    q.ans = guided ? q.steps[q.si].a : q.r;
    const title = guided ? (q.retry ? 'Let’s walk through that one' : 'Work it out step by step')
      : q.mode==='hint' ? 'Use the tip to work it out' : 'Work it out your way';
    const body = `<div class="bubble num" id="bubble"><span>${q.x}</span><span class="op">×</span><span>${q.y}</span><span class="op">=</span>${guided ? '<span class="qm">?</span>' : blankHTML()}</div>`;
    let extra = '';
    if (guided || q.mode==='hint' || q.showHint) extra += `<div class="helper"><b>${esc(q.name)}</b><span>${esc(q.hint)}</span></div>`;
    if (guided){
      extra += '<div class="steps">' + q.steps.slice(0, q.si+1).map((s,i) => i < q.si
        ? `<div class="step done num"><span>${esc(s.t)} = ${s.a}</span><span class="ok">${I.check}</span></div>`
        : `<div class="step cur num"><span>${esc(s.t)} =</span>${blankHTML()}</div>`).join('') + '</div>';
    } else {
      extra += `<div class="strat-tools">${q.showHint || q.mode==='hint' ? '' : '<button class="btn ghost" id="hintb">Hint</button>'}<button class="btn ghost" id="stepsb">Show steps</button></div>`;
    }
    stage.innerHTML = `<div><div class="combo">${combo>=3?combo+' in a row':''}</div><h2 class="kicker">${title}</h2></div>
      <div class="prompt-row">${pip(combo>=3?'wow':'happy')}${body}</div>${extra}<div id="ans" class="keypad"></div>`;
    const hb = stage.querySelector('#hintb'); if (hb) hb.onclick = () => { sfx.tap(); q.showHint = true; renderStrat(); };
    const sb = stage.querySelector('#stepsb'); if (sb) sb.onclick = () => { sfx.tap(); q.mode = 'guided'; q.si = 0; q.helped = true; input = ''; renderStrat(); };
    const ans = stage.querySelector('#ans');
    [1,2,3,4,5,6,7,8,9,'C',0,'⌫'].forEach(k => {
      const b = $(`<button class="key num" data-k="${k}" aria-label="${k==='⌫'?'Delete':k==='C'?'Clear':k}">${k==='⌫'?I.back:k}</button>`);
      b.onclick = () => press(k); ans.appendChild(b);
    });
    foot.className = 'lesson-foot';
    foot.innerHTML = `<button class="btn" id="check" disabled>Check</button>`;
    foot.querySelector('#check').onclick = check;
    refreshBlank();
    setBar(false);
    setKeys(onKey);
  }
  function queueStratRetry(){
    if (q.queued) return;
    q.queued = true;
    retries.push({q: Object.assign({}, q, {mode:'guided', si:0, retry:true, showHint:false, helped:false}), due: answered + 2});
  }
  function checkStrat(ok){
    answered++;
    const guided = q.mode==='guided', last = !guided || q.si === q.steps.length-1;
    const label = `${q.x} × ${q.y}`, full = `${label} = ${q.r}`;
    if (ok && !last){              // a middle step: tick it and move on
      sfx.good();
      const row = stage.querySelector('.step.cur'); if (row) row.classList.add('pop');
      setTimeout(() => { q.si++; input = ''; phase = 'answer'; renderStrat(); }, 450);
      return;
    }
    let go;
    if (ok){
      progress++; combo++;
      if (!q.retry && !q.helped) firstTryRight++;
      sfx.good();
      const bub = stage.querySelector('#bubble'); bub.classList.add('pop');
      const br = bub.getBoundingClientRect(); burst(br.left + br.width/2, br.top + br.height/2, 16);
      const TP = TH(), PR = TP ? TP.praise : ['Nice!','Correct!','Great job!','You got it!','Awesome!'];
      const praise = combo>=5 ? (TP ? TP.fire : 'On fire!') : PR[ri(0, PR.length-1)];
      foot.className = 'lesson-foot good';
      foot.innerHTML = `<div class="fb"><div class="badge">${I.check}</div><div><h4>${praise}</h4><p class="num">${full}</p>${guided ? '' : `<p class="how">${esc(q.summary)}.</p>`}</div></div><button class="btn good" id="go">Continue</button>`;
      go = next;
    } else {
      wrongs++; combo = 0;
      const lost = Math.min(1, progress); progress -= lost;
      missed.set(label, (missed.get(label)||0)+1);
      if (!q.retry) queueStratRetry();
      sfx.bad();
      (stage.querySelector('.step.cur') || stage.querySelector('#bubble')).classList.add('shake');
      const m = stage.querySelector('.mascot'); if (m) m.outerHTML = pip('sad');
      const s = guided ? q.steps[q.si] : null;
      const head = `${TH() ? TH().wrong : 'Not quite'}${lost?` · −${lost}`:''}`;
      const line = guided ? `${s.t} = ${s.a}` : `Answer: ${full}`;
      const how = guided ? (last ? 'That finishes it. You’ll get another one like it soon.' : 'Fill that in and keep going.') : q.summary + '.';
      foot.className = 'lesson-foot bad';
      foot.innerHTML = `<div class="fb"><div class="badge">${I.x}</div><div><h4>${head}</h4><p class="num">${line}</p><p class="how">${esc(how)}</p></div></div><button class="btn bad" id="go">Got it</button>`;
      go = (guided && !last) ? () => { q.si++; input = ''; phase = 'answer'; renderStrat(); } : next;
    }
    setBar(!ok);
    const btn = foot.querySelector('#go');
    btn.onclick = go; btn.focus({preventScroll:true});
  }

  function refreshBlank(){
    const b = stage.querySelector('#blank');
    if (b){ b.textContent = input===''?'0':input; b.classList.toggle('empty', input===''); }
    foot.querySelector('#check').disabled = input==='';
  }
  function press(k){
    if (phase!=='answer') return;
    if (k==='⌫') input = input.slice(0,-1);
    else if (k==='C') input = '';
    else if (input.length<3) input = (input==='0'?'':input) + k;
    refreshBlank();
  }
  function pick(i){
    if (phase!=='answer') return;
    sfx.tap(); input = String(q.opts[i]);
    stage.querySelectorAll('.choice').forEach((b,j)=>b.classList.toggle('sel', i===j));
    refreshBlank();
  }

  function check(){
    if (phase!=='answer' || input==='') return;
    phase = 'feedback';
    const ok = Number(input)===q.ans;
    if (q.kind==='strat') return checkStrat(ok);
    const k = factKey(q.f), rec = S.facts[k] || {c:0,w:0};
    if (q.kind==='fact'){
      const ms = performance.now() - qStart, today = dayKey();
      if (q.type==='type' && !q.retry){
        if (ok){
          rec.t = rec.t ? Math.round(rec.t*.6 + ms*.4) : Math.round(ms);
          if (ms <= FAST_MS && rec.fd !== today){ rec.fs = (rec.fs||0) + 1; rec.fd = today; if (rec.fs === 3) newlyMastered.add(k); }
        } else rec.fs = 0;
      }
      rec.last = Date.now();
    }
    answered++;
    if (exam){ const t = byTable[q.table] || (byTable[q.table] = {c:0,t:0}); t.t++; if (ok) t.c++; }
    const full = q.kind==='skip' ? `${q.seq.join(', ')}, ${q.ans}` : `${q.x} ${q.op} ${q.y} = ${q.r}`;
    if (ok){
      rec.c++; if (rec.w>0 && !q.retry) rec.w--;
      progress++; combo++;
      if (!q.retry) firstTryRight++;
      sfx.good();
      const bub = stage.querySelector('#bubble'); bub.classList.add('pop');
      const br = bub.getBoundingClientRect(); burst(br.left + br.width/2, br.top + br.height/2, 16);
      const TP = TH(), PR = TP ? TP.praise : ['Nice!','Correct!','Great job!','You got it!','Awesome!'];
      const praise = combo>=5 ? (TP ? TP.fire : 'On fire!') : PR[ri(0, PR.length-1)];
      foot.className = 'lesson-foot good';
      foot.innerHTML = `<div class="fb"><div class="badge">${I.check}</div><div><h4>${praise}</h4><p class="num">${full}</p></div></div><button class="btn good" id="go">Continue</button>`;
      setBar(false);
    } else {
      rec.w++; wrongs++; combo = 0;
      const lost = fixed ? 0 : Math.min(DROP, progress);
      progress -= lost;
      missed.set(k, (missed.get(k)||0)+1);
      if (!exam){
        const again = Object.assign({}, q, {retry:true, type:'type', blank: q.kind==='skip' ? q.blank : 'r'});
        if (again.kind==='fact') again.ans = again.r;
        delete again.opts;
        retries.push({q:again, due: answered + 2});
      }
      sfx.bad();
      stage.querySelector('#bubble').classList.add('shake');
      const m = stage.querySelector('.mascot'); if (m) m.outerHTML = pip('sad');
      const how = q.kind==='skip' ? `Add ${q.n} each time: ${q.seq[2]} + ${q.n} = ${q.ans}.` : explain(q);
      foot.className = 'lesson-foot bad';
      foot.innerHTML = `<div class="fb"><div class="badge">${I.x}</div><div><h4>${TH() ? TH().wrong : 'Not quite'}${lost?` · −${lost}`:''}</h4><p class="num">Answer: ${full}</p><p class="how">${esc(how)}</p></div></div><button class="btn bad" id="go">Got it</button>`;
      setBar(!fixed);
    }
    S.facts[k] = rec; save();
    const go = foot.querySelector('#go');
    go.onclick = next; go.focus({preventScroll:true});
  }

  function onKey(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key==='Enter'){ e.preventDefault(); if (phase==='answer') check(); else foot.querySelector('#go')?.click(); return; }
    if (phase!=='answer') return;
    if (q.type==='choice'){ const n = Number(e.key); if (n>=1 && n<=4){ keySound(e.key); pick(n-1); } return; }
    if (/^[0-9]$/.test(e.key)){ keySound(e.key); press(Number(e.key)); }
    else if (e.key==='Backspace'){ keySound('⌫'); press('⌫'); }
    else if (e.key==='Escape') press('C');
  }

  function finish(){
    setKeys(null);
    const secs = Math.round((Date.now()-t0)/1000);
    const accuracy = Math.min(100, Math.round((answered - wrongs)/answered*100));
    const passed = exam && accuracy >= EXAM_PASS;
    const gained = exam ? 30 + (passed ? 20 : 0) : daily ? 15 + (wrongs===0 ? 5 : 0) : 10 + (wrongs===0 ? 5 : 0);
    if (daily) S.dailyLast = Date.now();
    if (exam){
      S.exam.last = {pct:accuracy, t:Date.now()};
      if (S.exam.best===null || accuracy > S.exam.best) S.exam.best = accuracy;
      if (passed && !S.exam.passed) S.exam.passed = Date.now();
    }
    S.xp += gained;
    const today = dayKey();
    if (S.daily.date!==today) S.daily = {date:today, xp:0};
    S.daily.xp += gained;
    if (S.streak.last!==today){
      S.streak.count = S.streak.last===yesterday() ? S.streak.count+1 : 1;
      S.streak.last = today;
    }
    if (L.unit) S.done[L.id] = true;
    if (L.kind==='strat') S.stratDone = (S.stratDone||0) + 1;
    const label = L.unit ? `${L.unit}s ${L.name}` : L.name;
    S.log.push({t:Date.now(), label, acc:accuracy, wrong:wrongs, secs});
    if (S.log.length > 200) S.log = S.log.slice(-200);
    save(); applySeason('results'); sfx.win(); setTimeout(() => burst(0, 0, TH() ? 90 : 70, true), 200);
    const mm = Math.floor(secs/60), ss = String(secs%60).padStart(2,'0');
    const res = $(`<div class="screen">
      <div class="results">
        ${pip('wow')}
        <h1 class="${exam && !passed ? 'miss' : ''}">${exam ? (accuracy===100 ? 'Perfect Final Exam!' : passed ? 'You passed the Final Exam!' : 'Almost there!') : (wrongs===0 ? (TH() ? TH().perfect : 'Perfect lesson!') : (TH() ? TH().complete : 'Lesson complete!'))}</h1>
        <p class="sub">${exam ? `${answered - wrongs} of ${TOTAL} right · ${passed ? 'Passed' : `need ${EXAM_PASS}% to pass. Practice the red tables and try again.`}` : esc(L.unit ? `The ${L.unit}s · ${L.name}` : L.name)}</p>
        <div class="tiles">
          <div class="tile" style="--t:var(--sun)"><div class="h">XP</div><div class="v num">+${gained}</div></div>
          <div class="tile" style="--t:var(--good)"><div class="h">${exam?'Score':'Accuracy'}</div><div class="v num">${accuracy}%</div></div>
          <div class="tile" style="--t:var(--accent)"><div class="h">Time</div><div class="v num">${mm}:${ss}</div></div>
        </div>
        ${daily ? `<p class="sub num">${masteredCount()} of 78 facts memorized</p>` : ''}
        ${newlyMastered.size ? `<div class="missed win"><b>Newly memorized</b><div class="num">${[...newlyMastered].map(s=>`<span>${s}</span>`).join('')}</div></div>` : ''}
        ${exam ? `<div class="exam-grid num">${ORDER.slice().sort((a,b)=>a-b).map(n => { const t = byTable[n] || {c:0,t:0}; return `<span class="${t.c===t.t?'ok':t.c===t.t-1?'meh':'no'}">${n}s ${t.c}/${t.t}</span>`; }).join('')}</div>` : ''}
        ${missed.size ? `<div class="missed"><b>Practice these</b><div class="num">${[...missed.keys()].map(s=>`<span>${s}</span>`).join('')}</div></div>` : ''}
      </div>
      <div class="res-foot"><button class="btn" id="cont">Continue</button></div></div>`);
    res.querySelector('#cont').onclick = () => renderHome(true);
    app.replaceChildren(res);
    setKeys(e => { if (e.key==='Enter'){ e.preventDefault(); renderHome(true); } });
  }

  next();
}

renderHome(true);
})();
</script>

</body></html>
